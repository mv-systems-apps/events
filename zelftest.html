<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zelftest</title>
<style>
  :root{
    --bg:#0e1219; --panel:#161b24; --line:#28313f; --txt:#e7eaf0;
    --muted:#98a2b3; --accent:#7aa2f7; --ok:#4ec9a5; --danger:#f2777a;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0; padding:16px; background:var(--bg); color:var(--txt);
    font-family:var(--mono); font-size:17px; line-height:1.45;
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
  }
  h1{margin:0 0 4px; font-size:24px; letter-spacing:.02em}
  .uitleg{color:var(--muted); font-size:16px; margin-bottom:14px}
  .knoppen{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  button{
    height:44px; padding:0 16px; border:1px solid var(--line); border-radius:8px;
    background:#28313f; color:var(--txt); font:inherit; font-size:17px;
  }
  button:hover{border-color:var(--accent)}
  button.primair{background:var(--accent); color:#0e1219; border-color:var(--accent); font-weight:600}
  .totaal{
    padding:10px 14px; border:1px solid var(--line); border-radius:8px;
    background:var(--panel); margin-bottom:12px; font-size:19px;
  }
  .totaal.goed{border-color:var(--ok); color:var(--ok)}
  .totaal.fout{border-color:var(--danger); color:var(--danger)}
  /* alles wat misging, bij elkaar onder de uitslag */
  .samenvatting{margin-top:10px; border-top:1px solid var(--line); padding-top:8px}
  .samenvattingGroep{
    color:var(--muted); font-size:14px; letter-spacing:.04em;
    text-transform:uppercase; margin:8px 0 4px;
  }
  .samenvattingRegel{font-size:15px; line-height:1.4; margin-bottom:6px}
  .groep{
    font-size:15px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.04em; margin:14px 0 6px;
  }
  .regel{
    display:flex; gap:10px; align-items:flex-start;
    padding:5px 0; border-top:1px solid var(--line);
  }
  .merk{flex:0 0 auto; width:2ch; text-align:center}
  .regel.goed .merk{color:var(--ok)}
  .regel.fout .merk{color:var(--danger)}
  .wat{flex:1; min-width:0; overflow-wrap:anywhere}
  .uitkomst{color:var(--muted); font-size:15px}
  .regel.fout .uitkomst{color:var(--danger)}
</style>
</head>
<body>

<h1>Zelftest</h1>
<div class="uitleg">
  Controleert de datumregels van events.html en events_lite.js tegen uitkomsten
  die met de hand zijn nagerekend. Zet dit bestand naast de andere twee.
</div>

<div class="knoppen">
  <button class="primair" id="start">Alles nakijken</button>
  <button id="opnieuw" hidden>Opnieuw</button>
</div>

<div id="totaal" class="totaal" hidden></div>
<div id="uitslag"></div>

<!-- Het venstertje staat buiten beeld in plaats van op hidden. Met hidden is er
     geen opmaak, en dan is er ook geen focus en geen zichtbaarheid te meten --
     precies wat de focuscontroles nodig hebben. Het blijft onzichtbaar, en
     aria-hidden houdt het buiten een schermlezer. -->
<iframe id="app" src="events.html" aria-hidden="true" title="de app, voor de controles"
        style="position:fixed;left:-10000px;top:0;width:420px;height:760px;border:0"></iframe>

<script>
/* De app wordt in een verborgen venstertje geladen, zodat de zelftest de echte
   functies gebruikt en er niets hoeft te worden gedupliceerd. */
var app = null;

function laadApp(){
  var f = document.getElementById('app');

  /* Kijken of de app er al is. Een vers venstertje toont eerst een leeg
     document dat zichzelf al klaar noemt, dus wachten op 'geladen' is niet
     genoeg: er wordt gekeken of de functies er werkelijk staan. */
  function pak(){
    try {
      var w = f.contentWindow;
      if(w && (typeof w.dgVan === 'function')) return w;
    } catch(e){
      /* een pagina die met file:// is geopend mag niet in een ander bestand
         kijken; dat komt hieronder als melding naar boven */
      return 'geen toegang \u2014 ' + e.message;
    }
    return null;
  }

  return new Promise(function(klaar, mis){
    var wacht = 0;
    (function nogEens(){
      var w = pak();
      if(typeof w === 'string'){ mis(new Error(w)); return; }
      if(w){ app = w; klaar(app); return; }
      wacht += 100;
      if(wacht > 8000){
        mis(new Error('events.html is niet op tijd geladen, of de functies staan er niet in'));
        return;
      }
      setTimeout(nogEens, 100);
    })();
  });
}

/* ------------------ het raamwerk ------------------ */

var _groep = '', _goed = 0, _fout = 0, _rood = [];

function groep(naam){
  _groep = naam;
  var el = document.createElement('div');
  el.className = 'groep';
  el.textContent = naam;
  document.getElementById('uitslag').appendChild(el);
}

function eis(wat, gekregen, verwacht){
  var ok = String(gekregen) === String(verwacht);
  if(ok) _goed++;
  else {
    _fout++;
    /* onthouden waar het misging, zodat het bovenaan bij elkaar staat; op een
       telefoon is 600 regels doorscrollen geen doen */
    _rood.push({ groep:_groep, wat:wat, gekregen:gekregen, verwacht:verwacht });
  }
  var el = document.createElement('div');
  el.className = 'regel ' + (ok ? 'goed' : 'fout');
  el.innerHTML = '<span class="merk">' + (ok ? '\u2713' : '\u2717') + '</span>' +
    '<span class="wat">' + esc(wat) +
    (ok ? '' : '<br><span class="uitkomst">gekregen ' + esc(gekregen) +
               ', verwacht ' + esc(verwacht) + '</span>') + '</span>';
  document.getElementById('uitslag').appendChild(el);
}

/* Een regel zonder oordeel: een meting hoort niet goed of fout te zijn. Op een
   telefoon zegt een drempel weinig -- het getal zelf wel. */
function meld(wat, waarde){
  var el = document.createElement('div');
  el.className = 'regel';
  el.innerHTML = '<span class="merk">\u00b7</span><span class="wat">' + esc(wat) +
                 ' <strong>' + esc(waarde) + '</strong></span>';
  document.getElementById('uitslag').appendChild(el);
}

function esc(t){
  return String(t).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

function toonTotaal(){
  var el = document.getElementById('totaal');
  el.hidden = false;
  el.className = 'totaal ' + (_fout ? 'fout' : 'goed');
  var kop = _fout
    ? _fout + ' van de ' + (_goed + _fout) + ' controles gaat mis'
    : 'Alle ' + _goed + ' controles kloppen';
  /* Alles wat misging meteen hieronder, per groep. Zo is een uitslag met een
     enkele schermafdruk te delen in plaats van met tien. */
  var lijst = '';
  if(_rood.length){
    var vorige = '';
    lijst = '<div class="samenvatting">';
    _rood.forEach(function(r){
      if(r.groep !== vorige){
        lijst += '<div class="samenvattingGroep">' + esc(r.groep) + '</div>';
        vorige = r.groep;
      }
      lijst += '<div class="samenvattingRegel">' + esc(r.wat) +
               '<br><span class="uitkomst">gekregen ' + esc(r.gekregen) +
               ', verwacht ' + esc(r.verwacht) + '</span></div>';
    });
    lijst += '</div>';
  }
  el.innerHTML = '<div class="totaalKop">' + esc(kop) + '</div>' + lijst;
  document.getElementById('opnieuw').hidden = false;
}

/* Blijft kijken tot het zover is, in plaats van een vast aantal milliseconden
   te gokken. Op een traag toestel is dat het verschil tussen een uitslag en
   een rij rode regels die niets met de app te maken hebben. */
function tot(klaar, max){
  var eind = Date.now() + (max || 8000);
  return new Promise(function(af){
    (function kijk(){
      if(klaar() || Date.now() > eind) return af();
      setTimeout(kijk, 10);
    })();
  });
}

/* ------------------ de macro laden en aanroepen ------------------ */
/* De macro staat in een bestand dat zichzelf niet uitvoert; hier wordt hij op
   dezelfde manier aangeroepen als de wrapper in MacroDroid dat doet. Die zet
   de tekst in een template literal, dus de dubbele backslashes gaan er hier
   net zo goed uit. */

function laadMacro(){
  return fetch('events_lite.js', { cache:'no-store' })
    .then(function(r){
      if(!r.ok) throw new Error('events_lite.js geeft status ' + r.status);
      return r.text();
    })
    .then(function(bron){
      var js = bron.replace(/\\\\/g, '\\');
      var fn = new Function('data', 'qry', 'cfg',
                            'return (' + js + ')(data, qry, cfg);');
      return function(data, qry, cfg){ return fn(data, qry, cfg || ''); };
    });
}

/* ------------------ de proefgegevens ------------------ */
/* Een klein bestand met bekende gevallen, zodat de uitkomsten met de hand na
   te rekenen zijn en niet meebewegen met het echte bestand. */

var PROEF = [
  'Arvenlo, Sinka;Sinka Arvenlo;Geboren;D19740812;2',
  'Brulmeer, Jovek;Jovek Brulmeer;Geboren;D20000229;2',
  'Kerst, Eerste;Eerste Kerstdag;Feestdag;D00001225;1',
  'Nieuwjaar, dag;Nieuwjaarsdag;Feestdag;D00000101;1',
  'Moederdag, tweede zondag;Moederdag;Feestdag;D00070502;1',
  'Zomertijd, laatste zondag;Zomertijd;Gebeurtenis;D00070399;1',
  'Pasen, eerste;Eerste Paasdag;Feestdag;D00080000;1',
  'Hemelvaart, dag;Hemelvaartsdag;Feestdag;D00083900;1',
  'Carnaval, dag;Carnaval;Feestdag;D00080049;1',
  'Onbekend, maand;Alleen jaar;Getrouwd;D19900000;2',
  'Onbekend, dag;Alleen maand;Getrouwd;D19900200;2;met notitie'
].join('\n');

/* ------------------ de controles ------------------ */

function testDatums(){
  groep('De datumlaag van de app');

  /* een datum is een dagnummer, dus de controles zijn met datums geschreven
     en niet met de getallen die er toevallig uitkomen */
  var dg = app.dgVan;

  eis('de onderdelen komen er weer uit', app.dgYMD(dg(1966, 10, 16)).maand, 10);
  eis('en de dag ook', app.dgYMD(dg(1966, 10, 16)).dag, 16);
  eis('16 oktober 1966 was een zondag', app.dgWeekdag(dg(1966, 10, 16)), 7);
  eis('1 januari 2026 is een donderdag', app.dgWeekdag(dg(2026, 1, 1)), 4);
  eis('een dag na 31 december', dg(2025, 12, 31) + 1, dg(2026, 1, 1));
  eis('een dag voor 1 maart 2024', dg(2024, 3, 1) - 1, dg(2024, 2, 29));
  eis('een dag voor 1 maart 2025', dg(2025, 3, 1) - 1, dg(2025, 2, 28));
  eis('dagen tussen twee jaarwisselingen', dg(2026, 1, 1) - dg(2025, 1, 1), 365);
  eis('een schrikkeljaar telt een dag meer', dg(2025, 1, 1) - dg(2024, 1, 1), 366);
  eis('einde februari in een schrikkeljaar', app.dgEindeMaand(2024, 2), dg(2024, 2, 29));
  eis('einde februari in een gewoon jaar', app.dgEindeMaand(2025, 2), dg(2025, 2, 28));
  eis('einde december', app.dgEindeMaand(2026, 12), dg(2026, 12, 31));
  eis('dagen in februari 2024', app.dgDagenInMaand(2024, 2), 29);
  eis('de tweede zondag van mei 2026', app.dgZoekWeekdag(dg(2026, 5, 1), 7, 2, 1), dg(2026, 5, 10));
  eis('de laatste zondag van maart 2026',
      app.dgZoekWeekdag(app.dgEindeMaand(2026, 3), 7, 1, -1), dg(2026, 3, 29));
  eis('de laatste zondag van oktober 2026',
      app.dgZoekWeekdag(app.dgEindeMaand(2026, 10), 7, 1, -1), dg(2026, 10, 25));
}

function testPasen(){
  groep('Pasen, met de hand nagerekend');

  var dg = app.dgVan;
  var jaren = [[2024, [3, 31]], [2025, [4, 20]], [2026, [4, 5]],
               [2027, [3, 28]], [2038, [4, 25]], [2011, [4, 24]]];
  for(var i = 0; i < jaren.length; i++){
    var j = jaren[i][0], d = jaren[i][1];
    eis('Pasen ' + j, app.paasDatum(j), dg(j, d[0], d[1]));
  }
  eis('Hemelvaart 2026 is Pasen plus 39', app.paasDatum(2026) + 39, dg(2026, 5, 14));
  eis('Carnaval 2026 is Pasen min 49', app.paasDatum(2026) - 49, dg(2026, 2, 15));
}

function testCodes(){
  groep('De datumcodes');

  var dg = app.dgVan;

  eis('een vaste datum', app.encode(app.decode('D19661016')), 'D19661016');
  eis('een wisselende dag', app.encode(app.decode('D00070502')), 'D00070502');
  eis('de laatste van de maand', app.encode(app.decode('D00070399')), 'D00070399');
  eis('Pasen plus 39', app.encode(app.decode('D00083900')), 'D00083900');
  eis('Pasen min 49', app.encode(app.decode('D00080049')), 'D00080049');
  eis('een onvolledige datum', app.encode(app.decode('D19900200')), 'D19900200');
  eis('een kapotte code geeft niets', app.decode('D1966101'), null);

  eis('de tweede zondag van mei 2026',
      app.eventDatum({ code:'D00070502' }, 2026), dg(2026, 5, 10));
  eis('de laatste zondag van maart 2026',
      app.eventDatum({ code:'D00070399' }, 2026), dg(2026, 3, 29));
  eis('Hemelvaart 2026', app.eventDatum({ code:'D00083900' }, 2026), dg(2026, 5, 14));
  eis('29 februari bestaat niet in 2026', app.eventDatum({ code:'D20000229' }, 2026), null);
  eis('29 februari bestaat wel in 2028',
      app.eventDatum({ code:'D20000229' }, 2028), dg(2028, 2, 29));
  eis('een datum zonder dag heeft geen dag',
      app.eventDatum({ code:'D19900200' }, 2026), null);
  eis('maar wel een maand', app.maandVan({ code:'D19900200' }), 2);
  eis('alleen een jaar heeft ook geen maand', app.maandVan({ code:'D19900000' }), 0);
}

function testLezen(){
  groep('Het bestand lezen en schrijven');

  var r = app.parse(PROEF);
  eis('elf regels gelezen', r.length, 11);
  eis('geen enkele onleesbaar', r.filter(function(x){ return x.raw !== undefined; }).length, 0);
  eis('de notitie komt mee', r[10].notitie, 'met notitie');
  eis('de categorie is een getal', r[0].cat, 2);

  var was = app.records;
  app.records = r;
  eis('serialiseren geeft het bestand terug', app.serialize().trim(), PROEF);
  app.records = was;

  eis('een puntkomma te veel is onleesbaar',
      app.parse('A;a;Geboren;D20000101;2;met ; erin')[0].raw !== undefined, true);
  eis('te weinig velden is onleesbaar',
      app.parse('A;a;Geboren')[0].raw !== undefined, true);
  eis('een accent telt als de kale letter',
      app.zonderAccent('Eén april'), 'Een april');
}

function testCfg(){
  groep('De configuratie keuren');

  /* een cfg kan met de hand bewerkt zijn, dus de app hoort een waarde van het
     verkeerde soort weg te laten en niet te struikelen bij het tekenen */
  function keur(json){
    var klachten = [];
    return { cfg: app.keurCfg(JSON.parse(json), klachten), klachten: klachten };
  }
  function eigen(o, k){ return Object.prototype.hasOwnProperty.call(o, k); }

  var goed = '{"bestand":"e.txt","titel":"Events","scheidingsteken":";","ofteken":"|",' +
             '"velden":["Event","Naam","Type","Datum","Categorie","Notitie"],' +
             '"types":["Geboren",{"omschrijving":"Getrouwd","teken":"&"}],' +
             '"categorieen":[{"nr":1,"omschrijving":"familie"}],' +
             '"paasdagen":[{"omschrijving":"eerste paasdag","dagen":0}]}';
  var a = keur(goed);
  eis('een goede cfg blijft ongewijzigd', JSON.stringify(a.cfg), goed);
  eis('en geeft geen klachten', a.klachten.length, 0);

  eis('een lijst is geen cfg', keur('[1,2,3]').cfg, null);
  eis('een getal is geen cfg', keur('7').cfg, null);
  eis('null is geen cfg', keur('null').cfg, null);

  eis('__proto__ wordt niet overgenomen', eigen(keur('{"__proto__":{"x":1}}').cfg, '__proto__'), false);
  eis('en het prototype blijft schoon', ({}).x, undefined);
  eis('constructor wordt niet overgenomen', eigen(keur('{"constructor":1}').cfg, 'constructor'), false);
  eis('prototype wordt niet overgenomen', eigen(keur('{"prototype":1}').cfg, 'prototype'), false);

  eis('types als tekst wordt weggelaten', keur('{"types":"abc"}').cfg.types, undefined);
  eis('een type van null wordt weggelaten',
      keur('{"types":[null,{"omschrijving":"x"}]}').cfg.types.length, 1);
  eis('een type als tekst mag blijven staan', keur('{"types":["Geboren"]}').cfg.types.length, 1);
  eis('een categorie van null wordt weggelaten',
      keur('{"categorieen":[null,{"nr":1}]}').cfg.categorieen.length, 1);
  eis('een paasdag van null wordt weggelaten',
      keur('{"paasdagen":[null,{"dagen":0}]}').cfg.paasdagen.length, 1);
  eis('velden als tekst wordt weggelaten', keur('{"velden":"abc"}').cfg.velden, undefined);
  eis('een verkeerde veldnaam schuift de rest niet op',
      keur('{"velden":["Event",5,"Type"]}').cfg.velden.join(','), 'Event,,Type');
  eis('een scheidingsteken dat geen tekst is wordt weggelaten',
      keur('{"scheidingsteken":5}').cfg.scheidingsteken, undefined);
  eis('een filter dat geen object is wordt weggelaten', keur('{"filter":[1,2]}').cfg.filter, undefined);
  eis('wat is weggelaten wordt gemeld', keur('{"types":"abc"}').klachten.length, 1);

  /* en met zo'n opgeschoonde cfg moeten alle schermen nog getekend worden */
  var bewaardCfg = app.cfg, bewaardR = app.records, bewaardS = app.fileState;
  app.cfg = keur('{"bestand":"e.txt","types":[null],"categorieen":{"nr":1},' +
                 '"paasdagen":7,"velden":42}').cfg;
  app.bestandsnaam = 'e.txt'; app.fileState = 'ok';
  app.records = app.parse(PROEF);
  var stuk = '';
  ['render', 'openCfg', 'openFilter'].forEach(function(f){
    try { app[f](); } catch(e){ stuk += f + ' '; }
  });
  try { app.rapport('bestand'); } catch(e){ stuk += 'rapport '; }
  try { app.openModal(0); } catch(e){ stuk += 'bewerken '; }
  try { app.toonInfo(0); } catch(e){ stuk += 'bekijken '; }
  app.cfg = bewaardCfg; app.records = bewaardR; app.fileState = bewaardS;
  eis('alle schermen tekenen met een opgeschoonde cfg', stuk || 'geen fouten', 'geen fouten');

  /* de icoonnaam komt ook uit de cfg, en die wordt in een tabel opgezocht:
     een naam die toevallig een eigenschap van Object is mag niets opleveren */
  var bol = app.svgIcoon('bolletje', 'x');
  ['constructor', '__proto__', 'toString', 'hasOwnProperty'].forEach(function(n){
    eis('het icoon "' + n + '" valt terug op het bolletje', app.svgIcoon(n, 'x'), bol);
  });
  eis('en levert geen broncode op', app.svgIcoon('constructor', 'x').indexOf('native code') < 0, true);
  eis('de iconen zijn nog wel alle op te sommen',
      Object.keys(app.ICONEN).indexOf('notitie') >= 0 && Object.keys(app.ICONEN).length >= 13, true);

  /* Typen in een rij van de configuratie moet in die rij landen en niet in een
     andere. Het data-attribuut houdt de plek in de lijst vast. */
  var d2 = app.document;
  app.cfgTypes = [{ omschrijving:'Eerste', icoon:'', teken:'a' },
                  { omschrijving:'Tweede', icoon:'', teken:'b' },
                  { omschrijving:'Derde', icoon:'', teken:'c' }];
  app.tekenCfgTypes();
  var velden = d2.getElementById('cfgTypes').querySelectorAll('[data-i]');
  eis('elke type-rij heeft een invoerveld', velden.length, 3);
  velden[1].value = 'Gewijzigd'; velden[1].oninput();
  eis('typen in de tweede rij landt in de tweede rij', app.cfgTypes[1].omschrijving, 'Gewijzigd');
  eis('en laat de eerste ongemoeid', app.cfgTypes[0].omschrijving, 'Eerste');
  eis('en de derde ook', app.cfgTypes[2].omschrijving, 'Derde');
  var tekens = d2.getElementById('cfgTypes').querySelectorAll('[data-tk]');
  tekens[2].value = 'z'; tekens[2].oninput();
  eis('het teken van de derde rij landt in de derde rij', app.cfgTypes[2].teken, 'z');
  eis('en dat van de eerste blijft staan', app.cfgTypes[0].teken, 'a');

  app.cfgVelden = ['A', 'B', 'C'];
  app.tekenCfgVelden();
  var vn = d2.getElementById('cfgVelden').querySelectorAll('[data-v]');
  vn[2].value = 'Nieuw'; vn[2].oninput();
  eis('een veldnaam landt op zijn eigen plek', app.cfgVelden.join(','), 'A,B,Nieuw');

  app.cfgCats = [{ nr:1, oms:'een' }, { nr:2, oms:'twee' }];
  app.tekenCfgCats();
  var co = d2.getElementById('cfgCats').querySelectorAll('[data-oms]');
  co[1].value = 'anders'; co[1].oninput();
  eis('een categorie-omschrijving landt op zijn eigen plek', app.cfgCats[1].oms, 'anders');
  eis('en de andere blijft', app.cfgCats[0].oms, 'een');

  app.cfgPaas = [{ dagen:0, omschrijving:'nul' }, { dagen:1, omschrijving:'een' }];
  app.tekenCfgPaas();
  var pd = d2.getElementById('cfgPaas').querySelectorAll('[data-pd]');
  pd[1].value = '39'; pd[1].oninput();
  eis('een paasverschuiving landt op zijn eigen plek', app.cfgPaas[1].dagen, '39');
  eis('en de andere blijft', app.cfgPaas[0].dagen, 0);
}

function testMacro(macro){
  groep('De macro, met dezelfde proefgegevens');

  function aantal(vraag){
    var uit = macro(PROEF, vraag);
    var m = /(\d+)\/(\d+)/.exec(uit.replace(/<[^>]+>/g, ''));
    return m ? +m[1] : -1;
  }

  eis('alles telt elf events', aantal('@a 1-4'), 11);
  eis('categorie 1 telt er zeven', aantal('@a 1'), 7);
  eis('alleen met een notitie', aantal('@a 1-4 **'), 1);
  eis('alleen geboortes', aantal('@a 1-4 t+'), 2);
  eis('geboren of getrouwd', aantal('@a 1-4 t+&'), 4);
  eis('de onvolledige datums', aantal('@? 1-4'), 2);
  eis('december telt er een', aantal('@dec 1-4'), 1);
  eis('februari telt er twee', aantal('@feb 1-4 2026'), 2);
  eis('zoeken op een naam', aantal('sinka'), 1);
  eis('zoeken met het of-teken', aantal('sinka|kerst'), 2);
  eis('zoeken kijkt naar het hele jaar, en 29 februari valt daarbuiten',
      aantal('jovek'), 0);
  eis('met @a doet die wel mee', aantal('jovek@a 1-4'), 1);
  eis('een onbekende opdracht wordt gemeld',
      /fout\(en\)/.test(macro(PROEF, '@xyz')), true);
  eis('de uitleg begint met de vorm',
      /periode/.test(macro(PROEF, '?')), true);
}

/* Het rapport van de macro is html. De vaste regel: de opmaak hangt alleen af
   van de structuur van het rapport, nooit van de inhoud van de velden of van
   de vraag. Twee bestanden met dezelfde vorm maar andere namen horen dus
   precies dezelfde reeks tags op te leveren. */
function testMacroOpmaak(macro){
  groep('De macro ontsnapt tekens in de uitvoer');

  var CFG = JSON.stringify({ types: [
    { omschrijving:'Geboren', teken:'+' },
    { omschrijving:'Getrouwd', teken:'&' },
    { omschrijving:'Feestdag', teken:'^' }
  ]});
  var VUIL = [
    '<b>Lang;<b>Kort;Geboren;D19800315;1',
    '<img src=x onerror=stuk>;<i>Plaatje;Geboren;D19800316;1;<u>notitie',
    'Jansen & Zonen;J&Z;Getrouwd;D19900601;2;ook & hier',
    '</span></b>Kaper;</b>Kaper;Feestdag;D00001225;1',
    'Fout, type;Fout;<b>Onbekend;Dxxxx;9'
  ].join('\n');
  var NET = [
    'Aaa Lang;Aaa Kort;Geboren;D19800315;1',
    'Bbb lange naam hier;Bbb Plaatje;Geboren;D19800316;1;bbb notitie',
    'Ccc en Zonen;CcZ;Getrouwd;D19900601;2;ook ccc hier',
    'Ddd Kaper;Ddd Kaper;Feestdag;D00001225;1',
    'Fout, type;Fout;Eee onbekend;Dxxxx;9'
  ].join('\n');

  /* de volgorde van de regels verschilt wel, want er wordt op naam gesorteerd;
     het gaat erom dat er geen tag bij komt of af gaat */
  function tags(t){ return (t.match(/<[^>]*>/g) || []).sort().join(' '); }

  [['alles', '@a 1-4'], ['als data', '@a 1-4 ='], ['met lange naam', '@a 1-4 l'],
   ['met notitie', '@a 1-4 **'], ['bij zoeken', '1980'], ['dit jaar', '@a'],
   ['bij een onbekende opdracht', '@a <b>']].forEach(function(p){
    eis('dezelfde opmaak bij vuile en nette namen, ' + p[0],
        tags(macro(VUIL, p[1], CFG)) === tags(macro(NET, p[1], CFG)), true);
  });

  var uit = macro(VUIL, '@a 1-4 l', CFG);
  eis('een < in een naam komt er als entiteit uit', uit.indexOf('&lt;b&gt;Kort') >= 0, true);
  eis('een & in een naam komt er als entiteit uit', uit.indexOf('J&amp;Z') >= 0, true);
  eis('en de naam zelf blijft leesbaar', uit.indexOf('&lt;img src=x onerror=stuk&gt;') >= 0, true);
  eis('een onbekend type in het foutblok wordt ook ontsnapt',
      uit.indexOf('<b>Onbekend') < 0, true);

  /* de melding is platte tekst voor een horloge: die moet juist onopgemaakt
     blijven, anders staat er &amp; op het scherm */
  var vd = app.dgYMD(app.dgVandaag());
  function code(d){
    var y = app.dgYMD(app.dgVandaag() + d);
    return 'D' + y.jaar + String(y.maand).padStart(2, '0') + String(y.dag).padStart(2, '0');
  }
  var NU = ['Vandaag, een;Jansen & Zn;Geboren;' + code(0) + ';1',
            'Morgen, een;<b>Piet;Geboren;' + code(1) + ';1'].join('\n');
  var mld = macro(NU, '@!', CFG);
  eis('de melding ontsnapt niets', mld.indexOf('&amp;') < 0 && mld.indexOf('&lt;') < 0, true);
  eis('en noemt de naam van vandaag', mld.indexOf('Jansen & Zn') >= 0, true);
  eis('en die van morgen', mld.indexOf('<b>Piet') >= 0, true);

  /* een type dat zo heet als een eigenschap van Object mag niets opleveren */
  var p = macro('A;a;constructor;D20000101;1', '@a 1-4', CFG);
  eis('een type "constructor" is geen bekend type', /\? type/.test(p), true);
  eis('en levert geen broncode op', p.indexOf('native code') < 0, true);
}

/* Een veld van duizenden tekens komt niet uit de app maar uit geplakte tekst.
   De app weigert het bij opslaan, de macro meldt het, en beide houden dezelfde
   grens aan. */
function testLengte(macro){
  groep('De lengtegrens op de velden');

  var grens = app.VELD_LENGTE_MAX;
  eis('de app kent een grens', grens > 0, true);
  eis('de macro houdt dezelfde grens aan',
      /\? veld te lang/.test(macro('A;' + new Array(grens + 2).join('x') +
                                   ';Geboren;D20000101;1', '@a 1-4')), true);
  eis('en net binnen de grens meldt hij niets',
      /\? veld te lang/.test(macro('A;' + new Array(grens + 1).join('x') +
                                   ';Geboren;D20000101;1', '@a 1-4')), false);

  /* de bestandscontrole van de app noemt zo'n regel ook */
  var bewaardR = app.records, bewaardC = app.cfg;
  app.cfg = { bestand:'e.txt', scheidingsteken:';' };
  app.records = app.parse('A;' + new Array(grens + 2).join('x') + ';Geboren;D20000101;1\n' +
                          'B;b;Geboren;D20000102;1');
  var titels = app.controleer().map(function(g){ return g.titel; });
  eis('de bestandscontrole meldt een te lang veld',
      titels.indexOf('Velden die te lang zijn') >= 0, true);
  app.records = app.parse('B;b;Geboren;D20000102;1');
  eis('en bij nette regels niet',
      app.controleer().map(function(g){ return g.titel; })
         .indexOf('Velden die te lang zijn') < 0, true);

  /* en bij opslaan in de bewerkmodal wordt het geweigerd */
  var d = app.document;
  app.openModal(-1);
  d.getElementById('fSleutel').value = new Array(grens + 2).join('y');
  d.getElementById('fNaam').value = 'Kort';
  var voor = app.records.length;
  app.bewaarModal();
  eis('opslaan van een te lang veld wordt geweigerd',
      /tekens/.test(d.getElementById('mErr').textContent), true);
  eis('en er komt geen record bij', app.records.length, voor);
  app.sluitModal();

  /* een type dat zo heet als een eigenschap van Object mag in de
     bestandscontrole geen broncode opleveren */
  app.cfg = { bestand:'e.txt', scheidingsteken:';',
              types:[{ omschrijving:'Geboren', teken:'+' }] };
  app.records = app.parse('A;a;constructor;D20000101;1');
  var regels = app.controleer().map(function(g){ return g.regels.join(' '); }).join(' ');
  eis('de bestandscontrole noemt het vreemde type', /constructor/.test(regels), true);
  eis('en zonder broncode erbij', regels.indexOf('native code') < 0, true);

  app.records = bewaardR; app.cfg = bewaardC;
}

/* ------------------ app en macro leggen de configuratie gelijk uit ------------------ */
/* De app schrijft de configuratie, de macro leest hem. Een filter dat naar een
   type verwijst dat niet meer bestaat wordt door beide genegeerd: dan zie je
   alles in plaats van niets. Eerder deed de app het omgekeerde. */
function testCfgSamen(macro){
  groep('App en macro leggen de configuratie gelijk uit');

  var TYPES = [{ omschrijving:'Geboren', teken:'+' }, { omschrijving:'Feestdag', teken:'^' }];
  var DATA = ['Vasqinter, Drimmelore;Drimmelore;Geboren;D19740812;1',
              'Kerst, Eerste;Eerste Kerstdag;Feestdag;D00001225;1',
              'Brulmeer, Jovek;Jovek;Geboren;D19900601;2'].join('\n');

  var bewaard = { cfg:app.cfg, records:app.records, fileState:app.fileState,
                  bestandsnaam:app.bestandsnaam, filterType:app.filterType,
                  datumFilter:app.datumFilter, zoekterm:app.zoekterm,
                  filterAan:app.filterAan, filterCatVan:app.filterCatVan,
                  filterCatTot:app.filterCatTot, filterNotitie:app.filterNotitie,
                  zichtJaar:app.zichtJaar };

  /* hoeveel laat elk van de twee zien met deze configuratie? */
  function appAantal(cfgObject){
    app.cfg = cfgObject;
    app.fileState = 'ok'; app.bestandsnaam = 'e.txt';
    app.pasStandaardFilterToe();
    app.records = app.parse(DATA);
    app.sorteer();
    app.zoekterm = ''; app.filterAan = true;
    app.datumFilter = '';          /* de periode doet hier niet mee */
    return app.zichtbaar().length;
  }
  /* '@a' en niet '@a 1-4': een categorie achter de @ overstemt die uit de
     configuratie, en dan meet je de vraag in plaats van de configuratie */
  function macroAantal(cfgObject){
    var uit = String(macro(DATA, '@a', JSON.stringify(cfgObject)));
    var m = /(\d+)\/(\d+)/.exec(uit.replace(/<[^>]*>/g, ''));
    return m ? +m[1] : -1;
  }

  var basis = { bestand:'e.txt', scheidingsteken:';', types:TYPES };
  eis('zonder filter ziet de app alles', appAantal(basis), 3);
  eis('en de macro ook', macroAantal(basis), 3);

  var bekend = { bestand:'e.txt', scheidingsteken:';', types:TYPES,
                 filter:{ type:'Geboren' } };
  eis('een filter op een bekend type werkt in de app', appAantal(bekend), 2);
  eis('en in de macro', macroAantal(bekend), 2);

  /* dit is de plek die is gelijkgetrokken */
  var weg = { bestand:'e.txt', scheidingsteken:';', types:TYPES,
              filter:{ type:'Getrouwd' } };
  eis('een filter op een type dat niet in de configuratie staat negeert de app',
      appAantal(weg), 3);
  eis('en de macro ook', macroAantal(weg), 3);
  eis('de app zet dat filter dan ook echt niet', app.filterType, '');

  var onzin = { bestand:'e.txt', scheidingsteken:';', types:TYPES,
                filter:{ type:'volstrekt onbekend' } };
  eis('idem bij een onzinnige typenaam, in de app', appAantal(onzin), 3);
  eis('en in de macro', macroAantal(onzin), 3);

  /* categorie en categoriebereik moeten wel hetzelfde doen */
  [['categorie 1', { categorie:1 }, 2], ['categorie 2', { categorie:2 }, 1],
   ['bereik 1 tot 2', { categorie:[1,2] }, 3]].forEach(function(p){
    var c = { bestand:'e.txt', scheidingsteken:';', types:TYPES, filter:p[1] };
    eis('filter op ' + p[0] + ' in de app', appAantal(c), p[2]);
    eis('en in de macro', macroAantal(c), p[2]);
  });

  /* en zonder types in de configuratie vallen beide op dezelfde eigen lijst terug */
  var zonderTypes = { bestand:'e.txt', scheidingsteken:';', filter:{ type:'Geboren' } };
  eis('zonder types in de configuratie kent de app Geboren nog', appAantal(zonderTypes), 2);
  eis('en de macro ook', macroAantal(zonderTypes), 2);

  /* De terugvallijst met types, voor als de configuratie er geen noemt. App en
     macro hebben elk hun eigen lijst en die moeten dezelfde tekens bij dezelfde
     types zetten -- anders betekent @t^ in de app iets anders dan in de macro.
     Niet door de code te lezen maar door het gedrag te meten: welk teken
     selecteert welk type? */
  var ZONDER = { bestand:'e.txt', scheidingsteken:';' };
  var ALLE = app.TYPES.map(function(t, i){
    return 'N' + i + ', test;N' + i + ';' + t.omschrijving + ';D2026010' + (i + 1) + ';1';
  }).join('\n');
  eis('de app heeft zeven standaardtypes', app.TYPES.length, 7);
  app.TYPES.forEach(function(t, i){
    app.cfg = ZONDER;
    eis('zonder configuratie is het teken van ' + t.omschrijving + ' in de app "' + t.teken + '"',
        app.typeTeken(t.omschrijving), t.teken);
    var uit = String(macro(ALLE, '@a 1-4 2026 t' + t.teken, JSON.stringify(ZONDER)))
      .replace(/<[^>]*>/g, '');
    eis('en in de macro selecteert "' + t.teken + '" alleen ' + t.omschrijving,
        /^1\/7\b/.test(uit) && uit.indexOf('N' + i) >= 0, true);
  });

  /* Het jaar staat relatief in de configuratie. Beide horen een onzinwaarde te
     negeren in plaats van naar een gebroken of onmogelijk jaartal te springen. */
  function appJaar(waarde){
    app.cfg = { bestand:'e.txt', scheidingsteken:';', types:TYPES, filter:{ jaar:waarde } };
    app.pasStandaardFilterToe();
    return app.zichtJaar - app.huidigJaar();
  }
  function macroJaar(waarde){
    /* De kop eindigt op het jaar, maar alleen als dat niet het huidige is --
       anders eindigt hij op het categoriebereik. Er is dus een voorafgaande
       spatie nodig, en een jaartal mag ook gebroken of te groot zijn, want
       juist dat hoort deze controle te vinden. */
    var uit = String(macro(DATA, '@a', JSON.stringify(
      { bestand:'e.txt', scheidingsteken:';', types:TYPES, filter:{ jaar:waarde } })))
      .replace(/<[^>]*>/g, '').split('\n')[0];
    var m = /\s(-?\d{3,6}(?:\.\d+)?)$/.exec(uit);
    return m ? +m[1] - app.huidigJaar() : 0;
  }
  [['een jaar vooruit', 1, 1], ['een jaar terug', -1, -1], ['dit jaar', 0, 0],
   ['vijfhonderd jaar vooruit', 500, 0], ['vijfhonderd jaar terug', -500, 0],
   ['honderd jaar vooruit', 100, 100], ['honderdeen jaar vooruit', 101, 0],
   ['een gebroken getal', 1.7, 2], ['tekst in plaats van een getal', '1', 0],
   ['een onzinnige tekst', 'abc', 0], ['waar in plaats van een getal', true, 0],
   ['een onmogelijk groot getal', 99999, 0]].forEach(function(p){
    eis('jaar ' + p[0] + ' in de app', appJaar(p[1]), p[2]);
    eis('en in de macro', macroJaar(p[1]), p[2]);
  });

  for(var k in bewaard) app[k] = bewaard[k];
  app.render();
}

/* ------------------ de vijfde weekdag en 29 februari ------------------ */
/* Twee afspraken die bewust verschillen tussen app en macro. Ze staan hier
   vast zoals ze zijn, niet omdat ze mooi zijn maar omdat ze bedoeld zijn: als
   iemand de weekdagberekening aanraakt, valt deze groep om en zie je het.
   De beschrijving staat boven beide bestanden. */
function testVijfdeWeekdag(macro){
  groep('De vijfde weekdag en 29 februari, zoals bedoeld');

  var CFG = JSON.stringify({ types:[{ omschrijving:'Feestdag', teken:'^' }] });

  /* de app: de rauwe berekening en wat de gebruiker ziet */
  function appRuw(code, jaar){
    var st = app.decode(code);
    var d = app.ndeWeekdag(jaar, st.wmaand, st.weekdag, st.nde);
    return d === null ? '(geen)' : app.datumTekst(d);
  }
  function appTekst(code, jaar){ return app.datumInJaar(code, jaar); }
  /* De macro: de datum in het weergavejaar. Dat jaar gaat via de vraag, want
     "vandaag" ligt bij het laden vast en is van buiten niet te zetten. Het
     rapport begint met een kop en een lege regel; daarna per event een blok,
     waarin de eerste dd-mm-jjjj de datum in het weergavejaar is. */
  function macroDatum(code, jaar){
    var uit = String(macro('X, test;Xtest;Feestdag;' + code + ';1', '@a 1-4 ' + jaar, CFG))
      .replace(/<[^>]*>/g, '');
    var m = /(\d{2}-\d{2}-\d{4})/.exec(uit.split('\n\n').slice(1).join('\n'));
    return m ? m[1] : '(geen)';
  }

  /* 1. een vijfde weekdag die er wel is: beide hetzelfde */
  eis('5e zondag mei 2026 bestaat, de app geeft hem',
      appRuw('D00070505', 2026), 'zondag 31 mei 2026');
  eis('en de macro ook', macroDatum('D00070505', 2026), '31-05-2026');
  eis('5e vrijdag april 2027 bestaat ook', appRuw('D00050405', 2027), 'vrijdag 30 april 2027');
  eis('en in de macro', macroDatum('D00050405', 2027), '30-04-2027');

  /* 2. een vijfde weekdag die er niet is: hier lopen ze bewust uiteen */
  eis('5e maandag februari 2026 bestaat niet; de app geeft geen datum',
      appRuw('D00010205', 2026), '(geen)');
  eis('en zegt dat ook', appTekst('D00010205', 2026), 'bestaat niet in 2026');
  eis('de macro rolt door naar de volgende maand — bedoeld gedrag',
      macroDatum('D00010205', 2026), '02-03-2026');
  eis('5e zondag mei 2024 bestaat niet in de app', appRuw('D00070505', 2024), '(geen)');
  eis('en de macro geeft 2 juni 2024 — zelfde afspraak',
      macroDatum('D00070505', 2024), '02-06-2024');

  /* 3. de laatste weekdag blijft wel in de maand, in beide */
  eis('laatste zondag maart 2026 in de app', appRuw('D00070399', 2026), 'zondag 29 maart 2026');
  eis('en in de macro', macroDatum('D00070399', 2026), '29-03-2026');
  eis('laatste zondag oktober 2026 in de app', appRuw('D00071099', 2026), 'zondag 25 oktober 2026');
  eis('en in de macro', macroDatum('D00071099', 2026), '25-10-2026');

  /* 4. 29 februari: beide wijzen naar de eerstvolgende keer, in een andere vorm */
  eis('de app heeft 29 februari niet in 2026',
      app.eventDatum({ code:'D00000229' }, 2026), null);
  eis('en noemt het eerstvolgende jaar',
      /eerstvolgend in 2028/.test(appTekst('D00000229', 2026)), true);
  eis('de macro toont die eerstvolgende datum', macroDatum('D00000229', 2026), '29-02-2028');
  eis('in een schrikkeljaar zijn ze gelijk — app',
      app.datumInJaar('D00000229', 2028), 'dinsdag 29 februari 2028');
  eis('en macro', macroDatum('D00000229', 2028), '29-02-2028');

  /* 5. de kandidaatlus in matchDate: een 29 februari die niet bestaat sluit
        geen geldig ander jaar uit, want geen venster omspant er twee */
  ['@a 1-4 2027', '@j 1-4 2027', '@feb 1-4 2027', '@w 1-4 2027', '@m 1-4 2027',
   '@a 1-4 2028', '@feb 1-4 2028'].forEach(function(q){
    var uit = String(macro('Schrikkel;Schrikkel;Feestdag;D00000229;1', q, CFG))
      .replace(/<[^>]*>/g, '');
    eis('vraag "' + q + '" levert nooit meer dan een treffer op dit ene event',
        /^[01]\/1\b/.test(uit), true);
  });
}

/* ------------------ de macro valt nooit om ------------------ */
/* Een interne fout mag niet als exception bij MacroDroid belanden: dan is er
   geen uitvoer, en een melding die wegvalt lijkt op "niets te melden". De macro
   geeft bij een fout een regel die met '! ' begint, en die is niet te verwarren
   met "0;0" of met een naamregel. */
function testMacroFouten(macro){
  groep('De macro valt nooit om');

  var CFG = JSON.stringify({ types:[{ omschrijving:'Geboren', teken:'+' }] });
  var SCHOON = 'A, test;A;Geboren;D19800101;1';

  function uit(data, vraag, cfg){
    try { return { tekst:String(macro(data, vraag, cfg)) }; }
    catch(e){ return { gooit:e.name }; }
  }

  /* Drie invoeren die de macro eerder lieten omvallen. Die worden nu gewoon
     verwerkt: een rotte regel in de configuratie wordt overgeslagen, en geen
     gegevens is geen fout maar een leeg bestand. */
  var kapotteCfg = uit(SCHOON, '@a 1-4', '{"categorieen":[null]}');
  eis('een configuratie met een lege categorieregel wordt verwerkt',
      /1\/1/.test(kapotteCfg.tekst || ''), true);
  eis('en levert geen foutregel op', /^! fout /.test(kapotteCfg.tekst || ''), false);
  eis('een hogere categorie naast die lege regel telt wel mee',
      /\? categorie/.test(uit('A;a;Geboren;D20000101;9', '@a 1-9',
                              '{"categorieen":[null,{"nr":9}]}').tekst || ''), false);
  [['geen gegevens (null)', null], ['geen gegevens (undefined)', undefined]].forEach(function(p){
    var r = uit(p[1], '@a 1-4', CFG);
    eis(p[0] + ' geldt als een leeg bestand', /0\/0/.test(r.tekst || ''), true);
    eis('en levert geen foutregel op', /^! fout /.test(r.tekst || ''), false);
    eis('en in de melding gewoon 0;0', uit(p[1], '@!', CFG).tekst, '0;0');
  });

  /* De vangnet-constructie zelf: een invoer die binnen de macro echt een fout
     veroorzaakt. Dit is het onderscheid waar het om gaat -- zo'n fout mag niet
     lijken op "niets te melden". */
  var stuk = { toString: function(){ throw new Error('kapot'); } };
  var fout = uit(stuk, '@!', CFG);
  eis('een interne fout laat de macro niet omvallen', !!fout.tekst, true);
  eis('en komt er als een foutregel uit', /^! fout /.test(fout.tekst || ''), true);
  eis('die begint niet met 0;0', (fout.tekst || '').indexOf('0;0'), -1);
  eis('de soort fout staat erbij', /Error/.test(fout.tekst || ''), true);
  eis('het is een regel, geen lap tekst', (fout.tekst || '').indexOf('\n'), -1);
  eis('ook in de html-vorm komt er een foutregel',
      /^! fout /.test(uit(stuk, '@a 1-4', CFG).tekst || ''), true);

  /* en het meldingsprotocol zelf blijft letterlijk zoals het was */
  eis('een schoon bestand zonder events vandaag en morgen geeft nog 0;0',
      uit(SCHOON, '@!', CFG).tekst, '0;0');
  eis('een leeg bestand ook', uit('', '@!', CFG).tekst, '0;0');

  /* een fout in een record hoort de rest niet te blokkeren */
  var gemengd = ['Goed, een;Goed;Geboren;D19800101;1',
                 'Stuk, een;Stuk;Onbekend;Dxxxx;9',
                 'Goed, twee;Ook goed;Geboren;D19800102;1'].join('\n');
  var r2 = uit(gemengd, '@a 1-4', CFG);
  eis('een kapot record blokkeert de andere niet', /2\/3/.test(r2.tekst || ''), true);
  eis('en wordt wel gemeld', /fout\(en\)/.test(r2.tekst || ''), true);

  /* onverwachte soorten invoer leveren uitvoer, geen exception */
  [['een getal als gegevens', 12345], ['een object als gegevens', { a:1 }],
   ['een lijst als gegevens', ['A;a;Geboren;D20000101;1']]].forEach(function(p){
    eis(p[0] + ' levert uitvoer op', !!uit(p[1], '@a 1-4', CFG).tekst, true);
  });
  [['een getal als vraag', 42], ['een object als vraag', { a:1 }], ['null als vraag', null]]
    .forEach(function(p){
      eis(p[0] + ' levert uitvoer op', !!uit(SCHOON, p[1], CFG).tekst, true);
    });

  /* en een onbruikbare configuratie valt terug op de eigen standaard */
  ['', 'geen json', '[1,2,3]', 'null', '7', '{"types":"abc"}', '{"types":[null]}',
   '{"filter":[1,2]}', '{"scheidingsteken":"abc"}'].forEach(function(c){
    var r = uit(SCHOON, '@a 1-4', c);
    eis('configuratie ' + JSON.stringify(c.slice(0, 22)) + ' blokkeert niets', !!r.tekst, true);
  });
}

/* ------------------ zonder File System Access ------------------ */
/* Een browser die niet in een map mag schrijven (Chrome voor Android, Firefox)
   krijgt geen downloadroute meer: de app zegt alleen dat hier geen werkmap kan,
   en er is niets om te bewerken of te downloaden. */
function testTerugval(){
  groep('Zonder maptoegang');

  var bewaard = { hasFSA:app.hasFSA, dirHandle:app.dirHandle, cfg:app.cfg,
                  fileState:app.fileState, bestandsnaam:app.bestandsnaam,
                  records:app.records, selIndex:app.selIndex, kopieRij:app.kopieRij,
                  nieuweVersie:app.nieuweVersie, nieuweInhoud:app.nieuweInhoud };
  function balk(){ return app.document.getElementById('filebar').textContent.replace(/\s+/g, ' ').trim(); }
  function knop(id){ return !!app.document.getElementById(id); }
  app.hasFSA = false; app.dirHandle = null;
  app.nieuweVersie = null; app.nieuweInhoud = false;

  app.fileState = 'leeg'; app.bestandsnaam = ''; app.records = []; app.kopieRij = null;
  app.render();
  eis('leeg: de balk zegt dat hier geen werkmap kan', balk(), 'Deze browser kan geen werkmap koppelen.');
  eis('en er is geen knop om een bestand te openen', knop('fLink'), false);

  app.fileState = 'kopie'; app.kopieRij = { bestand:'events.txt', tijd:Date.now() };
  app.render();
  var teksten = Array.prototype.map.call(
    app.document.querySelectorAll('#filebar .banner-text'), function(x){ return x.textContent; });
  eis('met een kopie: het moment en dat hier geen werkmap kan',
      teksten.length === 2 && /^vandaag \d\d:\d\d$/.test(teksten[0]) &&
      teksten[1] === 'Deze browser kan geen werkmap koppelen.', true);
  eis('ook dan geen knop', knop('fLink'), false);

  eis('er is geen downloadfunctie meer', typeof app.downloaden, 'undefined');
  eis('en geen bestandskeuze zonder map', typeof app.openenFallback, 'undefined');

  app.vulAppStatus();
  eis('App-status heeft geen downloadknop', knop('stDl'), false);
  eis('en zegt dat schrijven hier niet kan',
      /niet mogelijk — deze browser kan geen werkmap koppelen/.test(
        app.document.getElementById('checkBody').textContent), true);

  for(var k in bewaard) app[k] = bewaard[k];
  app.render();
}

/* ------------------ elke modal sluit op beide manieren ------------------ */
/* Veertien modals gaan dicht met hun annuleerknop en met een klik naast de
   modal. De koppeling tussen knop en modal staat hier met de hand uitgeschreven
   en wordt dus niet uit de app overgenomen: dat is precies wat deze groep
   nakijkt. Vier gevallen wijken af en houden hun eigen gedrag. */
var SLUITPAREN = [
  ['filterCancel',  'filterModal'],
  ['infoOk',        'infoModal'],
  ['pickCancel',    'picker'],
  ['icoonCancel',   'icoonModal'],
  ['checkOk',       'checkModal'],
  ['cfgCancel',     'cfgModal'],
  ['typeCancel',    'typeModal'],
  ['ndeCancel',     'ndeModal'],
  ['weekdagCancel', 'weekdagModal'],
  ['dagCancel',     'dagModal'],
  ['jaarCancel',    'jaarModal'],
  ['maandCancel',   'maandModal'],
  ['pasenCancel',   'pasenModal'],
  ['catCancel',     'catModal']
];

function testSluiten(){
  groep('Elke modal sluit op beide manieren');

  var d = app.document;
  while(app.bovensteModaal()) app.bergModaal(app.bovensteModaal());

  SLUITPAREN.forEach(function(p){
    var knop = p[0], id = p[1];
    /* met de knop */
    app.toonModaal(id);
    var open = !d.getElementById(id).hidden && app.bovensteModaal() === id;
    var k = d.getElementById(knop);
    if(k) k.click();
    eis(id + ' sluit met ' + knop,
        open && d.getElementById(id).hidden && app.bovensteModaal() !== id, true);

    /* met een klik naast de modal */
    app.toonModaal(id);
    d.getElementById(id).click();
    eis(id + ' sluit met een klik ernaast',
        d.getElementById(id).hidden && app.bovensteModaal() !== id, true);
  });

  /* de vier afwijkende gevallen */
  app.toonModaal('modal');
  d.getElementById('mCancel').click();
  eis('de bewerkmodal sluit met Annuleren', d.getElementById('modal').hidden, true);
  app.toonModaal('modal');
  d.getElementById('modal').click();
  eis('en met een klik ernaast', d.getElementById('modal').hidden, true);

  var geroepen = 0;
  app.vraag('Titel', 'Tekst', 'Doen', function(){ geroepen++; });
  d.getElementById('cNo').click();
  eis('de vraag sluit met Annuleren', d.getElementById('confirm').hidden, true);
  eis('en doet dan niets', geroepen, 0);
  eis('en vergeet wat er moest gebeuren', app.confirmCb, null);

  app.vraag('Titel', 'Tekst', 'Doen', function(){ geroepen++; });
  d.getElementById('cYes').click();
  eis('de vraag sluit met de bevestiging', d.getElementById('confirm').hidden, true);
  eis('en doet dan wel wat er moest gebeuren', geroepen, 1);
  eis('en vergeet het daarna', app.confirmCb, null);

  app.vraag('Titel', 'Tekst', 'Doen', function(){ geroepen++; });
  d.getElementById('confirm').click();
  eis('de vraag sluit ook met een klik ernaast', d.getElementById('confirm').hidden, true);
  eis('en doet dan niets', geroepen, 1);

  while(app.bovensteModaal()) app.bergModaal(app.bovensteModaal());
  app.render();
}

/* ------------------ een stap terug en weer vooruit ------------------ */
/* De app bewaart een stap terug als het event van voor en van na, op inhoud.
   Terugdraaien is zelf een wijziging die eerst naar het bestand gaat: de tabel is
   ook daarna het bestand. Hier heen en terug voor alle drie de soorten, met een
   nagemaakte map, plus wat er gebeurt als het niet kan of mislukt. */
function testUndo(){
  groep('Een stap terug en weer vooruit');
  if(typeof app.opslaanWijziging !== 'function' || typeof app.voerStapUit !== 'function'){
    eis('ongedaan maken gaat via het bestand', typeof app.voerStapUit, 'function');
    return Promise.resolve();
  }
  var d = app.document;
  var namen = ['records','cfg','fileState','bestandsnaam','hasFSA','selIndex','dirHandle',
               'idbGet','idbPut','idbDel','terug','stapMelding','schrijfBezig',
               'filterType','zichtJaar','datumFilter','filterAan','basisTekst','inleesMelding','kopieRij'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });
  function zetTerug(){ while(app.bovensteModaal()) app.bergModaal(app.bovensteModaal()); namen.forEach(function(n){ app[n] = bewaard[n]; }); app.render(); }
  var idb = {};
  app.idbGet = function(k){ return Promise.resolve(idb[k]); };
  app.idbPut = function(k, v){ idb[k] = v; return Promise.resolve(); };
  app.idbDel = function(k){ delete idb[k]; return Promise.resolve(); };

  var map;
  function opzetten(opt){
    app.kopieRij = null; app.inleesMelding = '';
    map = maakMap(opt);
    map.fs['e.txt'] = { tekst:PROEF, mtime:1000 };
    map.fs['events_cfg.json'] = { tekst:JSON.stringify({ bestand:'e.txt', scheidingsteken:';' }), mtime:1 };
    /* de app heeft dit bestand gelezen (034) */
    app.basisTekst = PROEF;
    idb = { 'backup:e.txt': app.dagsleutel() };
    app.dirHandle = map; app.hasFSA = true;
    app.cfg = { bestand:'e.txt', scheidingsteken:';' };
    app.fileState = 'ok'; app.bestandsnaam = 'e.txt'; app.selIndex = -1;
    app.schrijfBezig = false;
    app.records = app.parse(PROEF); app.sorteer();
    app.terug = null; app.stapMelding = '';
  }
  function inBestand(t){ return map.fs['e.txt'].tekst.indexOf(t) >= 0; }
  function wacht(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  var NIEUW = { sleutel:'Zzz, test', naam:'Zzz', type:'Geboren', code:'D20200101', cat:1, notitie:'' };

  /* 1. toevoegen, terug, en weer vooruit */
  opzetten();
  var aantal = app.records.length;
  return app.opslaanWijziging({ soort:'nieuw', rec:NIEUW }).then(function(res){
    app.onthoud('Zzz', 'toegevoegd', res.voor, res.rec);
    eis('na toevoegen staat het event in het bestand', inBestand('Zzz, test'), true);
    eis('en in de tabel', app.records.length, aantal + 1);
    eis('de knop biedt ongedaan maken aan', app.terug.herstel, false);
    eis('en zegt wat er is gebeurd', app.terugTekst(), 'Zzz toegevoegd');
    return app.voerStapUit();
  }).then(function(){
    eis('een stap terug haalt het uit het bestand', inBestand('Zzz, test'), false);
    eis('en uit de tabel', app.records.length, aantal);
    eis('daarna biedt de knop opnieuw aan', app.terug.herstel, true);
    eis('en zegt wat terugdraaien deed', app.terugTekst(), 'Zzz verwijderd');
    return app.voerStapUit();
  }).then(function(){
    eis('opnieuw zet het terug in het bestand', inBestand('Zzz, test'), true);
    eis('precies een keer', app.records.filter(function(r){ return r.sleutel === 'Zzz, test'; }).length, 1);

    /* 2. wijzigen, terug, en weer vooruit */
    opzetten();
    var oud = app.records.find(function(r){ return r.sleutel === 'Arvenlo, Sinka'; });
    var nieuw = { sleutel:oud.sleutel, naam:'Andere naam', type:oud.type, code:oud.code, cat:oud.cat, notitie:'' };
    return app.opslaanWijziging({ soort:'wijzig', oud:app.regelVan(oud), rec:nieuw }).then(function(res){
      app.onthoud('Sinka Arvenlo', 'gewijzigd', res.voor, res.rec);
      eis('na wijzigen staat de nieuwe naam in het bestand', inBestand('Andere naam'), true);
      eis('de knop zegt wat er is gebeurd', app.terugTekst(), 'Sinka Arvenlo gewijzigd');
      return app.voerStapUit();

  }).then(function(){

/* ------------------ focus en toetsenbord rond de modals ------------------ */
/* Tab wordt hier nagebootst met de regel die de browser zelf aanhoudt: de
   volgorde van focusbare elementen in het document. De app grijpt in op
   keydown, dus die aanslag wordt echt afgevuurd op het document van de app. */
function testFocus(){
  groep('Focus en toetsenbord rond de modals');

  var d = app.document;
  var bewaard = { fileState:app.fileState, bestandsnaam:app.bestandsnaam,
                  hasFSA:app.hasFSA, cfg:app.cfg, records:app.records, selIndex:app.selIndex };
  app.cfg = { bestand:'e.txt', scheidingsteken:';' };
  app.fileState = 'ok'; app.bestandsnaam = 'e.txt'; app.hasFSA = true;
  app.records = app.parse(PROEF);
  /* niets geselecteerd, anders staat de knop waarmee we openen op hidden en
     kan die de focus niet krijgen */
  app.selIndex = -1;
  app.render();

  /* eerst opruimen: eerdere groepen laten modals openstaan */
  while(app.bovensteModaal()) app.bergModaal(app.bovensteModaal());

  /* Een Tab-aanslag afvuren en, als de app hem niet tegenhoudt, zelf de focus
     verzetten zoals de browser dat zou doen: naar het volgende focusbare
     element in documentvolgorde. Staat de focus op iets dat zelf niet focusbaar
     is -- zoals het kader van een modal -- dan gaat de browser verder bij het
     eerste element dat erna komt, niet bij het begin van de pagina. */
  function tab(shift){
    var ev = new app.KeyboardEvent('keydown', { key:'Tab', shiftKey:!!shift,
                                                bubbles:true, cancelable:true });
    var voor = d.activeElement;
    d.dispatchEvent(ev);
    if(ev.defaultPrevented) return;
    var alle = app.focusbaar(d.body);
    if(!alle.length) return;
    var i = alle.indexOf(voor);
    if(i < 0){
      /* documentvolgorde: DOCUMENT_POSITION_FOLLOWING is 4 */
      var na = -1;
      for(var j = 0; j < alle.length; j++){
        if(voor && (voor.compareDocumentPosition(alle[j]) & 4)){ na = j; break; }
      }
      i = shift ? (na < 0 ? alle.length : na) : (na < 0 ? -1 : na - 1);
    }
    var volgende = alle[(i + (shift ? -1 : 1) + alle.length) % alle.length];
    if(volgende) volgende.focus();
  }
  function binnen(id){ return d.getElementById(id).contains(d.activeElement); }

  /* 1. de focus hoort de modal in te gaan, maar niet in een invoerveld: op een
        telefoon zou het toetsenbord dan over het formulier schuiven */
  d.getElementById('btnNew').focus();
  eis('voor het openen staat de focus op de knop', d.activeElement.id, 'btnNew');
  app.openModal(-1);
  eis('na het openen staat de focus in de modal', binnen('modal'), true);
  eis('en niet in een invoerveld',
      ['INPUT','TEXTAREA','SELECT'].indexOf(d.activeElement.tagName) < 0, true);

  /* 2. Tab mag er niet uit, heen en terug */
  var eruit = 0, langs = {};
  for(var i = 0; i < 30; i++){
    tab(false);
    if(!binnen('modal')) eruit++;
    langs[d.activeElement.id || d.activeElement.className] = true;
  }
  eis('dertig keer Tab komt niet buiten de modal', eruit, 0);
  eis('en loopt wel langs meer dan een element', Object.keys(langs).length > 1, true);
  eruit = 0;
  for(i = 0; i < 30; i++){ tab(true); if(!binnen('modal')) eruit++; }
  eis('dertig keer Shift+Tab ook niet', eruit, 0);

  /* 3. bij sluiten komt de focus terug waar hij was */
  app.sluitModal();
  eis('na het sluiten staat de focus terug op de knop', d.activeElement.id, 'btnNew');

  /* 4. twee modals op elkaar */
  app.openModal(-1);
  app.openTypeKeuze();
  eis('de tweede modal krijgt de focus', binnen('typeModal'), true);
  eruit = 0;
  for(i = 0; i < 15; i++){ tab(false); if(!binnen('typeModal')) eruit++; }
  eis('en Tab blijft in de bovenste modal', eruit, 0);
  app.bergModaal('typeModal');
  eis('bij sluiten komt de focus terug in de modal eronder', binnen('modal'), true);
  app.bergModaal('modal');

  /* 5. de bevestigingsvraag, die over een andere modal heen komt */
  app.toonInfo(0);
  eis('ook de bekijk-modal krijgt de focus', binnen('infoModal'), true);
  app.bergModaal('infoModal');

  /* 6. staat er niets open, dan laat de app Tab met rust */
  d.getElementById('zoek').focus();
  var ev = new app.KeyboardEvent('keydown', { key:'Tab', bubbles:true, cancelable:true });
  d.dispatchEvent(ev);
  eis('zonder open modal houdt de app Tab niet tegen', ev.defaultPrevented, false);

  /* 7. elke modal heeft de rol en het label die een schermlezer nodig heeft */
  var kaders = d.querySelectorAll('.modal[role="dialog"]');
  eis('alle modals zijn als dialoog aangemerkt', kaders.length >= 13, true);
  var zonderModal = Array.prototype.filter.call(kaders, function(k){
    return k.getAttribute('aria-modal') !== 'true';
  });
  eis('en alle met aria-modal', zonderModal.length, 0);

  for(var k in bewaard) app[k] = bewaard[k];
  app.render();
}

/* ------------------ de service worker, nagespeeld ------------------ */
/* sw-events.js wordt hier in een nagemaakte omgeving gedraaid: eigen caches,
   eigen fetch, eigen clients. Zo zijn de drie levensfasen en alle vier de
   strategieen na te kijken zonder een echte service worker te installeren.
   De nagemaakte cache houdt, net als een echte, de hele URL als sleutel --
   zoekstring inbegrepen. */
function maakSwOmgeving(opzet){
  var opslag = {}, gedaan = [], berichten = [], offline = false;
  function Res(body, init){
    init = init || {};
    this.body = body;
    this.init = init;
    this.status = init.status === undefined ? 200 : init.status;
    this.ok = this.status >= 200 && this.status < 300;
    /* De worker bewaart alleen antwoorden van de eigen origin; die hebben in
       een browser type 'basic'. Zonder dit veld zou de namaak nooit iets
       bewaren en zou de achtergrondverversing stil niets doen. */
    this.type = init.type || 'basic';
    this.statusText = init.statusText || '';
    /* kleine letters, zoals een echte Headers doet */
    this.headers = { get:function(k){
      var h = init.headers || {};
      return h[k] !== undefined ? h[k] : h[String(k).toLowerCase()];
    } };
  }
  /* een clone houdt de kopregels, anders is de ETag na een ronde door de cache
     verdwenen en zou de updatecontrole niets te vergelijken hebben */
  Res.prototype.clone = function(){ return new Res(this.body, this.init); };
  Res.prototype.text = function(){ return Promise.resolve(this.body); };

  function sleutelVan(k){
    var s = (k && k.url) ? k.url : String(k);
    try { var u = new URL(s, opzet.scope); return u.origin + u.pathname + u.search; }
    catch(e){ return s; }
  }
  function vak(naam){
    if(!opslag[naam]) opslag[naam] = {};
    var m = opslag[naam];
    return {
      match: function(k){ return Promise.resolve(m[sleutelVan(k)]); },
      put: function(k, res){ m[sleutelVan(k)] = res; return Promise.resolve(); },
      add: function(u){
        return haal(u).then(function(r){
          if(!r.ok) throw new Error('404');
          m[sleutelVan(u)] = r;
        });
      },
      keys: function(){ return Promise.resolve(Object.keys(m)); }
    };
  }
  function haal(req, init){
    var s = (req && req.url) ? req.url : String(req);
    var u = new URL(s, opzet.scope);
    gedaan.push('netwerk ' + u.pathname);
    if(offline) return Promise.reject(new Error('offline'));
    var inhoud = opzet.server[u.pathname];
    if(inhoud === undefined || inhoud === null) return Promise.resolve(new Res('weg', { status:404 }));
    /* Een regel in de server mag ook { tekst, etag, gewijzigd, geenLengte }
       zijn, zodat de updatecontrole in al zijn vormen te meten is. Een server
       stuurt normaal een content-length mee; zonder etag is dat waar de
       controle op terugvalt, en zonder allebei blijft alleen de inhoud over. */
    var tekst = (typeof inhoud === 'object') ? inhoud.tekst : inhoud;
    var kop = {};
    if(typeof inhoud === 'object'){
      if(inhoud.etag) kop.etag = inhoud.etag;
      if(inhoud.gewijzigd) kop['last-modified'] = inhoud.gewijzigd;
    }
    if(!(typeof inhoud === 'object' && inhoud.geenLengte)){
      kop['content-length'] = String(tekst.length);
    }
    var mee = (init && init.headers) || {};
    var vraag = mee['If-None-Match'] || mee['if-none-match'];
    if(typeof inhoud === 'object' && vraag && inhoud.etag && vraag === inhoud.etag &&
       !inhoud.negeerVoorwaarde){
      return Promise.resolve(new Res('', { status:304, headers:kop }));
    }
    /* een HEAD geeft de kopregels en geen lichaam */
    if(init && init.method === 'HEAD'){
      gedaan[gedaan.length - 1] = 'kopregels ' + u.pathname;
      return Promise.resolve(new Res('', { status:200, headers:kop }));
    }
    return Promise.resolve(new Res(tekst, { status:200, headers:kop }));
  }
  var luisteraars = {};
  return {
    gedaan: gedaan, opslag: opslag, berichten: berichten, Res: Res, luisteraars: luisteraars,
    zetOffline: function(v){ offline = v; },
    heeft: function(cachenaam, url){
      return !!(opslag[cachenaam] && opslag[cachenaam][sleutelVan(url)]);
    },
    cachenamen: function(){ return Object.keys(opslag).sort(); },
    self_: {
      location: { href:opzet.scope, origin:new URL(opzet.scope).origin },
      addEventListener: function(n, f){ (luisteraars[n] = luisteraars[n] || []).push(f); },
      skipWaiting: function(){ gedaan.push('skipWaiting'); return Promise.resolve(); },
      clients: {
        claim: function(){ gedaan.push('claim'); return Promise.resolve(); },
        /* een nagemaakte open pagina, die onthoudt wat de worker stuurt */
        matchAll: function(){ return Promise.resolve([{ postMessage: function(m){ berichten.push(m); } }]); }
      }
    },
    caches_: {
      open: function(n){ return Promise.resolve(vak(n)); },
      keys: function(){ return Promise.resolve(Object.keys(opslag)); },
      'delete': function(n){ var had = !!opslag[n]; delete opslag[n]; return Promise.resolve(had); }
    },
    haal: haal
  };
}
function laadSw(bron, omg){
  var fn = new Function('self', 'caches', 'fetch', 'Response', 'URL',
                        'setTimeout', 'clearTimeout', bron);
  fn(omg.self_, omg.caches_, omg.haal, omg.Res, URL, setTimeout, clearTimeout);
}
/* Een belofte die nooit terugkomt mag de zelftest niet laten hangen: dan zie je
   geen uitslag maar een vastgelopen pagina. Na de grens komt GEEN terug en
   wordt dat een rode regel. */
var GEEN = { geenAntwoord:true };
function binnen(belofte, ms){
  return Promise.race([
    Promise.resolve(belofte),
    new Promise(function(k){ setTimeout(function(){ k(GEEN); }, ms); })
  ]);
}

/* een gebeurtenis afvuren en wachten tot alles wat eraan hangt klaar is */
function vuurSw(omg, naam, ev){
  var wacht = [], antwoord;
  ev.waitUntil = function(p){ wacht.push(p); };
  ev.respondWith = function(p){ antwoord = p; };
  (omg.luisteraars[naam] || []).forEach(function(f){ f(ev); });
  return Promise.all(wacht).then(function(){ return antwoord; });
}

function testPWA(){
  groep('De service worker');

  var SCOPE = location.origin + '/';
  var server = {
    '/': 'INDEX', '/index.html': 'INDEX', '/events.html': 'EVENTS v1',
    '/manifest.json': '{}', '/icon.svg': '<svg/>',
    '/golf-score.html': 'GOLF', '/trends.html': 'TRENDS', '/events_lite.js': 'MACRO'
  };

  return fetch('sw-events.js', { cache:'no-store' }).then(function(r){
    if(!r.ok) throw new Error('sw-events.js geeft status ' + r.status);
    return r.text();
  }).then(function(bron){
    var versie = /CACHE_VERSION\s*=\s*(\d+)/.exec(bron);
    var eigenCache = 'events-v' + (versie ? versie[1] : '?');
    eis('de cachenaam begint met events-v', /^events-v\d+$/.test(eigenCache), true);

    var omg = maakSwOmgeving({ scope:SCOPE, server:server });
    laadSw(bron, omg);

    /* caches van de buren en een oude van onszelf neerzetten */
    return omg.caches_.open('golf-score-vtest').then(function(c){
      return c.put(SCOPE + 'golf-score.html', new omg.Res('GOLF'));
    }).then(function(){
      return omg.caches_.open('trends-vtest').then(function(c){
        return c.put(SCOPE + 'trends.html', new omg.Res('TRENDS'));
      });
    }).then(function(){
      return omg.caches_.open('events-v1').then(function(c){
        return c.put(SCOPE + 'events.html', new omg.Res('HEEL OUD'));
      });
    }).then(function(){
      return vuurSw(omg, 'install', {});
    }).then(function(){
      eis('bij installeren stapt de nieuwe versie niet zelf over',
          omg.gedaan.indexOf('skipWaiting') < 0, true);

        var vers = maakSwOmgeving({ scope:SCOPE, server:server });
        laadSw(bron, vers);
        return vuurSw(vers, 'install', {}).then(function(){

        }).then(function(){

                                                   mode:'navigate' } });
        }).then(function(){

      }).then(function(t){
        eis('en dan dezelfde pagina uit de cache', t, 'EVENTS v2');

        /* 4. offline en niets in de cache: een net antwoord, geen undefined */
        var leeg = maakSwOmgeving({ scope:SCOPE, server:server });

        }).then(function(r){

        }).then(function(r){

          delete q.opslag[eigenCache][SCOPE];

        var m4 = maakSwOmgeving({ scope:SCOPE, server:server });

          return tot(function(){
            var r = m4.opslag[eigenCache][SCOPE + 'icon.svg'];
            return !!(r && r.body === server['/icon.svg']);
          }, 3000);

             staat: een eerdere groep kan die hebben gewijzigd */
          var regel = m4.opslag[eigenCache][SCOPE + 'icon.svg'];
          eis('en de cacheregel wordt daarna wel ververst',

  });
}

/* De melding in de app zelf: herladen mag niet midden in een schrijfactie. Een
   'niet opgeslagen' tabel bestaat niet meer, dus verder is herladen altijd goed. */
function testNieuweVersieMelding(){
  var bewaard = { nieuweVersie:app.nieuweVersie, nieuweInhoud:app.nieuweInhoud,
                  fileState:app.fileState, schrijfBezig:app.schrijfBezig,
                  hasFSA:app.hasFSA,
                  bestandsnaam:app.bestandsnaam, cfg:app.cfg, records:app.records };
  /* De filebar kan vier soorten meldingen tonen. Deze groep telt ze, dus ze
     moeten alle vier van hier worden gezet -- anders telt hij de toestand van
     het toestel mee en valt hij op het ene toestel wel en op het andere niet
     om. Dat gebeurde: op een telefoon stond er een melding meer. */
  app.nieuweInhoud = false;
  var gestuurd = [];
  app.cfg = { bestand:'e.txt', scheidingsteken:';' };
  app.bestandsnaam = 'e.txt'; app.fileState = 'ok'; app.hasFSA = true;
  app.records = app.parse(PROEF);
  app.nieuweVersie = { postMessage: function(m){ gestuurd.push(m && m.type); } };

  app.render();
  var knop = app.document.getElementById('fNieuw');
  eis('de app meldt dat er een nieuwe versie is', !!knop, true);
  eis('en de herlaadknop kan worden gebruikt', !!(knop && knop.disabled), false);

  app.stapOverNaarNieuweVersie();
  eis('een klik vraagt de app om de overstap', gestuurd[0], 'nuOverstappen');
  eis('de melding zegt niets meer over een wijziging die eerst moet worden opgeslagen',
      /opgeslagen/.test(app.document.getElementById('filebar').textContent), false);

  /* En ook niet midden in een schrijfactie. Alles staat dan wel op schijf, maar
     er loopt nog een schrijfactie, en herladen zou die afbreken. */
  app.overstapGevraagd = false;
  app.schrijfBezig = true;
  app.render();
  var knop3 = app.document.getElementById('fNieuw');
  eis('tijdens een schrijfactie is herladen ook niet mogelijk',
      !!(knop3 && knop3.disabled), true);
  gestuurd.length = 0;
  app.stapOverNaarNieuweVersie();
  eis('en een klik doet dan ook niets', gestuurd.length, 0);
  app.schrijfBezig = false;

  /* Zonder de File System Access API -- Chrome voor Android -- is er geen
     downloadregel meer; de melding over een nieuwe versie staat er dan alleen. */
  app.overstapGevraagd = false;
  app.schrijfBezig = false;
  app.hasFSA = false;
  app.render();
  /* De eerste woorden van elke melding, in volgorde. Dat telt even streng als
     een aantal, maar een onverwachte melding noemt zichzelf in de rode regel
     in plaats van alleen het aantal op te hogen. */
  function banners(){
    var b = app.document.getElementById('filebar').querySelectorAll('.banner-text');
    if(!b.length) return '(geen)';
    return Array.prototype.map.call(b, function(x){
      return x.textContent.replace(/\s+/g, ' ').trim().split(' ').slice(0, 3).join(' ');
    }).join(' / ');
  }
  var NIEUW    = 'Er is een';
  function erStaat(id){ return !!app.document.getElementById(id); }
  app.render();
  eis('zonder bestands-API alleen de versiemelding',
      banners(), NIEUW);
  eis('zonder downloadknop', erStaat('fDl'), false);
  eis('maar met de herlaadknop', erStaat('fNieuw'), true);

  var echt = app.nieuweVersie;
  app.nieuweVersie = null;
  app.render();
  eis('zonder nieuwe versie staat er helemaal niets', banners(), '(geen)');

  app.nieuweVersie = echt;
  app.hasFSA = true;
  app.render();
  eis('met bestands-API alleen de melding over de nieuwe versie', banners(), NIEUW);
  eis('en geen downloadknop', erStaat('fDl'), false);

  /* Een mislukte opslag staat in het venster, niet boven de tabel. */
  eis('boven de tabel staat geen melding over een mislukte opslag',
      erStaat('fOpnieuw') || erStaat('fToch') || erStaat('fAnnuleer'), false);

  app.overstapGevraagd = false;   /* anders herlaadt het testframe zichzelf */
  for(var k in bewaard) app[k] = bewaard[k];
  app.render();
}

/* ------------------ opslaan, met een nagemaakte bestandsmap ------------------ */
/* De File System Access API is hier nagemaakt, zodat het opslaan te volgen is
   zonder een echte map aan te raken. De namaak houdt net als Chrome een
   exclusief slot op een bestand zolang er een writable open staat: schrijven
   er twee tegelijk, dan loopt de tweede ertegenaan en is dat te zien. */
function maakMap(opt){
  var o = opt || {};
  var fs = {}, sloten = {}, gebeurd = [], klok = 1000;
  var V = o.vertraging || 4;
  function wacht(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function fout(naam){ var e = new Error('kan niet'); e.name = naam; return e; }
  function handle(naam){
    return {
      name: naam,
      getFile: function(){
        return wacht(V).then(function(){
          if(!fs[naam]) throw fout('NotFoundError');
          var f = fs[naam];
          /* zoals een echte Blob: text() haalt een BOM weg, arrayBuffer() niet (035) */
          var uit = { lastModified:f.mtime, size:(f.size === undefined ? f.tekst.length : f.size),
                      text:function(){ return Promise.resolve(f.tekst.replace(/^\uFEFF/, '')); },
                      arrayBuffer:function(){ return Promise.resolve(f.bytes ? f.bytes.buffer : new TextEncoder().encode(f.tekst).buffer); } };
          if(o.naLezen) o.naLezen(naam, fs);
          return uit;
        });
      },
      createWritable: function(){
        return wacht(V).then(function(){
          if(sloten[naam]){ gebeurd.push('slot ' + naam); throw fout('NoModificationAllowedError'); }
          if(o.backupFaalt && /_backup/.test(naam)) throw fout('NotAllowedError');
          if(o.schrijfFaalt && !/_backup/.test(naam)) throw fout('NotAllowedError');
          /* één bestand onschrijfbaar, de rest gewoon: nodig om een halve
             wijziging over twee bestanden na te bootsen */
          if(o.weigerNaam === naam){ gebeurd.push('geweigerd ' + naam); throw fout('NotAllowedError'); }
          sloten[naam] = true;
          var buf = '', bytes = null;
          return {
            /* tekst of ruwe bytes (een backup kopieert sinds 043 de bytes) */
            write: function(t){ return wacht(V).then(function(){
              if(o.writeFaalt && !/_backup/.test(naam)) throw fout('QuotaExceededError');
              if(t instanceof ArrayBuffer || ArrayBuffer.isView(t)){
                bytes = new Uint8Array(t instanceof ArrayBuffer ? t : t.buffer);
                buf += new TextDecoder('utf-8', { ignoreBOM:true }).decode(bytes);
              } else buf += t; }); },
            abort: function(){ delete sloten[naam]; gebeurd.push('afgebroken ' + naam); return Promise.resolve(); },
            close: function(){
              return wacht(V).then(function(){
                klok += 1000;
                fs[naam] = bytes ? { tekst:buf, bytes:bytes, mtime:klok } : { tekst:buf, mtime:klok };
                delete sloten[naam];
                gebeurd.push('schreef ' + naam);
              });
            }
          };
        });
      }
    };
  }
  var vragen = {};
  return {
    fs: fs, gebeurd: gebeurd, vragen: vragen,
    getFileHandle: function(naam, opties){
      vragen[naam] = (vragen[naam] || 0) + 1;
      return wacht(V).then(function(){
        if(!fs[naam] && !(opties && opties.create)) throw fout('NotFoundError');
        return handle(naam);
      });
    },
    values: function(){ return { next:function(){ return Promise.resolve({ done:true }); },
                                 [Symbol.asyncIterator]:function(){ return this; } }; }
  };
}

function testOpslag(){
  groep('Opslaan, met een nagemaakte bestandsmap');
  if(typeof app.opslaanWijziging !== 'function'){
    eis('opslaan gaat per wijziging, eerst naar het bestand', typeof app.opslaanWijziging, 'function');
    return Promise.resolve();
  }

  /* alles wat we van de app overnemen gaat na deze groep weer terug */
  var bewaard = {
    dirHandle: app.dirHandle, hasFSA: app.hasFSA, bestandsnaam: app.bestandsnaam,
    cfg: app.cfg, fileState: app.fileState, records: app.records,
    idbGet: app.idbGet, idbPut: app.idbPut, idbDel: app.idbDel
  };
  var idb = {};
  app.idbGet = function(k){ return Promise.resolve(idb[k]); };
  app.idbPut = function(k, v){ idb[k] = v; return Promise.resolve(); };
  app.idbDel = function(k){ delete idb[k]; return Promise.resolve(); };

  var A = 'A;a;Geboren;D20000101;1';
  var map;
  function opzetten(opt){
    app.kopieRij = null; app.inleesMelding = ''; app.terug = null; app.stapMelding = '';
    map = maakMap(opt);
    idb = {}; idb['backup:events.txt'] = app.dagsleutel();   /* backup van vandaag al gedaan */
    app.dirHandle = map; app.hasFSA = true; app.bestandsnaam = 'events.txt';
    app.cfg = { bestand:'events.txt', scheidingsteken:';' };
    map.fs['events_cfg.json'] = { tekst:JSON.stringify(app.cfg), mtime:1 };
    app.cfgGelezen = null; app.cfgGrootte = null; app.cfgNietUtf8 = false;
    app.fileState = 'ok'; app.schrijfBezig = false;
    app.sepMist = ''; app.sepOnafgemaakt = '';
    gelezen(A + '\n');
  }
  /* het bestand zoals de app het gelezen heeft: in de map, in de tabel en als basis (034) */
  function gelezen(tekst){
    map.fs['events.txt'] = { tekst:tekst, mtime:1000 };
    app.records = app.parse(tekst); app.sorteer();
    app.basisTekst = tekst;
  }
  function rec(n){
    return { sleutel:'R' + n, naam:'r' + n, type:'Geboren',
             code:'D200001' + (n < 10 ? '0' + n : n), cat:1, notitie:'' };
  }
  function voegToe(n){ return app.opslaanWijziging({ soort:'nieuw', rec:rec(n) }); }
  function regels(){
    var f = map.fs['events.txt'];
    return f ? f.tekst.split('\n').filter(function(x){ return x !== ''; }).length : 0;
  }
  /* Niets in de nagemaakte map blind uitlezen: mislukt een controle, dan hoort
     dat een rode regel te geven en niet de hele test af te breken. */
  function inhoud(naam){ var f = map.fs[naam]; return f ? f.tekst : '(bestaat niet)'; }
  function bestaat(naam){ return !!map.fs[naam]; }
  function sloten(){ return map.gebeurd.filter(function(g){ return g.indexOf('slot') === 0; }).length; }
  /* de tabel is het bestand: zelfde regels, in dezelfde volgorde */
  function tabelIsBestand(){ return app.serialize() === inhoud('events.txt'); }

  /* 1. een nieuw event: eerst in het bestand, dan in de tabel */
  opzetten();
  return voegToe(1).then(function(res){
    eis('een nieuw event staat in het bestand', regels(), 2);
    eis('en de tabel is het bestand', tabelIsBestand(), true);
    eis('de uitkomst noemt het event zoals het nu in de tabel staat',
        app.records.indexOf(res.rec) >= 0, true);
    /* op Android is elke vraag aan de map een trage stap (047) */
    eis('een opslag vraagt het bestand één keer bij de map op (047)', map.vragen['events.txt'], 1);
    app.vulAppStatus();
    var st = app.document.getElementById('checkBody').textContent;
    eis('App-status toont de duur van de laatste opslag, per stap (047)',
        /Laatste opslag\s*totaal \d+,\d s \u2014 toegang [\d,]+ s \u00b7 lezen [\d,]+ s \u00b7 backup [\d,]+ s \u00b7 controle [\d,]+ s \u00b7 schrijven [\d,]+ s/.test(st), true);

    /* 2. twee keer tegelijk: de tweede wacht niet en schrijft niet half */
    opzetten();
    var een = voegToe(1), twee = voegToe(2);
    return Promise.all([een, twee]);
  }).then(function(uit){
    eis('een tweede opslag tegelijk wordt geweigerd', uit[1].fout, 'bezig');
    eis('zonder tegen het bestandsslot te lopen', sloten(), 0);
    eis('de eerste staat wel in het bestand', regels(), 2);
    eis('en de tabel is het bestand', tabelIsBestand(), true);

    /* 3. vijftien wijzigingen achter elkaar */
    opzetten();
    var stap = Promise.resolve();
    for(var i = 1; i <= 15; i++){
      (function(n){ stap = stap.then(function(){ return voegToe(n); }); })(i);
    }
    return stap;
  }).then(function(){
    eis('na vijftien wijzigingen staat alles in het bestand', regels(), 16);
    eis('en de tabel is het bestand', tabelIsBestand(), true);
    eis('zonder tegen het bestandsslot te lopen', sloten(), 0);

    /* 4. een mislukte schrijfactie: de tabel blijft het bestand */
    opzetten({ schrijfFaalt:true });
    return voegToe(1);
  }).then(function(res){
    eis('een mislukte schrijfactie komt terug als mislukt', res.fout, 'mislukt');
    eis('het bestand is niet aangeraakt', inhoud('events.txt'), A + '\n');
    eis('en de tabel ook niet', app.records.length, 1);
    eis('het slot blijft niet hangen', app.schrijfBezig, false);
    var voor = inhoud('events.txt');
    map = maakMap();
    map.fs['events.txt'] = { tekst:voor, mtime:1000 };
    app.dirHandle = map;
    return voegToe(1);
  }).then(function(res){
    eis('opnieuw opslaan lukt daarna', !!res.ok, true);
    eis('en dan staat het in het bestand', regels(), 2);
  }).then(function(){
    return testBotsing();
  }).then(function(){
    return testVenster();
  }).then(function(){
    return testBackup();
  }).then(function(){
    return testVeiligheid030();
  }).then(function(){
    for(var k in bewaard) app[k] = bewaard[k];
    app.schrijfBezig = false;
    app.backupFout = ''; app.backupDag = {};
    while(app.bovensteModaal()) app.bergModaal(app.bovensteModaal());
    app.render();
  });

  /* 1352898-034: niets samenvoegen. Is het bestand anders dan wat de app las of

  function testBotsing(){
    groep('Een wijziging van buiten tijdens het opslaan (034: niets samenvoegen)');

      return voegToe(2);

          inhoud('events_backup.txt'), oudeInhoud);

      return voegToe(2);
