/* Drie reparaties uit de koude review die alleen in een echt venster te meten
   zijn: de bewerkte regel die in beeld hoort te blijven, het sluiten van een
   modal dat om invoer hoort te vragen, en de meldingen die boven de lijst horen
   te staan in plaats van duizenden pixels eronder. */
function testNaBewerken(){
  groep('In beeld blijven en veilig sluiten');
  if(typeof app.toonSelectie !== 'function'){
    eis('de app brengt de selectie in beeld', typeof app.toonSelectie, 'function');
    return Promise.resolve();
  }
  var namen = ['records','selIndex','fileState','bestandsnaam','hasFSA','terug','editIndex','editRegel'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });

  /* genoeg regels om echt te kunnen scrollen */
  var regels = [];
  for(var i = 0; i < 120; i++){
    var l = String.fromCharCode(65 + (i % 26));
    regels.push(l + i + ';' + l + ' Naam' + i + ';Gebeurtenis;D2026' +
                String((i % 12) + 1).padStart(2, '0') + String((i % 28) + 1).padStart(2, '0') + ';1');
  }
  app.hasFSA = false;
  app.fileState = 'ok';
  app.bestandsnaam = 'e.txt';
  app.records = app.parse(regels.join('\n') + '\n');
  app.sorteer();
  app.selIndex = -1;
  app.render();

  function inBeeld(){
    var m = app.document.querySelector('main');
    var rij = app.document.getElementById('lijst').querySelector('tr[data-i="' + app.selIndex + '"]');
    if(!rij) return 'rij niet gevonden';
    var r = rij.getBoundingClientRect(), mr = m.getBoundingClientRect();
    return (r.bottom > mr.top && r.top < mr.bottom) ? 'in beeld' : 'buiten beeld';
  }

  /* het laatste record naar voren halen: dat verplaatst het over de hele lijst */
  var laatste = app.records.length - 1;
  var m = app.document.querySelector('main');
  m.scrollTop = m.scrollHeight;
  app.selIndex = laatste;
  app.openModal(laatste);
  app.document.getElementById('fSleutel').value = 'Aaa, Eerste';
  app.document.getElementById('fNaam').value = 'Aaa Eerste';
  app.bewaarModal();
  eis('een bewerkte regel die anders sorteert blijft in beeld', inBeeld(), 'in beeld');

  /* en een gewone tik op een rij mag het scherm niet laten springen */
  m.scrollTop = 0;
  var voorTik = m.scrollTop;
  app.selIndex = 2; app.render(); app.toonSelectie();
  eis('een rij die al zichtbaar is laat het scherm staan', m.scrollTop, voorTik);

  /* sluiten met gewijzigde invoer hoort te vragen */
  app.selIndex = -1; app.render();
  app.openModal(0);
  app.document.getElementById('fNaam').value = 'Iets Anders Getypt';
  app.document.getElementById('modal').dispatchEvent(
    new app.MouseEvent('click', { bubbles: true }));
  eis('naast de modal tikken met gewijzigde invoer sluit hem niet',
      app.document.getElementById('modal').hidden, false);
  eis('maar vraagt erom', app.document.getElementById('confirm').hidden, false);
  eis('met de vraag over aangetroffen wijzigingen',
      app.document.getElementById('cTitle').textContent, 'Wijzigingen aangetroffen');
  app.document.getElementById('cNo').click();
  app.document.getElementById('mCancel').click();
  eis('Annuleren met gewijzigde invoer vraagt ook',
      app.document.getElementById('confirm').hidden, false);
  app.document.getElementById('cNo').click();
  app.bergModaal('modal');

  /* zonder wijziging mag sluiten gewoon doorgaan */
  app.openModal(0);
  app.document.getElementById('modal').dispatchEvent(
    new app.MouseEvent('click', { bubbles: true }));
  eis('zonder gewijzigde invoer sluit hij zonder te vragen',
      app.document.getElementById('modal').hidden, true);
  eis('en zonder vraag', app.document.getElementById('confirm').hidden, true);

  /* de configuratie: Annuleren met een wijziging vraagt ook */
  app.openCfg();
  var titelWas = app.document.getElementById('cfgTitel').value;
  app.document.getElementById('cfgTitel').value = titelWas + ' gewijzigd';
  app.document.getElementById('cfgCancel').click();
  eis('Annuleren in de configuratie met een wijziging sluit hem niet',
      app.document.getElementById('cfgModal').hidden, false);
  eis('maar vraagt erom', app.document.getElementById('confirm').hidden, false);
  app.document.getElementById('cNo').click();
  eis('terug naar de configuratie houdt hem open', app.document.getElementById('cfgModal').hidden, false);
  app.document.getElementById('cfgCancel').click();
  app.document.getElementById('cYes').click();
  eis('Niet opslaan sluit de configuratie daarna wel',
      app.document.getElementById('cfgModal').hidden, true);
  app.openCfg();
  app.document.getElementById('cfgCancel').click();
  eis('zonder wijziging sluit Annuleren de configuratie meteen',
      app.document.getElementById('cfgModal').hidden, true);
  eis('zonder vraag', app.document.getElementById('confirm').hidden, true);

  return Promise.resolve().then(function(){

  /* App-status: het versienummer van de offline-kopie komt later binnen. Is het
     scherm dan al weg, dan mag dat geen fout geven. */
  var fouten = 0, vang = function(){ fouten++; };
  app.addEventListener('unhandledrejection', vang);
  var bwS = { cacheOpslag: app.cacheOpslag, nieuwsteStempelUitCache: app.nieuwsteStempelUitCache };
  var los;
  app.cacheOpslag = function(){ return {}; };
  app.nieuwsteStempelUitCache = function(){ return new Promise(function(r){ los = r; }); };
  var tijdelijk = app.document.createElement('div'); tijdelijk.id = 'stKopie';
  app.document.body.appendChild(tijdelijk);
  app.statusVersieKopie({});
  tijdelijk.remove();
  los({ stempel: '1352898-999' });
  return new Promise(function(r){ setTimeout(r, 50); }).then(function(){
  app.removeEventListener('unhandledrejection', vang);
  app.cacheOpslag = bwS.cacheOpslag; app.nieuwsteStempelUitCache = bwS.nieuwsteStempelUitCache;
  eis('een laat antwoord voor App-status geeft geen fout als het scherm al weg is', fouten, 0);

  /* de teller: een tweede getal alleen als het iets toevoegt */
  app.records = app.parse(regels.join('\n') + '\ndit is geen event\n');
  app.sorteer(); app.selIndex = -1; app.render();
  eis('de teller noemt geen twee keer hetzelfde getal',
      app.document.getElementById('count').textContent, String(120));
  eis('en de melding over onbegrepen regels staat er',
      /onbekend formaat/.test(app.document.getElementById('bad').textContent), true);
  /* en die melding hoort boven de lijst te staan, niet eronder */
  var bad = app.document.getElementById('bad');
  var lijst = app.document.getElementById('lijst');
  eis('de melding staat boven de lijst in de opbouw',
      bad.compareDocumentPosition(lijst) & 4 ? 'boven' : 'onder', 'boven');

  namen.forEach(function(n){ app[n] = bewaard[n]; });
  app.render();
  });
  });
}

/* Het schermtoetsenbord. Dit is het enige overgebleven punt uit de koude review
   dat de GEGEVENS kan raken: Gboard kan een achternaam als "Nijhuis" of
   "d'Hondt" door een woordenboekwoord vervangen, en die correctie belandt dan in
   events_mark.txt. De attributen hieronder houden dat tegen voor zover de browser
   zich eraan houdt -- een garantie is het niet, want het hangt ook van de
   toetsenbordinstellingen van het toestel af. Een bestandsnaam mag bovendien geen
   hoofdletter krijgen: op schijf is Events.txt een ander bestand dan events.txt. */
function testToetsenbord(){
  groep('Het schermtoetsenbord');
  var d = app.document;
  function at(id, naam){
    var el = d.getElementById(id);
    return el ? (el.getAttribute(naam) === null ? '(geen)' : el.getAttribute(naam)) : '(veld weg)';
  }

  /* de velden waarvan de inhoud in het bestand terechtkomt */
  [['fSleutel', 'words'], ['fNaam', 'words']].forEach(function(paar){
    eis(paar[0] + ': autocorrectie uit', at(paar[0], 'autocorrect'), 'off');
    eis(paar[0] + ': spellingcontrole uit', at(paar[0], 'spellcheck'), 'false');
    eis(paar[0] + ': hoofdletter per woord', at(paar[0], 'autocapitalize'), paar[1]);
  });
  eis('fNotitie: autocorrectie uit', at('fNotitie', 'autocorrect'), 'off');
  eis('fNotitie: spellingcontrole uit', at('fNotitie', 'spellcheck'), 'false');

  /* een bestandsnaam: geen hoofdletter, geen correctie */
  eis('pickNew: geen hoofdletter', at('pickNew', 'autocapitalize'), 'off');
  eis('pickNew: autocorrectie uit', at('pickNew', 'autocorrect'), 'off');
  eis('pickNew: spellingcontrole uit', at('pickNew', 'spellcheck'), 'false');

  /* de scheidingstekens: één teken, nooit een hoofdletter */
  ['cfgSep', 'cfgOf'].forEach(function(id){
    eis(id + ': geen hoofdletter', at(id, 'autocapitalize'), 'off');
    eis(id + ': spellingcontrole uit', at(id, 'spellcheck'), 'false');
  });
  eis('cfgTitel: autocorrectie uit', at('cfgTitel', 'autocorrect'), 'off');

  /* het zoekveld: geen correctie, en de zoektoets op het toetsenbord */
  eis('zoek: geen hoofdletter', at('zoek', 'autocapitalize'), 'off');
  eis('zoek: autocorrectie uit', at('zoek', 'autocorrect'), 'off');
  eis('zoek: de toetsenbordtoets heet zoeken', at('zoek', 'enterkeyhint'), 'search');

  /* en die toets doet nu iets: het toetsenbord weg, zodat de lijst zichtbaar
     wordt. Er is geen formulier, dus hij deed eerst niets.
     Eerst de app in een bruikbare toestand zetten: zonder gekoppeld bestand staat
     het zoekveld op disabled en kan het de focus niet krijgen. */
  var terugFileState = app.fileState, terugNaam = app.bestandsnaam;
  app.fileState = 'ok';
  app.bestandsnaam = 'e.txt';
  app.render();
  var veld = d.getElementById('zoek');
  veld.focus();
  var hadFocus = d.activeElement === veld;
  var ev = new app.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
  veld.dispatchEvent(ev);
  eis('het zoekveld had de focus', hadFocus, true);
  eis('Enter in het zoekveld laat de focus los', d.activeElement === veld, false);
  eis('en verstuurt niets', ev.defaultPrevented, true);

  app.fileState = terugFileState; app.bestandsnaam = terugNaam; app.render();

  /* Enter in de velden van de bewerkmodal. Het eventveld is een textarea, dus
     daar zette Enter een regeleinde -- dat bij het opslaan stil een spatie werd.
     De toets zegt nu wat ze doet en doet dat ook. */
  app.fileState = 'ok';
  app.bestandsnaam = 'e.txt';
  app.records = app.parse('A;a;Gebeurtenis;D20260101;1');
  app.sorteer(); app.selIndex = -1; app.render();
  app.openModal(-1);
  var sl = d.getElementById('fSleutel'), nm = d.getElementById('fNaam'),
      nt = d.getElementById('fNotitie');

  /* Een nieuw event begint op de eerste categorie, net als een categorieveld dat
     niet te lezen is. Dat was 2, en 2 hoeft niet in de configuratie te staan. */
  eis('een nieuw event begint op categorie 1', app.cat, 1);

  eis('het eventveld meldt de toets als doorgaan', at('fSleutel', 'enterkeyhint'), 'next');
  eis('en de naam als klaar', at('fNaam', 'enterkeyhint'), 'done');
  eis('en de notitie ook', at('fNotitie', 'enterkeyhint'), 'done');

  function enter(el){
    el.focus();
    var ev = new app.KeyboardEvent('keydown', { key:'Enter', bubbles:true, cancelable:true });
    el.dispatchEvent(ev);
    return ev;
  }
  sl.value = 'Vasqinter, Drimmelore';
  var e1 = enter(sl);
  eis('Enter in het eventveld wordt tegengehouden, dus geen regeleinde',
      e1.defaultPrevented, true);
  eis('en de toets gaat door naar het naamveld', d.activeElement === nm, true);

  nm.value = 'Drimmelore';
  var e2 = enter(nm);
  eis('Enter in het naamveld laat de focus los', e2.defaultPrevented, true);
  eis('zodat Type, Datum en Categorie in beeld komen', d.activeElement === nm, false);

  nt.value = 'iets';
  var e3 = enter(nt);
  eis('Enter in de notitie doet hetzelfde', e3.defaultPrevented, true);
  eis('want een regeleinde wordt daar bij het opslaan een spatie',
      d.activeElement === nt, false);
  app.sluitBovenste(false);

  /* het jaarveld was al goed; dat vastleggen zodat het zo blijft */
  eis('jaarVeld: cijfertoetsenbord', at('jaarVeld', 'inputmode'), 'numeric');
  return Promise.resolve();
}

/* Vegen (048): over de lijst naar een andere periode, in Lees informatie naar een
   ander event. De aanraking wordt nagemaakt met echte TouchEvents. */
function testVegen(){
  groep('Vegen door periodes en events');
  if(typeof app.veegPeriode !== 'function' || typeof app.bladerInfo !== 'function'){
    eis('de app kent vegen', typeof app.veegPeriode + ' / ' + typeof app.bladerInfo, 'function / function');
    return Promise.resolve();
  }
  var d = app.document, w = app;
  var namen = ['records','cfg','fileState','bestandsnaam','zichtJaar','datumFilter','zoekterm',
               'filterAan','filterType','filterCatVan','filterCatTot','filterNotitie','selIndex','vorigePeriode'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });
  app.cfg = { bestand:'e.txt', scheidingsteken:';' };
  app.fileState = 'ok'; app.bestandsnaam = 'e.txt';
  app.records = app.parse(PROEF); app.sorteer();
  app.zichtJaar = app.huidigJaar(); app.datumFilter = ''; app.zoekterm = '';
  app.filterAan = true; app.filterType = ''; app.filterCatVan = 0; app.filterCatTot = 0;
  app.filterNotitie = false; app.selIndex = -1;
  app.render();

  /* een veeg: aanraken op (x, y), loslaten dx en dy verderop */
  function veeg(el, dx, dy, x){
    var b = w.innerWidth, x0 = x === undefined ? b/2 + (dx < 0 ? 60 : -60) : x, y0 = 300;
    var t0 = new w.Touch({ identifier:1, target:el, clientX:x0, clientY:y0 });
    var t1 = new w.Touch({ identifier:1, target:el, clientX:x0 + dx, clientY:y0 + dy });
    el.dispatchEvent(new w.TouchEvent('touchstart', { touches:[t0], changedTouches:[t0], bubbles:true }));
    el.dispatchEvent(new w.TouchEvent('touchmove', { touches:[t1], changedTouches:[t1], bubbles:true }));
    el.dispatchEvent(new w.TouchEvent('touchend', { touches:[], changedTouches:[t1], bubbles:true }));
  }
  var main = d.querySelector('main');

  eis('van de eerste periode rond naar de laatste', app.datumFilter, 'onbekend');
  veeg(lijst, -100, 0);
  eis('en weer rond naar de eerste', app.datumFilter, '');
  veeg(lijst, -70, 80);
  eis('een schuine veeg die meer op en neer gaat is scrollen', app.datumFilter, '');
  veeg(lijst, -45, 0);

  eis('een veeg vanaf de schermrand is voor het systeem (terug in Edge)', app.datumFilter, '');
  veeg(lijst, 100, 0, w.innerWidth - 10);
  eis('ook vanaf de rechterrand', app.datumFilter, '');
  veeg(lijst, -60, 0);
  eis('precies 60 px opzij telt wel', app.datumFilter, '~dag');
  app.datumFilter = ''; app.render();

  /* een periode die er niet tussen staat: opnieuw beginnen bij alle */
  app.datumFilter = 'bla'; app.render();
  veeg(lijst, -100, 0);
  eis('een onbekende periode: vegen begint weer bij alle', app.datumFilter, '');

  /* tijdens zoeken: vegen kiest de periode zoals een tik op een chip */

  veeg(lijst, -100, 0);
  eis('vegen tijdens zoeken: een zelf gekozen periode, niets om terug te zetten', [app.datumFilter, app.vorigePeriode].join(), '~dag,');
  app.zoekterm = ''; app.datumFilter = ''; app.render();

  /* zonder bruikbare lijst gebeurt er niets */

  veeg(lijst, -100, 0);
  eis('zonder bestand doet vegen niets', app.datumFilter, '');
  app.fileState = fs; app.render();

  app.datumFilter = '11'; app.render();
  veeg(main, -100, 0);
  eis('van november naar december', app.datumFilter, '12');
  veeg(main, -100, 0);
  eis('dan onbekend', app.datumFilter, 'onbekend');
  veeg(main, 100, 0);
  veeg(main, -100, 0);
  eis('terug en weer heen: onbekend', app.datumFilter, 'onbekend');
  var strook = d.getElementById('chips'), chip = strook.querySelector('.chip.on');
  var sr = strook.getBoundingClientRect(), cr = chip.getBoundingClientRect();
  eis('de gekozen chip staat in beeld in de strook', cr.left >= sr.left - 1 && cr.right <= sr.right + 1, true);

  app.zichtJaar = app.huidigJaar() - 1; app.datumFilter = ''; app.render();
  veeg(main, -100, 0);
  eis('in een ander jaar slaat vegen ~dag, ~week, ~maand en jaar over: januari', app.datumFilter, '1');
  veeg(main, 100, 0);
  eis('ook terug', app.datumFilter, '');
  veeg(main, 100, 0);
  veeg(main, -100, 0);
  eis('en ook rondgaan slaat ze over', app.datumFilter, '');
  app.zichtJaar = app.huidigJaar(); app.datumFilter = ''; app.render();

  /* Lees informatie */
  var idx = app.zichtbaar();

           : s.classList.contains('on') ? 'X' : s.classList.contains('k') ? 'k' : s.classList.contains('m') ? 'm' : 'o';

  eis('bladeren opent geen nieuw venster (een keer terug sluit het)', app.modalStapel.length, stapel + 1);
  veeg(modal, 100, 0);
  eis('naar rechts: weer het eerste', titel(), app.records[idx[0]].sleutel);
  veeg(modal, 100, 0);
  eis('van het eerste rond naar het laatste', titel(), app.records[idx[idx.length - 1]].sleutel);
  eis('stippen bij het laatste: links kleiner', stippen(), 'k m o o o o o o X ' + idx.length + '/' + idx.length);
  veeg(modal, -100, 0);
  eis('en weer rond naar het eerste', titel(), app.records[idx[0]].sleutel);
  eis('de lijst eronder bleef dezelfde periode', app.datumFilter, '');
  eis('een schermlezer hoort waar je bent', d.querySelector('#infoStippen .sr').textContent, 'Event 1 van ' + idx.length);
  modal.style.maxHeight = '150px';   /* klein genoeg om te kunnen scrollen */
  modal.scrollTop = 200;
  var gescrold = modal.scrollTop > 0;
  veeg(modal, -100, 0);
  eis('een volgend event begint bovenaan', [gescrold, modal.scrollTop].join(), 'true,0');
  modal.style.maxHeight = '';
  function toets(k){ d.dispatchEvent(new w.KeyboardEvent('keydown', { key:k, bubbles:true, cancelable:true })); }
  toets('ArrowRight');
  eis('pijltoets rechts: volgende', titel(), app.records[idx[2]].sleutel);
  toets('ArrowLeft');
  eis('pijltoets links: vorige', titel(), app.records[idx[1]].sleutel);
  /* de lijst eronder verandert (bestand opnieuw ingelezen): vegen begint bij het eerste */
  app.infoIndex = -5;
  veeg(modal, -100, 0);
  eis('een event dat niet meer in de lijst staat: vegen gaat naar het eerste', titel(), app.records[idx[0]].sleutel);

  /* de stippen los nagelopen */
  app.tekenInfoStippen(1, 3);
  eis('3 events: drie stippen, geen teller', stippen(), 'o X o');
  app.tekenInfoStippen(41, 87);
  eis('87 events, het 42e: aan beide kanten kleiner', stippen(), 'k m o o X o o m k 42/87');
  app.tekenInfoStippen(6, 9);
  eis('9 events: alle stippen, geen teller', stippen(), 'o o o o o o X o o');
  app.tekenInfoStippen(0, 1);
  eis('een enkel event: een stip', stippen(), 'X');

  app.bladerInfo(1);
  d.getElementById('infoOk').click();
  eis('na Sluiten staat het laatst bekeken event geselecteerd', app.selIndex, idx[1]);

  /* de balk onderaan (049): vegen bladert, met stippen zoals in Lees informatie */
  var balk = d.getElementById('selbalk');
  function balkStippen(){
    var s = balk.querySelector('.stippen');
    if(!s || !s.querySelector('.stip')) return '(geen)';
    return Array.prototype.filter.call(s.children, function(x){ return x.className !== 'sr'; }).map(function(x){
      return x.className === 'teller' ? x.textContent
           : x.classList.contains('on') ? 'X' : x.classList.contains('k') ? 'k' : x.classList.contains('m') ? 'm' : 'o';
    }).join(' ');
  }
  function balkNaam(){ return balk.querySelector('.nm').textContent; }
  app.selIndex = idx[0]; app.render();
  eis('de balk toont het eerste event met stippen', [balkNaam(), balkStippen()].join(' | '),
      (app.records[idx[0]].naam || app.records[idx[0]].sleutel) + ' | X o o o o o o m k 1/' + idx.length);
  veeg(balk, -100, 0);
  eis('naar links vegen over de balk: het volgende event', app.selIndex, idx[1]);
  eis('de stippen gaan mee', balkStippen(), 'o X o o o o o m k 2/' + idx.length);
  eis('en de rij in de lijst is geselecteerd', !!d.querySelector('#lijst tr.sel[data-i="' + idx[1] + '"]'), true);
  var grijs = balk.querySelector('.stippen .stip:not(.on)'), blauw = balk.querySelector('.stippen .stip.on');
  eis('in de balk zijn de grijze stippen lichter dan in het venster, de huidige blauw',
      [w.getComputedStyle(grijs).backgroundColor, w.getComputedStyle(blauw).backgroundColor === w.getComputedStyle(d.querySelector('.chip.on')).backgroundColor].join(),
      'rgb(85, 97, 110),true');
  veeg(balk, 100, 0); veeg(balk, 100, 0);
  eis('ook de balk gaat rond: van het eerste naar het laatste', app.selIndex, idx[idx.length - 1]);
  veeg(balk, -100, 0);
  eis('en weer naar het eerste', app.selIndex, idx[0]);
  eis('de periode bleef staan', app.datumFilter, '');
  veeg(balk, -100, 0, 10);
  eis('ook hier niet vanaf de schermrand', app.selIndex, idx[0]);
  eis('de balk zegt een schermlezer waar je bent', balk.querySelector('.sr').textContent, 'Event 1 van ' + idx.length);
  /* de rij schuift in beeld: een korte lijst, zodat het laatste event onder de rand valt */
  main.style.height = '120px'; main.style.flex = 'none';
  main.scrollTop = 0;
  veeg(balk, 100, 0);   /* rond naar het laatste */
  var rij = d.querySelector('#lijst tr.sel'), mr = main.getBoundingClientRect(), rr = rij.getBoundingClientRect();
  eis('de rij van het nieuwe event schuift in beeld', [app.selIndex === idx[idx.length - 1], main.scrollTop > 0, rr.bottom <= mr.bottom + 1 && rr.top >= mr.top - 1].join(), 'true,true,true');
  main.style.height = ''; main.style.flex = '';
  /* een selectie die niet in de lijst staat: geen stippen, en vegen begint bij het eerste */
  app.datumFilter = '2'; app.render();
  var feb = app.zichtbaar(), buiten = idx.filter(function(k){ return feb.indexOf(k) < 0; })[0];
  app.selIndex = buiten; app.render();
  eis('februari heeft twee events, de selectie staat er niet tussen', [feb.length, feb.indexOf(buiten)].join(), '2,-1');
  var hoogMet = balk.getBoundingClientRect().height;
  eis('een selectie buiten de lijst: geen stippen', balkStippen(), '(geen)');
  app.selIndex = feb[0]; app.render();
  eis('maar de balk blijft even hoog', Math.round(hoogMet) === Math.round(balk.getBoundingClientRect().height), true);
  app.selIndex = buiten; app.render();
  veeg(balk, 100, 0);
  eis('en vegen (ook naar rechts) begint bij het eerste event van de lijst', app.selIndex, feb[0]);
  app.selIndex = idx[0]; app.datumFilter = ''; app.render();

  /* een enkel event: niets om naar te bladeren */
  app.datumFilter = '12'; app.render();
  var een = app.zichtbaar();
  eis('in december staat precies een event', een.length, 1);
  app.toonInfo(een[0]);
  eis('bij een event: een blauwe stip', stippen(), 'X');
  eis('en vegen doet niets', app.bladerInfo(1), false);
  d.getElementById('infoOk').click();
  app.selIndex = een[0]; app.render();
  eis('en de balk ook', balkStippen(), 'X');
  eis('vegen over de balk doet dan ook niets', app.bladerSel(1), false);
  /* een vervallen selectie die nog niet is hertekend (bestand opnieuw ingelezen) */
  app.datumFilter = ''; app.render(); app.selIndex = -1;
  eis('vervallen selectie, nog niet hertekend: vegen doet niets', [app.bladerSel(1), app.selIndex].join(), 'false,-1');
  app.render();
  /* een veeg over de balk is geen tik: vlak erna opent een klik geen venster */
  app.selIndex = idx[0]; app.render();
  var stapelVoor = app.modalStapel.length;
  veeg(balk, -100, 0);
  balk.click();
  eis('een klik vlak na een veeg opent Lees informatie niet', app.modalStapel.length, stapelVoor);
  balk.veegTijd = 0;
  balk.click();
  eis('een gewone tik wel', app.bovensteModaal(), 'infoModal');
  d.getElementById('infoOk').click();
  app.datumFilter = '';

  namen.forEach(function(n){ app[n] = bewaard[n]; });
  app.render();
  return new Promise(function(r){ setTimeout(r, 150); });   /* history.back laten afronden */
}

/* Het standaardfilter (050): de knop Bewaar als standaard ook op de leeskopie, en
   terug naar de standaard vanuit de kopbalk en vanuit het filtervenster. */
function testStandaard(){
  groep('Het standaardfilter terugzetten en bewaren');
  if(typeof app.zetStandaard !== 'function'){
    eis('de app kan de standaard terugzetten', typeof app.zetStandaard, 'function');
    return Promise.resolve();
  }
  var d = app.document;
  var namen = ['records','cfg','fileState','bestandsnaam','zichtJaar','datumFilter','zoekterm','hasFSA','dirHandle','kopieRij',
               'filterAan','filterType','filterCatVan','filterCatTot','filterNotitie','selIndex','vorigePeriode','zorgVoorToegang'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });
  app.cfg = { bestand:'e.txt', scheidingsteken:';', filter:{ periode:'12', categorie:1 } };
  app.fileState = 'ok'; app.bestandsnaam = 'e.txt';
  app.records = app.parse(PROEF); app.sorteer();
  app.zichtJaar = app.huidigJaar(); app.zoekterm = ''; d.getElementById('zoek').value = '';
  app.filterAan = true; app.filterType = ''; app.filterNotitie = false; app.selIndex = -1;
  app.pasStandaardFilterToe(); app.render();
  var knop = d.getElementById('filterStandaard');
  function zicht(){ return !knop.hidden; }

  eis('op de standaard: geen knop om terug te gaan', zicht(), false);
  app.datumFilter = ''; app.render();
  eis('een andere periode: de knop verschijnt', zicht(), true);
  knop.click();
  eis('een tik zet de standaard terug', [app.datumFilter, app.filterCatVan, app.filterCatTot, zicht()].join(), '12,1,1,false');
  app.filterAan = false; app.render();
  eis('het filter uit is ook een afwijking', zicht(), true);
  knop.click();
  eis('en terug staat het filter weer aan', app.filterAan, true);
  app.filterCatVan = app.filterCatTot = 2; app.render();
  eis('een andere categorie: knop', zicht(), true);
  app.zichtJaar = app.huidigJaar() + 1; app.filterCatVan = app.filterCatTot = 1; app.render();
  eis('een ander jaar: knop', zicht(), true);
  app.zichtJaar = app.huidigJaar(); app.render();

  /* tijdens zoeken geen knop; de standaard zetten haalt de zoekterm weg */
  var zoek = d.getElementById('zoek');
  zoek.value = 'kerst'; zoek.oninput.call(zoek);
  eis('tijdens zoeken geen knop (het filter staat dan opzij)', zicht(), false);
  app.zetStandaard();
  eis('de standaard zetten maakt het zoekveld leeg', [zoek.value, app.zoekterm, app.filterAan, app.datumFilter].join(), ',,true,12');

  /* zonder standaard in de configuratie is de standaard: alles */
  delete app.cfg.filter;
  app.render();
  eis('zonder standaard: een gezet filter is een afwijking', zicht(), true);
  knop.click();
  eis('en terug is alles', [app.datumFilter, app.filterCatVan].join(), ',0');
  app.cfg.filter = { periode:'12', categorie:1 };

  /* in het filtervenster: Standaard */
  app.datumFilter = ''; app.render();
  app.openFilter();
  eis('het filtervenster heeft een knop Standaard', d.getElementById('filterNaarStd').textContent, 'Standaard');
  d.getElementById('filterNaarStd').click();
  eis('die zet de standaard en sluit het venster', [app.datumFilter, app.bovensteModaal() === 'filterModal'].join(), '12,false');

  /* Bewaar als standaard: ook op de leeskopie, en dan eerst om toegang vragen */
  app.hasFSA = true; app.dirHandle = { name:'map' }; app.kopieRij = { tekst:'' };
  app.fileState = 'auth';
  app.openFilter();
  eis('op de leeskopie staat Bewaar als standaard er ook', d.getElementById('filterStd').hidden, false);
  var gevraagd = false;
  app.zorgVoorToegang = function(){ gevraagd = true; return Promise.reject(app.GEEN_TOEGANG); };
  return app.bewaarStandaardFilter(false).then(function(uit){
    eis('bewaren op de leeskopie vraagt eerst om toegang', [gevraagd, uit].join(), 'true,toegang');
    app.sluitBovenste(false);
    app.fileState = 'leeg';
    app.openFilter();
    eis('zonder bestand blijft de knop weg', d.getElementById('filterStd').hidden, true);
    app.sluitBovenste(false);
  }).then(function(){
    namen.forEach(function(n){ app[n] = bewaard[n]; });
    d.getElementById('zoek').value = app.zoekterm || '';
    app.render();
    return new Promise(function(r){ setTimeout(r, 150); });
  });
}

/* De tekst op de filterknop (051): jaar, categorie, type; het type als icoon als het
   niet past, en het notitie-icoon altijd zichtbaar. */
function testFilterKnop(){
  groep('De filterknop past zich aan');
  if(typeof app.tekenFilterKnop !== 'function'){
    eis('de app past de filterknop aan', typeof app.tekenFilterKnop, 'function');
    return Promise.resolve();
  }
  var d = app.document, f = document.getElementById('app');
  var namen = ['records','cfg','fileState','bestandsnaam','zichtJaar','datumFilter','zoekterm',
               'filterAan','filterType','filterCatVan','filterCatTot','filterNotitie','selIndex'];
  var bewaard = {}, breedte = f.style.width;
  namen.forEach(function(n){ bewaard[n] = app[n]; });
  app.cfg = { bestand:'e.txt', scheidingsteken:';' };
  app.fileState = 'ok'; app.bestandsnaam = 'e.txt';
  app.records = app.parse(PROEF); app.sorteer();
  app.zichtJaar = app.huidigJaar(); app.datumFilter = ''; app.zoekterm = ''; app.selIndex = -1;
  app.filterAan = true; app.filterType = 'Geboren'; app.filterCatVan = 1; app.filterCatTot = 2; app.filterNotitie = false;
  var mk = d.getElementById('filterMode');
  var cat = app.catBereikTekst(1, 2), jaar = String(app.zichtJaar);
  function breed(px){
    f.style.width = px + 'px';
    return new Promise(function(r){ setTimeout(function(){ app.render(); r(); }, 120); });
  }
  function tekst(){ return mk.querySelector('span').textContent; }
  function typeIcoon(){ return !!mk.querySelector('svg[aria-label="Geboren"]'); }
  return breed(700).then(function(){
    eis('breed: jaar, categorie en type voluit, in die volgorde', tekst(), jaar + ' · ' + cat + ' · Geboren');
    eis('dan geen typeicoon', typeIcoon(), false);
    return breed(290);
  }).then(function(){
    eis('smal: het type wordt een icoon', [tekst(), typeIcoon()].join(), jaar + ' · ' + cat + ' ·,true');
    eis('de volle tekst staat in de tooltip', mk.title, 'Filter: ' + jaar + ' · ' + cat + ' · Geboren');
    app.filterNotitie = true;
    return breed(320);   /* de smalste gangbare telefoon, met de ↺-knop ernaast */
  }).then(function(){
    var not = mk.querySelector('svg[aria-label="alleen met notitie"]');
    var mr = mk.getBoundingClientRect(), nr = not ? not.getBoundingClientRect() : null;
    eis('320 breed met ↺: ook de standaardknop staat er', !d.getElementById('filterStandaard').hidden, true);
    eis('320 breed: het notitie-icoon blijft achteraan in beeld',
        [!!not, mk.lastElementChild === not, !!nr && nr.width > 0 && nr.right <= mr.right + 0.5].join(), 'true,true,true');
    eis('en de tekst wordt afgekapt', mk.querySelector('span').scrollWidth > mk.querySelector('span').clientWidth, true);
    app.filterNotitie = false;
    return breed(700);
  }).then(function(){
    eis('weer breed (draaien): het type weer voluit', [tekst(), typeIcoon()].join(), jaar + ' · ' + cat + ' · Geboren,false');
    app.filterType = '';
    app.render();
    eis('zonder type alleen jaar en categorie', tekst(), jaar + ' · ' + cat);
    namen.forEach(function(n){ app[n] = bewaard[n]; });
    f.style.width = breedte;
    return new Promise(function(r){ setTimeout(function(){ app.render(); r(); }, 120); });
  });
}

function schoon(){
  if(!app || typeof app.idbDel !== 'function') return Promise.resolve();
  app.kopieRij = null;
  /* Ook de leeskopie: groepen die bewaarKopie aanroepen laten anders een
     proefkopie in de echte opslag van de app achter, en die zou de app bij de
     volgende start als zijn eigen gegevens tonen. */
  return app.idbDel('kopie').catch(function(){});
}

document.getElementById('start').onclick = draai;
document.getElementById('opnieuw').onclick = draai;
</script>
