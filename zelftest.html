  /* de tekst wegtikken doet niets: bevestigen gaat alleen met het vinkje */
  if(balk) d.getElementById('stapTekst').click();
  eis('op de tekst tikken laat de balk staan', !!balk && !balk.hidden && !!app.terug, true);
  /* na ongedaan maken biedt de knop opnieuw aan; de balk blijft */
  app.terug.herstel = true; app.render();
  eis('na ongedaan maken zegt de balk wat er gebeurde',
      balk ? d.getElementById('stapTekst').textContent : '', 'Drimmelore Vasqinter van der Langenaamsteeg-Overbeek hersteld');
  eis('en biedt de knop opnieuw aan', undo ? /^Opnieuw/.test(undo.title) : false, true);
  if(ok) ok.click();
  eis('bevestigen laat de balk verdwijnen', !!balk && balk.hidden, true);
  eis('en vergeet de stap', app.terug, null);
  app.onthoud('Bram', 'verwijderd', app.records[1].id, null);
  app.render();
  eis('een volgende stap zet de balk weer neer', !!balk && !balk.hidden, true);
  app.terug = null; app.render();

  /* 3. De naamkolom houdt 169 px over op een scherm van 360. */
  var naamCel = d.querySelector('#lijst tr[data-i] td.naam');
  eis('de naam staat in zijn eigen cel', !!naamCel, true);
  eis('en is kleiner gezet dan de rest van de regel',
      naamCel ? app.getComputedStyle(naamCel).fontSize : '(geen cel)', '17px');
  var dagCel = d.querySelector('#lijst tr[data-i] td.dag');
  eis('de andere kolommen houden hun grootte',
      dagCel ? app.getComputedStyle(dagCel).fontSize : '(geen cel)', '20px');

  /* 4. Elk venster en elk label heeft een naam. */
  var vensters = d.querySelectorAll('[role="dialog"]');
  var metNaam = 0;
  Array.prototype.forEach.call(vensters, function(v){
    var id = v.getAttribute('aria-labelledby');
    var kop = id ? d.getElementById(id) : null;
    if(kop && kop.textContent.trim()) metNaam++;
  });
  eis('alle vensters hebben een naam die ook echt bestaat',
      metNaam + ' van ' + vensters.length, vensters.length + ' van ' + vensters.length);

  var labels = d.querySelectorAll('label');
  var losse = [];
  Array.prototype.forEach.call(labels, function(l){
    var voor = l.getAttribute('for');
    if(voor){
      var doel = d.getElementById(voor);
      /* een <label for=...> werkt alleen op een invoerveld, niet op een knop */
      if(!doel || ['INPUT','TEXTAREA','SELECT'].indexOf(doel.tagName) < 0){
        losse.push(l.textContent.trim() + ' -> ' + voor);
      }
      return;
    }
    /* zonder for moet er iets naar dit label wijzen */
    if(!l.id || !d.querySelector('[aria-labelledby~="' + l.id + '"]')){
      losse.push(l.textContent.trim() + ' (wijst nergens heen)');
    }
  });
  eis('en elk label benoemt werkelijk een besturing',
      losse.length ? losse.join('; ') : 'geen losse labels', 'geen losse labels');

  /* 5. Eén schuifvlak op een laag scherm: liggend, of met het toetsenbord open.
     Een eigen schuifvlak binnen een al schuivende modal maakte dat vegen over de
     cijfers alleen het raster verschoof en OK onbereikbaar bleef. */
  var raam = document.getElementById('app');
  var hoogte = raam.style.height;
  var grid = d.querySelector('.numgrid');
  eis('het cijferraster staat er', !!grid, true);
  eis('op een hoog scherm schuift het raster zelf',
      grid ? app.getComputedStyle(grid).overflowY : '(geen raster)', 'auto');

  raam.style.height = '500px';
  return nieuwBeeld().then(function(){
    eis('het venster van de app is werkelijk lager geworden', app.innerHeight <= 560, true);
    eis('en dan schuift het raster niet meer zelf',
        grid ? app.getComputedStyle(grid).overflowY : '(geen raster)', 'visible');
    eis('en wordt het ook niet meer afgekapt',
        grid ? app.getComputedStyle(grid).maxHeight : '(geen raster)', 'none');
    var icoon = d.querySelector('.icoongrid');
    eis('hetzelfde geldt voor het raster met de iconen',
        icoon ? app.getComputedStyle(icoon).overflowY : '(geen raster)', 'visible');
    raam.style.height = hoogte;
    return nieuwBeeld();
  }).then(function(){
    eis('en op de oude hoogte is het weer zoals het was',
        grid ? app.getComputedStyle(grid).overflowY : '(geen raster)', 'auto');
    /* Een <label> in gegenereerde opmaak valt buiten de controle hierboven als
       dat stuk nu niet getekend staat; daarom ook in de bron kijken. */
    return fetch('events.html', { cache:'no-store' }).then(function(r){ return r.text(); });
  }).then(function(bron){
    var tags = bron.match(/<label[^>]*>/g) || [];
    var zonder = tags.filter(function(t){ return t.indexOf('for=') < 0 && t.indexOf('id=') < 0; });
    eis('ook in de bron staat geen label zonder doel',
        zonder.length ? zonder.join(' ') : 'geen', 'geen');
    herstel();
  }, function(e){
    herstel();
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  });
}

/* twee beeldopbouwen afwachten, zodat een nieuwe vensterhoogte ook werkelijk in
   de opmaak is doorgerekend voordat er gemeten wordt */
function nieuwBeeld(){
  return new Promise(function(klaar){
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ klaar(); }); });
  });
}

/* De versiecontrole van de app. Het versienummer staat op twee plaatsen --
   sw-events.js en events.html -- en update_cache_version.py houdt ze gelijk.
   De app vergelijkt zijn eigen nummer met dat in de offline-kopie; staat daar
   een hoger nummer, dan is er een nieuwe versie binnengehaald. */
function testVersiecontrole(){
  groep('De versiecontrole van de app');

  if(typeof app.checkAppUpdate !== 'function' || typeof app.vraagSwUpdate !== 'function' ||
     typeof app.magHerladenEenmaal !== 'function'){
    eis('de app kijkt of de offline-kopie nieuwer is', typeof app.checkAppUpdate, 'function');
    eis('en vraagt de browser om naar de worker te kijken', typeof app.vraagSwUpdate, 'function');
    eis('en herlaadt hoogstens een keer', typeof app.magHerladenEenmaal, 'function');
    return Promise.resolve();
  }

  /* een nagemaakte cacheopslag, zodat de echte niet wordt aangeraakt */
  function nepCache(naam, tekst){
    var vak = {
      match: function(){ return Promise.resolve(tekst === null ? undefined : { text: function(){ return Promise.resolve(tekst); } }); }
    };
    return {
      keys: function(){ return Promise.resolve(naam ? [naam, 'trends-v17', 'golf-score-v41'] : ['trends-v17']); },
      open: function(n){ return Promise.resolve(n === naam ? vak : { match: function(){ return Promise.resolve(undefined); } }); }
    };
  }
  function app_(n){ return 'Versie ' + n + '\n/* verder niets */'; }
  /* Het stempel van de app zelf, met het volgnummer een stap op of neer, en de
     dag een stap op of neer. Zo wordt hier met het ECHTE stempel van deze app
     gerekend in plaats van met een verzonnen getal: loopt het stempel in het
     scherm niet meer in de pas met wat de app leest, dan valt dat hier om. */
  function stap(stempel, n){
    var d = stempel.split('-');
    return d[0] + '-' + ('00' + (parseInt(d[1], 16) + n).toString(16).toUpperCase()).slice(-3);
  }
  function dag(stempel, n){
    return (parseInt(stempel.split('-')[0], 16) + n).toString(16).toUpperCase() +
           '-' + stempel.split('-')[1];
  }
  var KOPIE = 'events-v160';

  var eigen = app.appStempel();
  var bewaard = app.nieuweInhoud;
  function schoon(){ app.nieuweInhoud = bewaard; }

  /* De vergelijking loopt via tekst, dus de vorm is geen opmaakdetail maar de
     drager van de volgorde. Bij een afwijking hoort het gekregen stempel in de
     melding te staan; vandaar deze replace in plaats van een kale test(). */
  eis('de app leest zijn eigen stempel uit het scherm',
      eigen.replace(/^[0-9A-F]{7}-[0-9A-F]{3}$/, 'de voorgeschreven vorm'),
      'de voorgeschreven vorm');

  app.nieuweInhoud = false;
  return app.checkAppUpdate(nepCache(KOPIE, app_(stap(eigen, 1)))).then(function(uit){
    eis('een hoger stempel in de kopie is een nieuwe versie', uit, true);
    eis('en de app meldt dat', app.nieuweInhoud, true);
    app.nieuweInhoud = false;
    return app.checkAppUpdate(nepCache(KOPIE, app_(eigen)));
  }).then(function(uit){
    eis('hetzelfde stempel is geen nieuwe versie', uit, false);
    return app.checkAppUpdate(nepCache(KOPIE, app_(stap(eigen, -1))));
  }).then(function(uit){
    eis('een lager volgnummer ook niet', uit, false);
    /* De dag weegt zwaarder dan het volgnummer. Zonder vaste lengtes zou dit
       omvallen, en dat is precies waar de vorm van het stempel voor is. */
    return app.checkAppUpdate(nepCache(KOPIE, app_(dag(stap(eigen, 1), -1))));
  }).then(function(uit){
    eis('een hoger volgnummer van een eerdere dag is ouder', uit, false);
    return app.checkAppUpdate(nepCache(KOPIE, app_(dag(stap(eigen, -1), 1))));
  }).then(function(uit){
    eis('en een lager volgnummer van een latere dag is nieuwer', uit, true);
    app.nieuweInhoud = false;
    /* Een kopie van voor de overstap: wel een APP_VERSIE, geen stempel. Die
       geldt als ouder, anders meldt de app bij iedereen die nog zo'n kopie
       heeft staan een "nieuwe" versie die juist de oude is. */
    return app.checkAppUpdate(nepCache(KOPIE, 'var APP_VERSIE = 999;'));
  }).then(function(uit){
    eis('een kopie van voor de overstap levert geen nieuwe versie', uit, false);
    return app.checkAppUpdate(nepCache(KOPIE, 'geen stempel hierin'));
  }).then(function(uit){
    eis('een kopie zonder stempel levert geen nieuwe versie', uit, false);
    return app.checkAppUpdate(nepCache(KOPIE, null));
  }).then(function(uit){
    eis('een cache zonder events.html ook niet', uit, false);
    return app.checkAppUpdate(nepCache(null, null));
  }).then(function(uit){
    eis('en zonder eigen cache evenmin', uit, false);
    eis('de app is er niet door omgevallen', app.nieuweInhoud, false);
    return app.checkAppUpdate({ keys: function(){ return Promise.reject(new Error('stuk')); } });
  }).then(function(uit){
    eis('een stukke cacheopslag levert geen uitzondering', uit, false);

    /* de caches van de buren worden niet gelezen */
    var gevraagd = [];
    var spion = {
      keys: function(){ return Promise.resolve(['trends-v17', 'golf-score-v41', KOPIE]); },
      open: function(n){ gevraagd.push(n);
        return Promise.resolve({ match: function(){ return Promise.resolve({ text: function(){ return Promise.resolve(app_(eigen)); } }); } }); }
    };
    return app.checkAppUpdate(spion).then(function(){
      eis('alleen de eigen cache wordt geopend', gevraagd.join(), KOPIE);
    });
  }).then(function(){
    /* Twee eigen caches naast elkaar. De cachenaam gaat alleen omhoog als
       sw-events.js wijzigt, dus het nieuwste stempel staat niet per se in de
       hoogst genummerde cache -- en een afgebroken installatie laat een lege
       huls met een hoger nummer achter. Daarop verviel de melding eerder. */
    function nepCaches(kaarten){
      var namen = Object.keys(kaarten).concat(['trends-v17', 'golf-score-v41']);
      return {
        keys: function(){ return Promise.resolve(namen); },
        open: function(n){
          var v = kaarten[n];
          if(v === 'stuk') return Promise.reject(new Error('cache niet te openen'));
          return Promise.resolve({ match: function(){
            return Promise.resolve(v === null || v === undefined ? undefined
              : { text: function(){ return Promise.resolve(v); } }); } });
        }
      };
    }
    var nieuwer = app_(stap(eigen, 1)), ouder = app_(stap(eigen, -1));
    app.nieuweInhoud = false;
    return app.checkAppUpdate(nepCaches({ 'events-v160': ouder, 'events-v99': nieuwer }))
    .then(function(uit){
      eis('tussen twee eigen caches wint het nieuwste stempel, niet de hoogste naam',
          uit, true);
      app.nieuweInhoud = false;
      return app.checkAppUpdate(nepCaches({ 'events-v161': null, 'events-v160': nieuwer }));
    }).then(function(uit){
      eis('een lege huls met een hoger nummer laat de melding niet vervallen', uit, true);
      app.nieuweInhoud = false;
      return app.checkAppUpdate(nepCaches({ 'events-v161': 'stuk', 'events-v160': nieuwer }));
    }).then(function(uit){
      eis('een stukke cache telt niet mee, de rest wel', uit, true);
      app.nieuweInhoud = false;
      /* Nu met het nieuwste stempel VOORAAN: anders komt het hierboven
         toevallig als laatste langs, en zou 'de laatste die ik tegenkom' het
         ook goed doen. */
      return app.checkAppUpdate(nepCaches({ 'events-v99': nieuwer, 'events-v160': ouder }));
    }).then(function(uit){
      eis('ook als het nieuwste stempel vooraan staat wint het', uit, true);
      app.nieuweInhoud = false;
      return app.checkAppUpdate(nepCaches({ 'events-v160': ouder, 'events-v99': ouder }));
    }).then(function(uit){
      eis('twee oude kopieen leveren geen melding', uit, false);
      app.nieuweInhoud = false;
    });
  }).then(function(){
    /* Het afknijpen van registration.update(). De app heeft een echte
       registratie, en die is de terugval als er geen wordt meegegeven; daarom
       wordt hier een registratie zonder update meegegeven in plaats van null. */
    var aangeroepen = 0;
    var reg = { update: function(){ aangeroepen++; return Promise.resolve(); } };
    app.swUpdateLaatst = 0;
    eis('zonder bruikbare registratie geen aanroep', app.vraagSwUpdate({}), false);
    eis('eerste aanroep gaat door', app.vraagSwUpdate(reg), true);
    eis('en roept update aan', aangeroepen, 1);
    eis('tweede aanroep er meteen achteraan niet', app.vraagSwUpdate(reg), false);
    eis('en roept dus niet opnieuw aan', aangeroepen, 1);
    app.swUpdateLaatst = Date.now() - app.SW_UPDATE_INTERVAL - 1;
    eis('na het interval mag het weer', app.vraagSwUpdate(reg), true);
    app.swUpdateLaatst = 0;
    eis('een mislukte update werpt niet',
        app.vraagSwUpdate({ update: function(){ return Promise.reject(new Error('offline')); } }), true);

    /* Herladen gebeurt precies een keer. location is in een venster niet te
       vervangen, en herlaadEenmaal() werkelijk aanroepen zou het testvenster
       herladen. Daarom is de beslissing apart gezet en wordt die getoetst. */
    app.overstapGevraagd = true;
    eis('de eerste keer mag er worden herladen', app.magHerladenEenmaal(), true);
    eis('de tweede keer niet meer', app.magHerladenEenmaal(), false);
    eis('en daarna ook niet', app.magHerladenEenmaal(), false);
    app.overstapGevraagd = false;
    eis('zonder verzoek om over te stappen nooit', app.magHerladenEenmaal(), false);

    /* De melding over een nieuwe versie gaat over de app, niet over het bestand.
       Hij stond alleen in de gewone toestand, en op een telefoon begint elke
       sessie zonder werkmap -- dus zag je hem pas nadat je het bestand had
       gekozen. */
    var bewaardState = app.fileState, bewaardInhoud = app.nieuweInhoud,

    var balk = function(){ return app.document.getElementById('filebar').textContent; };
    var knop = function(){ return !!app.document.getElementById('fNieuw'); };
    app.nieuweInhoud = true;
    app.kopieRij = { bestand:'e.txt', tekst:'', tijd:Date.now() };

    [['leeg', true], ['kopie', true], ['ok', true],
     ['auth', false], ['geencfg', false]].forEach(function(paar){
      app.fileState = paar[0];

/* De zelftest mag niets achterlaten in de opslag die de app zelf gebruikt. */
/* De lokale leeskopie: de laatst ingelezen inhoud, zodat de app offline iets te
   tonen heeft voordat het bestand gekoppeld is. Het gevaar zit niet in het
   bewaren maar in het terugschrijven, dus de controles hieronder draaien vooral
   om de vraag of er een pad bestaat waarlangs die kopie het bestand kan
   overschrijven. */
function testLeeskopie(){
  groep('De lokale leeskopie');
  if(typeof app.bewaarKopie !== 'function' || typeof app.leesKopie !== 'function' ||
     typeof app.vulUitKopie !== 'function' || typeof app.magWijzigen !== 'function'){
    eis('de app bewaart een leeskopie', typeof app.bewaarKopie, 'function');
    eis('en leest hem bij het opstarten', typeof app.leesKopie, 'function');
    eis('en kan hem lezen zonder de toestand te wijzigen', typeof app.vulUitKopie, 'function');
    eis('en weet wanneer wijzigen mag', typeof app.magWijzigen, 'function');
    return Promise.resolve();
  }

  var namen = ['records','bestandsnaam','fileState','kopieRij','selIndex',
               'herstelRij','herstelStand','terug','idbPut'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });
  function zetTerug(){ namen.forEach(function(n){ app[n] = bewaard[n]; }); }

  var INHOUD = '15;Proefpersoon;verjaardag;;1\n';
  return app.idbDel('kopie').catch(function(){}).then(function(){
    return app.bewaarKopie('proef.txt', INHOUD);
  }).then(function(){
    return app.idbGet('kopie');
  }).then(function(rij){
    eis('inlezen legt een kopie vast', !!rij, true);
    eis('met de naam van het bestand', rij && rij.bestand, 'proef.txt');
    eis('en met de inhoud', rij && rij.tekst, INHOUD);

    /* opstarten zonder gekoppeld bestand -- op Android is dat elke sessie */
    app.records = []; app.bestandsnaam = ''; app.fileState = 'leeg'; app.kopieRij = null;
    return app.leesKopie();
  }).then(function(gelukt){
    eis('zonder gekoppeld bestand wordt de kopie gebruikt', gelukt, true);
    eis('en de lijst is gevuld', app.records.length, 1);
    eis('de toestand zegt dat het een kopie is', app.fileState, 'kopie');
    eis('maar niets geldt als niet-opgeslagen', app.nietOpgeslagen(), false);
    eis('wijzigen mag niet', app.magWijzigen(), false);
    eis('de melding noemt het bestand', /proef\.txt/.test(app.kopieTekst()), true);
    eis('en zegt dat wijzigen niet kan', /wijzigen kan nu niet/.test(app.kopieTekst()), true);

    /* dit is de kern: er mag geen weg zijn waarlangs de kopie wordt weggezet */
    var voor = app.gedownloadVersie;
    app.downloaden();
    eis('downloaden vanuit de kopie doet niets', app.gedownloadVersie, voor);

    /* een werkelijk gekoppeld bestand gaat altijd voor op de kopie */
    app.fileState = 'ok';
    return app.leesKopie();
  }).then(function(gelukt){
    eis('met een gekoppeld bestand wordt de kopie niet gebruikt', gelukt, false);
    eis('en de toestand blijft ongemoeid', app.fileState, 'ok');
    eis('en wijzigen mag dan wel', app.magWijzigen(), true);

    /* geen toegang tot de map: de melding daarover vraagt om actie en mag niet
       worden overschreven, maar de events zijn ondertussen wel in te zien */
    app.records = []; app.fileState = 'auth';
    return app.vulUitKopie();
  }).then(function(gelukt){
    eis('zonder toegang wordt de lijst toch gevuld', gelukt, true);
    eis('en staat er iets in', app.records.length, 1);
    eis('maar blijft de melding over de toegang staan', app.fileState, 'auth');
    eis('en wijzigen mag niet', app.magWijzigen(), false);

    /* de buffer terugzetten: dan is wat je ziet niet meer de kopie */
    app.fileState = 'kopie'; app.terug = null;
    app.herstelRij = { bestand:'proef.txt', tekst:'20;Ander;verjaardag;;1\n',
                       versie:(app.wijzigVersie || 0) + 1, basis:null };
    app.herstelStand = 'terugzetten';
    app.zetHerstelTerug();
    eis('de buffer terugzetten haalt de kopie-melding weg', app.fileState === 'kopie', false);
    eis('en wat je dan ziet geldt als niet opgeslagen', app.nietOpgeslagen(), true);

    /* een weigerende opslag mag het bewerken niet in de weg zitten */
    app.idbPut = function(){ return Promise.reject(new Error('QuotaExceededError')); };
    return app.bewaarKopie('proef.txt', INHOUD).then(
      function(){ return 'geen uitzondering'; },
      function(){ return 'gooide'; }
    );
  }).then(function(uit){
    app.idbPut = bewaard.idbPut;
    eis('een weigerende opslag levert geen uitzondering', uit, 'geen uitzondering');

    /* en zonder kopie gedraagt het opstarten zich als voorheen */
    app.fileState = 'leeg'; app.records = []; app.kopieRij = null;
    return app.idbDel('kopie').catch(function(){}).then(function(){
      return app.leesKopie();
    });
  }).then(function(gelukt){
    eis('zonder kopie verandert er niets aan het opstarten', gelukt, false);
    eis('en blijft de toestand leeg', app.fileState, 'leeg');
    zetTerug();
    return app.idbDel('kopie').catch(function(){});
  }, function(e){
    zetTerug();
    eis('de groep liep door', 'uitzondering: ' + (e && e.message), 'ja');
  });
}

/* De downloadbanner op het pad zonder File System Access -- dus wat hij op zijn
   telefoon elke sessie ziet. Die banner stond permanent in beeld en kostte 131
   van de 640 pixels; met het toetsenbord open bleef er nul lijstregel over. Hij
   hoort nu alleen te verschijnen als er werkelijk iets te bewaren is, en de
   losse downloadknop hoort in App-status te staan zodat die mogelijkheid niet
   verdwijnt. */
function testDownloadbanner(){
  groep('De downloadbanner zonder werkmap');
  var bewaard = {};
  ['hasFSA','fileState','bestandsnaam','records','gedownloadVersie','saveState','selIndex']
    .forEach(function(n){ bewaard[n] = app[n]; });

  function stand(){
    app.render();
    var knop = app.document.getElementById('fDl');
    var tekst = app.document.querySelector('#filebar .banner-text');
    return { knop: !!knop, knopTekst: knop ? knop.textContent : '',
             tekst: tekst ? tekst.textContent : '' };
  }

  app.hasFSA = false;
  app.fileState = 'ok';
  app.bestandsnaam = 'e.txt';
  app.records = app.parse('A;a;Gebeurtenis;D20260101;1\n');
  app.gelijkgezet();
  app.gedownloadVersie = null;
  app.selIndex = -1;

  var a = stand();
  eis('zonder wijziging staat er geen downloadbanner', a.knop, false);
  eis('en dus ook geen melding over opslaan', a.tekst, '');

  app.records[0].naam = 'gewijzigd';
  app.wijzig();
  var b = stand();
  eis('met een wijziging verschijnt de knop', b.knop, true);
  eis('met de tekst dat er niets is opgeslagen', /Niet opgeslagen/.test(b.tekst), true);
  eis('en de knop heet Downloaden', b.knopTekst, 'Downloaden');

  app.gedownloadVersie = app.wijzigVersie;
  var c = stand();
  eis('na het downloaden legt de melding uit wat jij moet doen',
      /zelf terug in je map/.test(c.tekst), true);
  eis('en de knop heet dan Opnieuw downloaden', c.knopTekst, 'Opnieuw downloaden');

  app.gelijkgezet();
  app.gedownloadVersie = null;
  var d = stand();
  eis('is het bestand teruggezet, dan is de banner weer weg', d.knop, false);

  /* En de mogelijkheid om los een kopie te maken, die eerst in die permanente
     banner zat, moet ergens blijven. */
  app.vulAppStatus();
  var los = app.document.getElementById('stDl');
  eis('App-status heeft een eigen downloadknop', !!los, true);
  eis('die is aangesloten', !!(los && los.onclick), true);
  eis('en heet Bestand downloaden', los ? los.textContent : '', 'Bestand downloaden');

  app.hasFSA = true;
  app.vulAppStatus();
  eis('met een werkmap staat die knop er niet', !!app.document.getElementById('stDl'), false);

  Object.keys(bewaard).forEach(function(n){ app[n] = bewaard[n]; });
  app.render();
  return Promise.resolve();
}

/* Drie reparaties uit de koude review die alleen in een echt venster te meten
   zijn: de bewerkte regel die in beeld hoort te blijven, het sluiten van een
   modal dat om invoer hoort te vragen, en de meldingen die boven de lijst horen
   te staan in plaats van duizenden pixels eronder. */
function testNaBewerken(){
  groep('In beeld blijven en veilig sluiten');
  if(typeof app.toonSelectie !== 'function'){
    eis('de app brengt de selectie in beeld', typeof app.toonSelectie, 'function');
    return Promise.resolve();
  }
  var namen = ['records','selIndex','fileState','bestandsnaam','hasFSA','terug','editIndex','editRegel'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });

  /* genoeg regels om echt te kunnen scrollen */
  var regels = [];
  for(var i = 0; i < 120; i++){
    var l = String.fromCharCode(65 + (i % 26));
    regels.push(l + i + ';' + l + ' Naam' + i + ';Gebeurtenis;D2026' +
                String((i % 12) + 1).padStart(2, '0') + String((i % 28) + 1).padStart(2, '0') + ';1');
  }
  app.hasFSA = false;
  app.fileState = 'ok';
  app.bestandsnaam = 'e.txt';
  app.records = app.parse(regels.join('\n') + '\n');
  app.sorteer();
  app.gelijkgezet();
  app.selIndex = -1;
  app.render();

  function inBeeld(){
    var m = app.document.querySelector('main');
    var rij = app.document.getElementById('lijst').querySelector('tr[data-i="' + app.selIndex + '"]');
    if(!rij) return 'rij niet gevonden';
    var r = rij.getBoundingClientRect(), mr = m.getBoundingClientRect();
    return (r.bottom > mr.top && r.top < mr.bottom) ? 'in beeld' : 'buiten beeld';
  }

  /* het laatste record naar voren halen: dat verplaatst het over de hele lijst */
  var laatste = app.records.length - 1;
  var m = app.document.querySelector('main');
  m.scrollTop = m.scrollHeight;
  app.selIndex = laatste;
  app.openModal(laatste);
  app.document.getElementById('fSleutel').value = 'Aaa, Eerste';
  app.document.getElementById('fNaam').value = 'Aaa Eerste';
  app.bewaarModal();
  eis('een bewerkte regel die anders sorteert blijft in beeld', inBeeld(), 'in beeld');

  /* en een gewone tik op een rij mag het scherm niet laten springen */
  m.scrollTop = 0;
  var voorTik = m.scrollTop;
  app.selIndex = 2; app.render(); app.toonSelectie();
  eis('een rij die al zichtbaar is laat het scherm staan', m.scrollTop, voorTik);

  /* sluiten met gewijzigde invoer hoort te vragen */
  app.selIndex = -1; app.render();
  app.openModal(0);
  app.document.getElementById('fNaam').value = 'Iets Anders Getypt';
  app.document.getElementById('modal').dispatchEvent(
    new app.MouseEvent('click', { bubbles: true }));
  eis('naast de modal tikken met gewijzigde invoer sluit hem niet',
      app.document.getElementById('modal').hidden, false);
  eis('maar vraagt erom', app.document.getElementById('confirm').hidden, false);
  eis('met de vraag over aangetroffen wijzigingen',
      app.document.getElementById('cTitle').textContent, 'Wijzigingen aangetroffen');
  app.document.getElementById('cNo').click();
  app.document.getElementById('mCancel').click();
  eis('Annuleren met gewijzigde invoer vraagt ook',
      app.document.getElementById('confirm').hidden, false);
  app.document.getElementById('cNo').click();
  app.bergModaal('modal');

  /* zonder wijziging mag sluiten gewoon doorgaan */
  app.openModal(0);
  app.document.getElementById('modal').dispatchEvent(
    new app.MouseEvent('click', { bubbles: true }));
  eis('zonder gewijzigde invoer sluit hij zonder te vragen',
      app.document.getElementById('modal').hidden, true);
  eis('en zonder vraag', app.document.getElementById('confirm').hidden, true);

  /* de teller: een tweede getal alleen als het iets toevoegt */
  app.records = app.parse(regels.join('\n') + '\ndit is geen event\n');
  app.sorteer(); app.selIndex = -1; app.gelijkgezet(); app.render();
  eis('de teller noemt geen twee keer hetzelfde getal',
      app.document.getElementById('count').textContent, String(120));
  eis('en de melding over onbegrepen regels staat er',
      /onbekend formaat/.test(app.document.getElementById('bad').textContent), true);
  /* en die melding hoort boven de lijst te staan, niet eronder */
  var bad = app.document.getElementById('bad');
  var lijst = app.document.getElementById('lijst');
  eis('de melding staat boven de lijst in de opbouw',
      bad.compareDocumentPosition(lijst) & 4 ? 'boven' : 'onder', 'boven');

  namen.forEach(function(n){ app[n] = bewaard[n]; });
  app.render();
  return Promise.resolve();
}

/* Het schermtoetsenbord. Dit is het enige overgebleven punt uit de koude review
   dat de GEGEVENS kan raken: Gboard kan een achternaam als "Nijhuis" of
   "d'Hondt" door een woordenboekwoord vervangen, en die correctie belandt dan in
   events_mark.txt. De attributen hieronder houden dat tegen voor zover de browser
   zich eraan houdt -- een garantie is het niet, want het hangt ook van de
   toetsenbordinstellingen van het toestel af. Een bestandsnaam mag bovendien geen
   hoofdletter krijgen: op schijf is Events.txt een ander bestand dan events.txt. */
function testToetsenbord(){
  groep('Het schermtoetsenbord');
  var d = app.document;
  function at(id, naam){
    var el = d.getElementById(id);
    return el ? (el.getAttribute(naam) === null ? '(geen)' : el.getAttribute(naam)) : '(veld weg)';
  }

  /* de velden waarvan de inhoud in het bestand terechtkomt */
  [['fSleutel', 'words'], ['fNaam', 'words']].forEach(function(paar){
    eis(paar[0] + ': autocorrectie uit', at(paar[0], 'autocorrect'), 'off');
    eis(paar[0] + ': spellingcontrole uit', at(paar[0], 'spellcheck'), 'false');
    eis(paar[0] + ': hoofdletter per woord', at(paar[0], 'autocapitalize'), paar[1]);
  });
  eis('fNotitie: autocorrectie uit', at('fNotitie', 'autocorrect'), 'off');
  eis('fNotitie: spellingcontrole uit', at('fNotitie', 'spellcheck'), 'false');

  /* een bestandsnaam: geen hoofdletter, geen correctie */
  eis('pickNew: geen hoofdletter', at('pickNew', 'autocapitalize'), 'off');
  eis('pickNew: autocorrectie uit', at('pickNew', 'autocorrect'), 'off');
  eis('pickNew: spellingcontrole uit', at('pickNew', 'spellcheck'), 'false');

  /* de scheidingstekens: één teken, nooit een hoofdletter */
  ['cfgSep', 'cfgOf'].forEach(function(id){
    eis(id + ': geen hoofdletter', at(id, 'autocapitalize'), 'off');
    eis(id + ': spellingcontrole uit', at(id, 'spellcheck'), 'false');
  });
  eis('cfgTitel: autocorrectie uit', at('cfgTitel', 'autocorrect'), 'off');

  /* het zoekveld: geen correctie, en de zoektoets op het toetsenbord */
  eis('zoek: geen hoofdletter', at('zoek', 'autocapitalize'), 'off');
  eis('zoek: autocorrectie uit', at('zoek', 'autocorrect'), 'off');
  eis('zoek: de toetsenbordtoets heet zoeken', at('zoek', 'enterkeyhint'), 'search');

  /* en die toets doet nu iets: het toetsenbord weg, zodat de lijst zichtbaar
     wordt. Er is geen formulier, dus hij deed eerst niets.
     Eerst de app in een bruikbare toestand zetten: zonder gekoppeld bestand staat
     het zoekveld op disabled en kan het de focus niet krijgen. */
  var terugFileState = app.fileState, terugNaam = app.bestandsnaam;
  app.fileState = 'ok';
  app.bestandsnaam = 'e.txt';
  app.render();
  var veld = d.getElementById('zoek');
  veld.focus();
  var hadFocus = d.activeElement === veld;
  var ev = new app.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
  veld.dispatchEvent(ev);
  eis('het zoekveld had de focus', hadFocus, true);
  eis('Enter in het zoekveld laat de focus los', d.activeElement === veld, false);
  eis('en verstuurt niets', ev.defaultPrevented, true);

  app.fileState = terugFileState; app.bestandsnaam = terugNaam; app.render();

  /* Enter in de velden van de bewerkmodal. Het eventveld is een textarea, dus
     daar zette Enter een regeleinde -- dat bij het opslaan stil een spatie werd.
     De toets zegt nu wat ze doet en doet dat ook. */
  app.fileState = 'ok';
  app.bestandsnaam = 'e.txt';
  app.records = app.parse('A;a;Gebeurtenis;D20260101;1');
  app.sorteer(); app.gelijkgezet(); app.selIndex = -1; app.render();
  app.openModal(-1);
  var sl = d.getElementById('fSleutel'), nm = d.getElementById('fNaam'),
      nt = d.getElementById('fNotitie');

  /* Een nieuw event begint op de eerste categorie, net als een categorieveld dat
     niet te lezen is. Dat was 2, en 2 hoeft niet in de configuratie te staan. */
  eis('een nieuw event begint op categorie 1', app.cat, 1);

  eis('het eventveld meldt de toets als doorgaan', at('fSleutel', 'enterkeyhint'), 'next');
  eis('en de naam als klaar', at('fNaam', 'enterkeyhint'), 'done');
  eis('en de notitie ook', at('fNotitie', 'enterkeyhint'), 'done');

  function enter(el){
    el.focus();
    var ev = new app.KeyboardEvent('keydown', { key:'Enter', bubbles:true, cancelable:true });
    el.dispatchEvent(ev);
    return ev;
  }
  sl.value = 'Vasqinter, Drimmelore';
  var e1 = enter(sl);
  eis('Enter in het eventveld wordt tegengehouden, dus geen regeleinde',
      e1.defaultPrevented, true);
  eis('en de toets gaat door naar het naamveld', d.activeElement === nm, true);

  nm.value = 'Drimmelore';
  var e2 = enter(nm);
  eis('Enter in het naamveld laat de focus los', e2.defaultPrevented, true);
  eis('zodat Type, Datum en Categorie in beeld komen', d.activeElement === nm, false);

  nt.value = 'iets';
  var e3 = enter(nt);
  eis('Enter in de notitie doet hetzelfde', e3.defaultPrevented, true);
  eis('want een regeleinde wordt daar bij het opslaan een spatie',
      d.activeElement === nt, false);
  app.sluitBovenste(false);

  /* het jaarveld was al goed; dat vastleggen zodat het zo blijft */
  eis('jaarVeld: cijfertoetsenbord', at('jaarVeld', 'inputmode'), 'numeric');
  return Promise.resolve();
}

function schoon(){
  if(!app || typeof app.idbDel !== 'function') return Promise.resolve();
  app.herstelRij = null;
  app.herstelStand = '';
  app.kopieRij = null;
  /* Ook de leeskopie: groepen die bewaarKopie aanroepen laten anders een
     proefkopie in de echte opslag van de app achter, en die zou de app bij de
     volgende start als zijn eigen gegevens tonen. */
  return app.idbDel('herstel').catch(function(){})
    .then(function(){ return app.idbDel('kopie').catch(function(){}); });
}

document.getElementById('start').onclick = draai;
document.getElementById('opnieuw').onclick = draai;
</script>
