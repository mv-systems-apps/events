    }).join(' / ');
  }
  /* De downloadmelding verschijnt alleen als er iets te bewaren is -- hij stond
     eerst permanent in beeld en koste daar 131 pixels. Dus voor deze groep eerst
     een wijziging maken, anders is er niets om naast de versiemelding te zetten. */
  var DOWNLOAD = 'Niet opgeslagen.';
  var NIEUW    = 'Er is een';
  var MISLUKT  = 'Opslaan mislukt. Controleer';
  function erStaat(id){ return !!app.document.getElementById(id); }
  app.wijzig();
  app.render();
  eis('zonder bestands-API en met een wijziging staan er twee meldingen',
      banners(), DOWNLOAD + ' / ' + NIEUW);
  eis('met de downloadknop', erStaat('fDl'), true);
  eis('en de herlaadknop', erStaat('fNieuw'), true);

  var echt = app.nieuweVersie;
  app.nieuweVersie = null;
  app.render();
  eis('is er geen nieuwe versie, dan alleen de downloadmelding', banners(), DOWNLOAD);
  eis('en geen herlaadknop', erStaat('fNieuw'), false);

  app.gelijkgezet();
  app.render();
  eis('en zonder wijziging staat er helemaal niets', banners(), '(geen)');
  eis('ook geen downloadknop', erStaat('fDl'), false);
  app.wijzig();

  app.nieuweVersie = echt;
  app.hasFSA = true;
  app.render();
  eis('met bestands-API alleen de melding over de nieuwe versie', banners(), NIEUW);
  eis('en geen downloadknop', erStaat('fDl'), false);

  app.saveState = 'fout';
  app.render();
  eis('ook bij een mislukte schrijfactie staan er twee', banners(), MISLUKT + ' / ' + NIEUW);
  eis('met Opnieuw proberen', erStaat('fOpnieuw'), true);
  eis('en ook dan de herlaadknop', erStaat('fNieuw'), true);

  app.saveState = '';
  app.hasFSA = false;
  app.wijzig();
  app.render();
  eis('met twee meldingen en een niet-opgeslagen wijziging staan ze er nog',
      banners(), DOWNLOAD + ' / ' + NIEUW);
  var k4 = app.document.getElementById('fNieuw');
  eis('maar is herladen dan niet mogelijk', !!(k4 && k4.disabled), true);
  gestuurd.length = 0;
  app.stapOverNaarNieuweVersie();
  eis('en een klik doet niets', gestuurd.length, 0);

  app.overstapGevraagd = false;   /* anders herlaadt het testframe zichzelf */
  for(var k in bewaard) app[k] = bewaard[k];
  app.gelijkgezet(); app.render();
}

/* ------------------ opslaan, met een nagemaakte bestandsmap ------------------ */
/* De File System Access API is hier nagemaakt, zodat het opslaan te volgen is
   zonder een echte map aan te raken. De namaak houdt net als Chrome een
   exclusief slot op een bestand zolang er een writable open staat: schrijven
   er twee tegelijk, dan loopt de tweede ertegenaan en is dat te zien. */
function maakMap(opt){
  var o = opt || {};
  var fs = {}, sloten = {}, gebeurd = [], klok = 1000;
  var V = o.vertraging || 4;
  function wacht(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function fout(naam){ var e = new Error('kan niet'); e.name = naam; return e; }
  function handle(naam){
    return {
      name: naam,
      getFile: function(){
        return wacht(V).then(function(){
          if(!fs[naam]) throw fout('NotFoundError');
          var f = fs[naam];
          var uit = { lastModified:f.mtime, size:(f.size === undefined ? f.tekst.length : f.size),
                      text:function(){ return Promise.resolve(f.tekst); } };
          if(o.naLezen) o.naLezen(naam, fs);
          return uit;
        });
      },
      createWritable: function(){
        return wacht(V).then(function(){
          if(sloten[naam]){ gebeurd.push('slot ' + naam); throw fout('NoModificationAllowedError'); }
          if(o.backupFaalt && /_backup/.test(naam)) throw fout('NotAllowedError');
          if(o.schrijfFaalt && !/_backup/.test(naam)) throw fout('NotAllowedError');
          /* één bestand onschrijfbaar, de rest gewoon: nodig om een halve
             wijziging over twee bestanden na te bootsen */
          if(o.weigerNaam === naam){ gebeurd.push('geweigerd ' + naam); throw fout('NotAllowedError'); }
          sloten[naam] = true;
          var buf = '';
          return {
            write: function(t){ return wacht(V).then(function(){ buf += t; }); },
            close: function(){
              return wacht(V).then(function(){
                klok += 1000;
                fs[naam] = { tekst:buf, mtime:klok };
                delete sloten[naam];
                gebeurd.push('schreef ' + naam);
              });
            }
          };
        });
      }
    };
  }
  return {
    fs: fs, gebeurd: gebeurd,
    getFileHandle: function(naam, opties){
      return wacht(V).then(function(){
        if(!fs[naam] && !(opties && opties.create)) throw fout('NotFoundError');
        return handle(naam);
      });
    },
    values: function(){ return { next:function(){ return Promise.resolve({ done:true }); },
                                 [Symbol.asyncIterator]:function(){ return this; } }; }
  };
}

function testOpslag(){
  groep('Opslaan, met een nagemaakte bestandsmap');

  /* alles wat we van de app overnemen gaat na deze groep weer terug */
  var bewaard = {
    dirHandle: app.dirHandle, hasFSA: app.hasFSA, bestandsnaam: app.bestandsnaam,
    cfg: app.cfg, fileState: app.fileState, records: app.records,
    idbGet: app.idbGet, idbPut: app.idbPut, idbDel: app.idbDel, saveState: app.saveState
  };
  var idb = {};
  app.idbGet = function(k){ return Promise.resolve(idb[k]); };
  app.idbPut = function(k, v){ idb[k] = v; return Promise.resolve(); };
  app.idbDel = function(k){ delete idb[k]; return Promise.resolve(); };

  var map;
  function opzetten(opt){
    map = maakMap(opt);
    map.fs['events.txt'] = { tekst:'A;a;Geboren;D20000101;1\n', mtime:1000 };
    idb = {}; idb['backup:events.txt'] = app.dagsleutel();   /* backup van vandaag al gedaan */
    app.dirHandle = map; app.hasFSA = true; app.bestandsnaam = 'events.txt';
    app.cfg = { bestand:'events.txt', scheidingsteken:';' };
    app.fileState = 'ok'; app.laatstGelezen = 1000; app.saveState = '';
    /* ook de grootte, want de nagemaakte map geeft die nu net als een echt
       bestand terug en de botsingscontrole kijkt naar beide */
    app.laatstGrootte = map.fs['events.txt'].tekst.length;
    app.schrijfBezig = false; app.negeerBotsing = false;
    app.records = app.parse('A;a;Geboren;D20000101;1');
    app.gelijkgezet();
  }
  function voegToe(n){
    app.records.push({ sleutel:'R' + n, naam:'r' + n, type:'Geboren',
                       code:'D200001' + (n < 10 ? '0' + n : n), cat:1, notitie:'', id:100 + n });
    app.wijzig();
  }
  function regels(){
    var f = map.fs['events.txt'];
    return f ? f.tekst.split('\n').filter(function(x){ return x !== ''; }).length : 0;
  }
  function wacht(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  /* Wachten tot de app klaar is met opslaan, in plaats van een vast aantal
     milliseconden. Een schrijfactie duurt op een telefoon langer dan op een
     laptop; met een vaste wachttijd keek deze groep naar een actie die nog
     liep, en dan leek de app fout terwijl alleen de test te snel was. */
  function rust(max){
    var eind = Date.now() + (max || 15000);
    return new Promise(function(klaar){
      (function kijk(){
        if((!app.schrijfBezig && app.saveState !== 'bezig') || Date.now() > eind) return klaar();
        setTimeout(kijk, 5);
      })();
    });
  }
  /* Niets in de nagemaakte map blind uitlezen: mislukt een controle, dan hoort
     dat een rode regel te geven en niet de hele test af te breken. */
  function inhoud(naam){ var f = map.fs[naam]; return f ? f.tekst : '(bestaat niet)'; }
  function bestaat(naam){ return !!map.fs[naam]; }
  function sloten(){ return map.gebeurd.filter(function(g){ return g.indexOf('slot') === 0; }).length; }

  /* 1. twee keer opslaan in hetzelfde venster: het slot moet er al om zijn
        voordat de botsingscontrole op het bestandssysteem wacht */
  opzetten();
  voegToe(1); app.bewaar();
  voegToe(2); app.bewaar();
  return rust().then(function(){
    eis('twee keer opslaan tegelijk botst niet op het bestandsslot', sloten(), 0);
    eis('en alles staat op schijf', regels(), app.records.length);
    /* het bewijs is er, dus de herstelbuffer is overbodig geworden */
    eis('en de herstelbuffer is weg', !!idb['herstel'], false);
    voegToe(3);
    eis('een nieuwe wijziging zet hem er meteen weer neer', !!idb['herstel'], true);

    /* 2. vijftien snelle wijzigingen, elk met een eigen opslagactie */
    opzetten();
    var stap = Promise.resolve();
    for(var i = 1; i <= 15; i++){
      (function(n){
        stap = stap.then(function(){ voegToe(n); app.bewaar(); return wacht(3); });
      })(i);
    }
    return stap;
  }).then(function(){ return rust(); }).then(function(){
    eis('na vijftien snelle wijzigingen staat alles op schijf', regels(), app.records.length);
    eis('en de app zegt niet onterecht dat alles is opgeslagen', app.nietOpgeslagen(), false);
    eis('zonder tegen het bestandsslot te lopen', sloten(), 0);

    /* 3. een wijziging tijdens een lopende schrijfactie moet herkenbaar blijven */
    opzetten();
    voegToe(1); app.bewaar();
    /* de tweede wijziging komt er meteen bij: de eerste schrijfactie loopt dan
       nog, want die is asynchroon. Mikken op een moment halverwege is op een
       traag toestel niet te doen. */
    voegToe(2); app.bewaar();
    /* blijven kijken tot de app klaar is: zegt hij ooit "opgeslagen" terwijl
       er minder op schijf staat dan in het geheugen? */
    var liegend = 0;
    var stap = (function meet(){
      if(!app.nietOpgeslagen() && app.saveState !== 'bezig' && !app.schrijfBezig){
        if(regels() < app.records.length) liegend++;
        return Promise.resolve();
      }
      if(!app.nietOpgeslagen() && regels() < app.records.length) liegend++;
      return wacht(5).then(meet);
    })();
    return stap.then(function(){
      eis('tijdens het schrijven blijft een nieuwe wijziging als niet-opgeslagen gelden', liegend, 0);
      eis('en uiteindelijk staat alles op schijf', regels(), app.records.length);
    });
  }).then(function(){
    /* 4. een mislukte schrijfactie: niets kwijt, en daarna lukt het wel */
    opzetten({ schrijfFaalt:true });
    var voor = inhoud('events.txt');
    voegToe(1); app.bewaar();
    return rust().then(function(){
      eis('een mislukte schrijfactie wordt gemeld', app.saveState, 'fout');
      eis('en blijft als niet-opgeslagen gelden', app.nietOpgeslagen(), true);
      eis('het bestand is dan niet aangeraakt', inhoud('events.txt'), voor);
      eis('en het geheugen is niets kwijt', app.records.length, 2);
      /* nu zonder fout opnieuw */
      map = maakMap();
      map.fs['events.txt'] = { tekst:voor, mtime:1000 };
      app.dirHandle = map; app.saveState = '';
      app.bewaar();
      return rust();
    }).then(function(){
      eis('opnieuw opslaan lukt daarna', app.saveState, 'ok');
      eis('en dan staat alles op schijf', regels(), app.records.length);
    });
  }).then(function(){
    return testBotsing();
  }).then(function(){
    return testBackup();
  }).then(function(){
    for(var k in bewaard) app[k] = bewaard[k];
    app.schrijfBezig = false; app.negeerBotsing = false;
    app.backupFout = ''; app.backupDag = {};
    app.gelijkgezet(); app.render();
  });

  /* ------------- botsingen met een wijziging van buiten ------------- */
  /* Het bestand wordt hier extern gewijzigd op een gekozen moment in de
     opslagketen. Met de backup van vandaag al gedaan leest de keten het bestand
     twee keer voor het schrijven: 1 de controle in bewaar(), 2 de controle vlak
     voor het schrijven. Door na een bepaalde lezing toe te slaan is te meten
     welk venster is gedicht en welk venster open blijft. */
  function testBotsing(){
    groep('Een wijziging van buiten tijdens het opslaan');
    var EXTERN = 'EXTERN;x;Geboren;D19990101;1\n';

    function opzettenMetSlag(naLezing){
      var n = 0;
      opzetten({ naLezen: function(naam, fs){
        if(naam !== 'events.txt') return;
        n++;
        if(n === naLezing) fs['events.txt'] = { tekst:EXTERN, mtime:77777 };
      }});
      idb['backup:events.txt'] = app.dagsleutel();   /* backup niet in de weg */
    }

    /* 1. de gewone botsing: het bestand is al anders voordat de app begint */
    opzetten();
    map.fs['events.txt'] = { tekst:EXTERN, mtime:77777 };
    voegToe(1); app.bewaar();
    return rust().then(function(){
      eis('een bestand dat al gewijzigd is wordt niet overschreven',
          inhoud('events.txt'), EXTERN);
      eis('en dat wordt gemeld', app.saveState, 'extern');
      eis('de wijziging blijft als niet-opgeslagen gelden', app.nietOpgeslagen(), true);
      eis('het slot blijft niet hangen', app.schrijfBezig, false);

      /* 2. en met 'Toch opslaan' gaat het er alsnog in */
      app.document.getElementById('cYes').click();
      return rust();
    }).then(function(){
      eis('met "Toch opslaan" wordt er wel geschreven', regels(), app.records.length);
      eis('en de status klopt daarna weer', app.saveState, 'ok');

      /* 3. de wijziging valt na de eerste controle: dat is het venster dat de
            tweede controle dicht, en daar zit in het echt de backup in */
      opzettenMetSlag(1);
      voegToe(1); app.bewaar();
      return rust();
    }).then(function(){
      eis('een wijziging na de eerste controle wordt alsnog opgemerkt', app.saveState, 'extern');
      eis('en het bestand blijft ongemoeid', inhoud('events.txt'), EXTERN);
      eis('die wijziging blijft als niet-opgeslagen gelden', app.nietOpgeslagen(), true);
      app.document.getElementById('cNo').click();

      /* 4. de wijziging valt na de laatste controle, dus tussen die controle en
            createWritable. Dat venster kan de browser-API niet dichten; het
            staat hier vast zoals het is, zodat de beperking bekend blijft en
            niet per ongeluk verandert. */
      opzettenMetSlag(2);
      voegToe(1); app.bewaar();
      return rust();
    }).then(function(){
      eis('een wijziging tussen de laatste controle en het schrijven kan niet worden ' +
          'opgemerkt — bekende beperking van de browser', app.saveState, 'ok');
      eis('en wordt dan overschreven — zelfde beperking',
          /EXTERN/.test(inhoud('events.txt')), false);
    });
  }

  /* ------------- de dagelijkse backup ------------- */
  /* Alles hier gebruikt dezelfde nagemaakte map; de backupdag staat bij het
     begin van elke proef op "nog niet gedaan vandaag". */
  function testBackup(){
    groep('De dagelijkse backup');
    var vandaag = app.dagsleutel();

    function opzettenZonderBackup(opt){
      opzetten(opt);
      delete idb['backup:events.txt'];
      app.backupDag = {}; app.backupFout = '';
    }

    /* 1. de eerste keer opslaan die dag bewaart de inhoud van voor het opslaan */
    opzettenZonderBackup();
    var oudeInhoud = inhoud('events.txt');
    voegToe(1); app.bewaar();
    return rust().then(function(){
      eis('de eerste keer opslaan maakt een backup', bestaat('events_backup.txt'), true);
      eis('en die bevat de inhoud van voor het opslaan',
          inhoud('events_backup.txt'), oudeInhoud);
      eis('de dag wordt geboekt', idb['backup:events.txt'], vandaag);
      eis('en de app weet welke dag dat was', app.backupDag['events.txt'], vandaag);
      eis('zonder foutmelding', app.backupFout, '');

      /* 2. een tweede keer opslaan die dag laat de backup staan */
      voegToe(2); app.bewaar();
      return rust();
    }).then(function(){
      eis('een tweede keer opslaan vandaag overschrijft de backup niet',
          inhoud('events_backup.txt'), oudeInhoud);
      eis('en het opslaan zelf lukt wel', regels(), app.records.length);

      /* 3. een mislukte backup: niet als gedaan boeken, wel melden, en het
            opslaan gaat door */
      opzettenZonderBackup({ backupFaalt:true });
      voegToe(1); app.bewaar();
      return rust();
    }).then(function(){
      eis('een mislukte backup wordt niet als gedaan geboekt',
          idb['backup:events.txt'], undefined);
      eis('en wordt gemeld', /mislukt/.test(app.backupFout), true);
      eis('de melding staat onder de header',
          app.document.getElementById('bad').textContent.indexOf('Backup') >= 0, true);
      eis('het opslaan zelf gaat wel door', app.saveState, 'ok');
      eis('en alles staat op schijf', regels(), app.records.length);

      /* 4. en dan lukt het vandaag alsnog, want de dag stond nog open.
            De map wordt verwisseld voor een die de backup wel aankan; dan hoort
            laatstGelezen mee te verhuizen, anders ziet de app een botsing. */
      map = maakMap();
      map.fs['events.txt'] = { tekst:'A;a;Geboren;D20000101;1\n', mtime:1000 };
      app.dirHandle = map; app.laatstGelezen = 1000;
      app.laatstGrootte = map.fs['events.txt'].tekst.length;
      voegToe(2); app.bewaar();
      return rust();
    }).then(function(){
      eis('een volgende poging dezelfde dag maakt de backup alsnog',
          bestaat('events_backup.txt'), true);
      eis('en boekt de dag dan wel', idb['backup:events.txt'], vandaag);
      eis('en de foutmelding verdwijnt', app.backupFout, '');

      /* 5. is er nog geen bestand, dan is er niets te bewaren en blijft de dag
            open staan */
      opzettenZonderBackup();
      delete map.fs['events.txt'];
      voegToe(1); app.bewaar();
      return rust();
    }).then(function(){
      eis('zonder bestand komt er geen backup', bestaat('events_backup.txt'), false);
      eis('en dat is geen fout', app.backupFout, '');
      eis('de dag blijft open staan', idb['backup:events.txt'], undefined);
      eis('het bestand is wel aangemaakt', bestaat('events.txt'), true);
      voegToe(2); app.bewaar();
      return rust();
    }).then(function(){
      eis('en de eerstvolgende keer volgt de backup alsnog',
          bestaat('events_backup.txt'), true);
    });
  }
}

/* De opslag vastzetten. Zonder dat mag de browser bij ruimtegebrek zowel de
   offline-kopie als de mapverwijzing wissen, en dan is de app offline weg en
   moet de map opnieuw worden aangewezen. De keuzes worden nagerekend met een
   nagemaakte opslag; daarom neemt de functie er een als argument. */
function testVastgezetteOpslag(){
  groep('De vastgezette opslag');

  function nep(alVast, geef){
    return {
      gevraagd: 0,
      persisted: function(){ return Promise.resolve(alVast); },
      persist: function(){ this.gevraagd++; return Promise.resolve(geef); }
    };
  }

  /* Eerst kijken of het er staat. Zonder deze controle zou een app zonder de
     functie een uitzondering geven en daarmee de hele zelftest afbreken; dan
     zie je een halve uitslag in plaats van rode regels. */
  if(typeof app.zetOpslagVast !== 'function' || typeof app.ruimte !== 'function'){
    eis('de app kan de opslag vastzetten', typeof app.zetOpslagVast, 'function');
    eis('en kan een aantal bytes in woorden zetten', typeof app.ruimte, 'function');
    return Promise.resolve();
  }

  /* Eerst uitlezen wat de app bij het opstarten heeft opgehaald, want de
     controles hieronder zetten diezelfde variabele met een nagemaakte opslag
     opnieuw. */
  var bijStart = app.opslagVast;

  var a = nep(true, false);
  return app.zetOpslagVast(a).then(function(uit){
    eis('staat het al vast, dan is de uitkomst dat het vaststaat', uit, true);
    eis('en wordt er niet opnieuw gevraagd', a.gevraagd, 0);

    var b = nep(false, true);
    return app.zetOpslagVast(b).then(function(uit2){
      eis('staat het nog niet vast en wordt het toegekend, dan staat het vast', uit2, true);
      eis('en is er precies een keer gevraagd', b.gevraagd, 1);
    });
  }).then(function(){
    var c = nep(false, false);
    return app.zetOpslagVast(c).then(function(uit){
      eis('wordt het geweigerd, dan is de uitkomst dat het niet vaststaat', uit, false);
      eis('en is er ook dan een keer gevraagd', c.gevraagd, 1);
    });
  }).then(function(){
    /* een browser die halverwege afbreekt mag het opstarten niet raken */
    return app.zetOpslagVast({
      persisted: function(){ return Promise.reject(new Error('kapot')); },
      persist: function(){ return Promise.resolve(true); }
    }).then(function(uit){
      eis('breekt de navraag af, dan komt er geen uitzondering maar null', String(uit), 'null');
    });
  }).then(function(){
    return app.zetOpslagVast({}).then(function(uit){
      eis('kent de browser het niet, dan ook null', String(uit), 'null');
    });
  }).then(function(){
    eis('de app heeft de functie', typeof app.zetOpslagVast, 'function');
    /* bij het opstarten moet de app het echt hebben gevraagd: dan is opslagVast
       geen null meer. Kan de browser het niet, dan valt er niets te meten. */
    var kan = !!(app.navigator.storage && app.navigator.storage.persist);
    eis('en heeft het bij het opstarten gevraagd',
        kan ? (bijStart === true || bijStart === false) : 'niet van toepassing',
        kan ? true : 'niet van toepassing');
    eis('een nagemaakte opslag laat de toestand van de app ongemoeid',
        String(app.opslagVast), String(bijStart));

    eis('de ruimte in bytes', app.ruimte(512), '512 B');
    eis('de ruimte in kB', app.ruimte(2048), '2 kB');
    eis('de ruimte in MB', app.ruimte(1572864), '1,5 MB');
    eis('de ruimte in GB', app.ruimte(2147483648), '2,0 GB');
    eis('en onzin levert geen onzin op', app.ruimte(undefined), '?');
  }).then(function(){
    /* en het statusscherm moet het ook werkelijk tonen */
    app.vulAppStatus();
    /* niet op de klok wachten maar tot de regel er staat: statusOpslagVast
       vraagt het asynchroon na, en dat duurt op een traag toestel langer */
    return tot(function(){
      var el = app.document.getElementById('stVast');
      return !!(el && el.textContent && el.textContent.indexOf('bezig') < 0);
    }).then(function(){
      var el = app.document.getElementById('stVast');
      var tekst = el ? el.textContent : '(geen regel)';
      eis('het statusscherm toont een regel Vastgezet', /Vastgezet/.test(tekst), true);
      var o = app.navigator.storage;
      if(!o || !o.persisted){
        eis('en die zegt dat de browser het niet kent', /kent het niet/.test(tekst), true);
        return;
      }
      return o.persisted().then(function(al){
        /* staat het niet vast, dan hoort er te staan of het is gevraagd */
        if(!al) eis('en zegt of het is gevraagd of alleen niet vaststaat',
                    /gevraagd, niet toegekend|de vraag is niet gelukt|bij ruimtegebrek/.test(tekst), true);
        eis('en die klopt met wat de browser zegt',
            /\bja —/.test(tekst) === !!al, true);
      });
    });
  }).catch(function(e){
    /* een onverwachte uitzondering wordt een rode regel, geen afgebroken run */
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  });
}

/* Wat App-status zegt als er niets te bereiken is. Offline is dat geen gebrek
   van de app maar een omstandigheid, en dan hoort er geen rode regel te staan.
   De weging neemt de verbinding als argument, zodat dit na te rekenen is
   zonder de verbinding van de browser te hoeven verbreken. */
function testStatusNetwerk(){
  groep('App-status bij een slechte verbinding');

  if(typeof app.netwerkFout !== 'function'){
    eis('de app weegt een mislukte fetch tegen de verbinding',
        typeof app.netwerkFout, 'function');
    return Promise.resolve();
  }

  var fout = new TypeError('Failed to fetch');
  var uit = app.netwerkFout(fout, false);
  var aan = app.netwerkFout(fout, true);
  eis('offline geldt het niet als gebrek', uit.goed === false, false);
  eis('en staat er dat het niet is gecontroleerd', /niet gecontroleerd/.test(uit.tekst), true);
  eis('online geldt het wel als gebrek', aan.goed, false);
  eis('en staat de melding van de browser erbij', /Failed to fetch/.test(aan.tekst), true);
  eis('een fout zonder melding levert geen undefined op',
      /onbekende fout/.test(app.netwerkFout({}, true).tekst), true);

  /* en nu het scherm zelf, met een fetch die weigert */
  var echteFetch = app.fetch, echteWeeg = app.netwerkFout;
  function meet(online){
    app.fetch = function(){ return Promise.reject(fout); };
    app.netwerkFout = function(e){ return echteWeeg(e, online); };
    app.vulAppStatus();
    return tot(function(){
      var a = app.document.getElementById('stMan'), b = app.document.getElementById('stSw');
      return !!(a && b && a.textContent.indexOf('bezig') < 0 && b.textContent.indexOf('bezig') < 0);
    }).then(function(){
      var a = app.document.getElementById('stMan'), b = app.document.getElementById('stSw');
      return { tekst: a.textContent + ' ' + b.textContent,
               rood: a.querySelectorAll('.slecht').length + b.querySelectorAll('.slecht').length };
    });
  }

  return meet(false).then(function(r){
    eis('offline staat er geen rode regel over het manifest of de worker', r.rood, 0);
    eis('en staat er waarom niet', /niet gecontroleerd/.test(r.tekst), true);
    return meet(true);
  }).then(function(r){
    eis('online wel, want dan is er echt iets mis', r.rood > 0, true);
    eis('en met de melding erbij', /Failed to fetch/.test(r.tekst), true);
  }).then(function(){
    /* de echte fetch terug en kijken naar de twee regels in Omgeving */
    app.fetch = echteFetch;
    app.netwerkFout = echteWeeg;
    app.vulAppStatus();
    var body = app.document.getElementById('checkBody').textContent;
    eis('Omgeving noemt het protocol', /Protocol/.test(body), true);
    eis('en niet meer Verbinding, dat twee dingen betekende', /Verbinding/.test(body), false);
    eis('en zegt of er netwerk is', new RegExp('Netwerk\\s*(online|offline)').test(body.replace(/\s+/g, ' ')), true);
  }).then(function(){
    /* De regel "Versie in de offline-kopie" vulde zich nooit: hij werd gevuld
       voordat zijn eigen element bestond -- dat wordt pas gemaakt als de
       worker-regels binnen zijn -- en bleef dus op "bezig..." staan. Gemeten in
       Chromium: na 6 seconden nog steeds, terwijl er een versienummer in de
       cache stond. Hier met een nagemaakte cacheopslag, zodat het niet van de
       echte omgeving afhangt. */
    function nep(namen, tekst){
      return {
        keys: function(){ return Promise.resolve(namen); },
        open: function(){ return Promise.resolve({ match: function(){
          return Promise.resolve({ text: function(){ return Promise.resolve(tekst); } }); } }); }
      };
    }
    return tot(function(){
      var e0 = app.document.getElementById('stKopie');
      return e0 && e0.textContent.indexOf('bezig') < 0;
    }).then(function(){
      eis('de regel over de offline-kopie vult zich uit zichzelf',
          /Versie in de offline-kopie/.test(app.document.getElementById('stKopie').textContent),
          true);
      app.document.getElementById('stKopie').innerHTML = 'bezig\u2026';
      app.statusVersieKopie(nep(['events-v160', 'golf-v3'], 'Versie FFFFFFF-FFF'));
      return tot(function(){
        var e2 = app.document.getElementById('stKopie');
        return e2 && e2.textContent.indexOf('bezig') < 0;
      });
    }).then(function(){
      var t = app.document.getElementById('stKopie').textContent;
      eis('en hij vult zich met het stempel uit de kopie', /FFFFFFF-FFF/.test(t), true);
      eis('en meldt dat die nieuwer is dan deze pagina', /nieuwer dan deze pagina/.test(t), true);

      /* De volgorde moet dezelfde zijn als die van checkAppUpdate: op nummer,
         niet op tekst. Op tekst komt events-v99 na events-v160. Elke cache
         draagt hieronder zijn EIGEN stempel; met een opslag die voor elke naam
         dezelfde tekst teruggaf -- zoals hier eerst stond -- bewees deze
         controle niets, want dan kwam er bij beide sorteringen hetzelfde uit. */
      app.document.getElementById('stKopie').innerHTML = 'bezig\u2026';
      app.statusVersieKopie({
        keys: function(){ return Promise.resolve(['events-v99', 'events-v160']); },
        open: function(n){
          var stempel = n === 'events-v160' ? '1352896-ABC' : '1352896-999';
          return Promise.resolve({ match: function(){
            return Promise.resolve({ text: function(){
              return Promise.resolve('Versie ' + stempel); } }); } });
        }
      });
      return tot(function(){
        var e3 = app.document.getElementById('stKopie');
        return e3 && e3.textContent.indexOf('bezig') < 0;
      });
    }).then(function(){
      var t3 = app.document.getElementById('stKopie').textContent;
      eis('de hoogste cache wordt op nummer gekozen, niet op tekst',
          /1352896-ABC/.test(t3) ? 'het stempel uit events-v160' : t3,
          'het stempel uit events-v160');
    }, function(e){
      eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
    });
  }).catch(function(e){
    app.fetch = echteFetch;
    app.netwerkFout = echteWeeg;
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  });
}

/* De herstelbuffer. Een wijziging staat tot het opslaan alleen in het
   geheugen; sluit Android de app af, dan is hij weg. Hier wordt gemeten dat
   elke wijziging ook in IndexedDB belandt, dat een weigerende opslag niets
   kapotmaakt, en dat het snel genoeg is om zonder vertraging te kunnen. */
function testHerstelbuffer(){
  groep('De herstelbuffer');

  /* Eerst kijken of alles er staat. Zonder deze controle zou een app zonder een
     van deze functies een uitzondering geven, en dan krijg je een enkele regel
     in plaats van te zien wat er mist. */
  if(typeof app.bewaarHerstel !== 'function' || typeof app.wisHerstel !== 'function' ||
     typeof app.herstelNaLezen !== 'function' || typeof app.leesHerstel !== 'function' ||
     typeof app.zetHerstelTerug !== 'function'){
    eis('de app bewaart een herstelbuffer', typeof app.bewaarHerstel, 'function');
    eis('en kan hem wissen', typeof app.wisHerstel, 'function');
    eis('en kan na het inlezen zien of hij overbodig is',
        typeof app.herstelNaLezen, 'function');
    eis('en herkent hem bij het opstarten', typeof app.leesHerstel, 'function');
    eis('en kan hem terugzetten', typeof app.zetHerstelTerug, 'function');
    return Promise.resolve();
  }

  /* wijzig() schrijft op de achtergrond; hier wordt gewacht tot dat in de
     buffer te zien is, in plaats van een aantal milliseconden te gokken */
  function totBuffer(controle, max){
    var eind = Date.now() + (max || 8000);
    return new Promise(function(af){
      (function kijk(){
        app.idbGet('herstel').then(function(rij){
          if(controle(rij) || Date.now() > eind) return af(rij);
          setTimeout(kijk, 10);
        }, function(){ setTimeout(kijk, 10); });
      })();
    });
  }

  var namen = ['records','cfg','bestandsnaam','fileState','hasFSA','saveState',
               'laatstGeopend','laatstGelezen','herstelKan','herstelFout','idbPut',
               'herstelRij','herstelStand','terug','selIndex'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });

  var echteIdb = app.indexedDB;
  function zetIdb(f){
    Object.defineProperty(app, 'indexedDB', { value:f, configurable:true });
  }
  function nepIdb(hoe){
    return { open: function(){
      var q = {};
      setTimeout(function(){
        q.result = { transaction: function(){
          var t = { objectStore: function(){
            return { put:function(){}, get:function(){ return {}; },
                     'delete':function(){} };
          } };
          setTimeout(function(){
            if(hoe === 'afbreken'){
              t.error = { name:'QuotaExceededError' };
              if(t.onabort) t.onabort();
            } else if(hoe === 'niets'){
              /* antwoordt nooit: zo was het voor deze stap */
            } else if(t.oncomplete) t.oncomplete();
          }, 0);
          return t;
        } };
        if(q.onsuccess) q.onsuccess();
      }, 0);
      return q;
    } };
  }
  function afloop(belofte){
    return binnen(belofte.then(function(){ return 'gelukt'; },
                               function(e){ return (e && e.name) || 'mislukt'; }), 2000);
  }


  function bannerMet(stuk){
    var b = app.document.getElementById('filebar').querySelectorAll('.banner-text');
    for(var i = 0; i < b.length; i++) if(b[i].textContent.indexOf(stuk) >= 0) return b[i];
    return null;
  }

  function opzetten(){
    app.cfg = { bestand:'e.txt', scheidingsteken:';' };
    app.bestandsnaam = 'e.txt'; app.fileState = 'ok'; app.saveState = '';
    app.hasFSA = false;
    app.laatstGeopend = { naam:'e.txt', grootte:123, lastModified:1700000000000 };
    app.records = app.parse('A;a;Gebeurtenis;D20260101;\nB;b;Gebeurtenis;D20260202;');
    app.gelijkgezet();
  }

  opzetten();
  var voor = app.wijzigVersie;
  return app.bewaarHerstel().then(function(){
    return app.idbGet('herstel');
  }).then(function(rij){
    eis('een wijziging belandt in de herstelbuffer', !!rij, true);
    eis('met de naam van het bestand', rij && rij.bestand, 'e.txt');
    eis('met de inhoud van het geheugen', rij && rij.tekst, app.serialize());
    eis('met de versie waar het bij hoort', rij && rij.versie, voor);
    eis('en met waar het op is gebaseerd', rij && rij.basis && rij.basis.lastModified,
        1700000000000);
    eis('en de app weet dat het is gelukt', app.herstelKan, true);
  }).then(function(){
    /* twee wijzigingen achter elkaar: de laatste moet er staan */
    app.records[0].naam = 'gewijzigd een';
    app.wijzig();
    app.records[0].naam = 'gewijzigd twee';
    app.wijzig();
    return totBuffer(function(r){ return r && /gewijzigd twee/.test(r.tekst); });
  }).then(function(rij){
    eis('na twee wijzigingen staat de laatste in de buffer',
        /gewijzigd twee/.test(rij && rij.tekst), true);
    eis('en niet meer de eerste', /gewijzigd een/.test(rij && rij.tekst), false);
    eis('met de hoogste versie', rij && rij.versie, app.wijzigVersie);
  }).then(function(){
    /* een opslag die weigert mag niets kapotmaken */
    app.idbPut = function(){ var e = new Error('vol'); e.name = 'QuotaExceededError';
                             return Promise.reject(e); };
    return app.bewaarHerstel();
  }).then(function(){
    eis('een weigerende opslag levert geen uitzondering', app.herstelKan, false);
    eis('en de reden wordt onthouden', app.herstelFout, 'QuotaExceededError');
    app.vulAppStatus();
    var tekst = app.document.getElementById('checkBody').textContent;
    eis('App-status meldt dat het niet is veiliggesteld',
        /niet duurzaam veiliggesteld/.test(tekst), true);
    app.idbPut = bewaard.idbPut;
  }).then(function(){
    /* en snel genoeg om het zonder vertraging te kunnen doen */
    opzetten();
    var begin = Date.now();
    for(var i = 0; i < 100; i++){ app.records[0].naam = 'n' + i; app.wijzig(); }
    var hoofdbaan = Date.now() - begin;
    eis('honderd wijziging kosten samen minder dan een kwart seconde hoofdbaan',
        hoofdbaan < 250, true);
    return totBuffer(function(r){ return r && /n99/.test(r.tekst); });
  }).then(function(rij){
    eis('en de laatste van die honderd staat erin', /n99/.test(rij && rij.tekst), true);

    /* wissen mag alleen als er sindsdien niets nieuwers is bijgekomen */
    return app.wisHerstel(app.wijzigVersie - 1);
  }).then(function(gewist){
    eis('wissen op een oudere versie gebeurt niet', gewist, false);
    return app.idbGet('herstel');
  }).then(function(rij){
    eis('en de buffer staat er dus nog', !!rij, true);
    return app.wisHerstel(app.wijzigVersie);
  }).then(function(gewist){
    eis('wissen op de huidige versie wel', gewist, true);
    return app.idbGet('herstel');
  }).then(function(rij){
    eis('en dan is hij weg', !!rij, false);

    /* en het bewijs dat op de downloadweg bij het openen ontstaat */
    opzetten();
    app.records[0].naam = 'teruggezet';
    app.wijzig();
    return totBuffer(function(r){ return r && /teruggezet/.test(r.tekst); });
  }).then(function(){
    return app.herstelNaLezen('e.txt', 'iets heel anders');
  }).then(function(weg){
    eis('een bestand met andere inhoud laat de buffer staan', weg, false);
    return app.herstelNaLezen('ander.txt', app.serialize());
  }).then(function(weg){
    eis('een ander bestand ook', weg, false);
    return app.herstelNaLezen('e.txt', app.serialize());
  }).then(function(weg){
    eis('maar is de inhoud precies die van de buffer, dan is hij overbodig', weg, true);
    return app.idbGet('herstel');
  }).then(function(rij){
    eis('en dus weg', !!rij, false);

    /* ---- herkennen bij het opstarten, en de drie gevallen ---- */
    opzetten();
    app.records[0].naam = 'niet opgeslagen';
    app.wijzig();
    return totBuffer(function(r){ return r && /niet opgeslagen/.test(r.tekst); });
  }).then(function(){
    /* doen alsof de app opnieuw begint: geheugen leeg, buffer blijft staan */
    app.herstelRij = null; app.herstelStand = '';
    return app.leesHerstel();
  }).then(function(){
    eis('bij het opstarten wordt een achtergebleven wijziging herkend',
        app.herstelStand, 'wacht');
    eis('en de app weet uit welk bestand', app.herstelRij && app.herstelRij.bestand, 'e.txt');
    app.fileState = 'leeg';
    app.render();
    eis('ook zonder geopend bestand staat de melding er', !!bannerMet('Open dat bestand'), true);
    app.fileState = 'ok';

    /* het bestand is onveranderd: terugzetten is veilig */
    return app.herstelNaLezen('e.txt', 'A;a;Gebeurtenis;D20260101;\nB;b;Gebeurtenis;D20260202;');
  }).then(function(weg){
    eis('een onveranderd bestand met andere inhoud laat de buffer staan', weg, false);
    eis('en dan mag er worden teruggezet', app.herstelStand, 'terugzetten');
    app.render();
    eis('met een knop Terugzetten', !!app.document.getElementById('fHterug'), true);
    eis('en een knop Weggooien', !!app.document.getElementById('fHweg'), true);

    /* nu alsof het bestand buiten de app is gewijzigd */
    app.laatstGeopend = { naam:'e.txt', grootte:999, lastModified:1800000000000 };
    return app.herstelNaLezen('e.txt', 'A;a;Gebeurtenis;D20260101;');
  }).then(function(){
    eis('is het bestand buiten de app gewijzigd, dan wordt dat gemeld',
        app.herstelStand, 'afwijkend');
    app.render();
    eis('en zegt de melding dat ook', !!bannerMet('buiten de app gewijzigd'), true);
    eis('maar terugzetten blijft mogelijk', !!app.document.getElementById('fHterug'), true);

    /* terugzetten zet het in het geheugen en geldt als niet opgeslagen */
    app.gelijkgezet();
    app.zetHerstelTerug();
    eis('terugzetten haalt de wijziging in het geheugen',
        /niet opgeslagen/.test(app.serialize()), true);
    eis('en die geldt als niet opgeslagen', app.nietOpgeslagen(), true);
    eis('en de melding is weg', app.herstelStand, '');

    /* Twee keer terugzetten -- een dubbele tik, of de knop die na het herladen
       van de melding nog een keer wordt geraakt. Dezelfde herstelgegevens mogen
       dan niet een tweede keer worden verwerkt: dat zou de records verdubbelen
       en de versieteller nog eens verhogen. */
    /* Het aantal records zegt hier niets: zetHerstelTerug VERVANGT de lijst, dus
       dat getal verandert ook bij echte dubbele verwerking niet. Wat wel telt is
       dat de herstelgegevens na één keer verwerken zijn vrijgegeven, en dat de
       versieteller niet nog eens omhoog gaat -- die tweede verhoging zou een
       extra bufferschrijfactie uitlokken op gegevens die al verwerkt zijn. */
    eis('na terugzetten zijn de herstelgegevens vrijgegeven', app.herstelRij, null);
    var versieNa1 = app.wijzigVersie;
    app.zetHerstelTerug();
    eis('twee keer terugzetten verhoogt de versie niet nog eens',
        app.wijzigVersie, versieNa1);
    return totBuffer(function(r){ return r && /niet opgeslagen/.test(r.tekst); });
  }).then(function(rij){
    eis('en de buffer staat er nog, want het bestand heeft het nog niet', !!rij, true);

    /* weggooien */
    app.herstelRij = rij; app.herstelStand = 'terugzetten';
    app.gooiHerstelWeg();
    eis('weggooien haalt de melding weg', app.herstelStand, '');
    return totBuffer(function(r){ return !r; });
  }).then(function(rij){
    eis('en de buffer ook', !!rij, false);

    /* ---- afgebroken transacties ----
       Een transactie kan afbreken bij een vol quota of geweigerde opslag.
       Zonder onabort bleef de belofte dan open, en omdat het opslaan op de
       backup wacht, bleef de hele app daarna hangen op 'bezig'. */
    zetIdb(nepIdb('afbreken'));
    return afloop(app.idbPut('proef', 1));
  }).then(function(uit){
    eis('een afgebroken schrijfactie blijft niet hangen maar breekt af',
        uit === GEEN ? 'bleef hangen' : uit, 'QuotaExceededError');
    return afloop(app.idbGet('proef'));
  }).then(function(uit){
    eis('lezen ook', uit === GEEN ? 'bleef hangen' : uit, 'QuotaExceededError');
    return afloop(app.idbDel('proef'));
  }).then(function(uit){
    eis('en wissen ook', uit === GEEN ? 'bleef hangen' : uit, 'QuotaExceededError');

    /* en wat de app ermee doet */
    opzetten();
    app.herstelKan = null; app.herstelFout = '';
    return binnen(app.bewaarHerstel(), 2000);
  }).then(function(uit){
    eis('de buffer schrijven blijft dan ook niet hangen',
        uit === GEEN ? 'bleef hangen' : 'klaar', 'klaar');
    eis('en de app weet dat het niet is gelukt', app.herstelKan, false);
    eis('met de reden erbij', app.herstelFout, 'QuotaExceededError');
    app.render();
    eis('en dat staat in beeld, niet alleen in App-status',
        !!bannerMet('niet veiliggesteld'), true);

    app.herstelKan = null; app.herstelFout = '';
    return binnen(app.leesHerstel(), 2000);
  }).then(function(uit){
    eis('lukt lezen al niet, dan wordt dat meteen gemeld',
        uit === GEEN ? 'bleef hangen' : 'klaar', 'klaar');
    eis('en staat de waarschuwing er voordat je iets hebt getypt',
        app.herstelKan, false);
    Object.defineProperty(app, 'indexedDB', { value:echteIdb, configurable:true });
    app.herstelKan = null; app.herstelFout = '';
    return app.idbDel('herstel');
  }).then(function(){
    namen.forEach(function(n){ app[n] = bewaard[n]; });
    app.herstelKan = null; app.herstelFout = '';
    app.gelijkgezet(); app.render();
  }).catch(function(e){
    namen.forEach(function(n){ app[n] = bewaard[n]; });
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  });
}

/* Het tekenen van de lijst. Met een paar honderd records is dit het duurste
   dat de app per handeling doet, dus hier staat zowel wat het op dit toestel
   kost als de afspraak die dat laag houdt: een andere selectie tekent de lijst
   niet opnieuw. */
function testTekenen(){
  groep('Het tekenen van de lijst');

  var namen = ['records','cfg','bestandsnaam','fileState','hasFSA','saveState',
               'selIndex','zoekterm','filterAan','datumFilter'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });

  /* een lijst van dezelfde orde als een echt bestand */
  var regels = [];
  for(var i = 0; i < 240; i++){
    regels.push('S' + i + ';Naam ' + i + ';Gebeurtenis;D2026' +
                ('0' + (1 + (i % 12))).slice(-2) + ('0' + (1 + (i % 28))).slice(-2) + ';1');
  }
  app.cfg = { bestand:'e.txt', scheidingsteken:';' };
  app.bestandsnaam = 'e.txt'; app.fileState = 'ok'; app.saveState = '';
  app.zoekterm = ''; app.filterAan = false; app.datumFilter = '';
  app.records = app.parse(regels.join('\n'));
  app.sorteer(); app.gelijkgezet(); app.selIndex = -1;
  app.render();

  var lijst = app.document.getElementById('lijst');
  function tabel(){ return lijst.querySelector('table'); }
  function selRijen(){ return lijst.querySelectorAll('tr.sel'); }

  eis('de lijst staat er', !!tabel(), true);
  eis('met alle regels', lijst.querySelectorAll('tr[data-i]').length, app.records.length);

  /* een andere selectie mag de tabel niet opnieuw opbouwen */
  var voor = tabel();
  app.selIndex = 7; app.render();
  eis('een andere selectie tekent de lijst niet opnieuw', tabel() === voor, true);
  eis('en zet precies een rij op geselecteerd', selRijen().length, 1);
  eis('en wel de juiste', selRijen()[0].getAttribute('data-i'), '7');

  app.selIndex = 19; app.render();
  eis('bij de volgende selectie staat er weer precies een', selRijen().length, 1);
  eis('en is dat de nieuwe', selRijen()[0].getAttribute('data-i'), '19');

  app.selIndex = -1; app.render();
  eis('zonder selectie staat er geen geselecteerde rij', selRijen().length, 0);
  eis('en de tabel is nog steeds dezelfde', tabel() === voor, true);

  /* een echte wijziging moet wel opnieuw tekenen */
  app.records[0].naam = 'Heel iets anders';
  app.wijzig(); app.render();
  eis('een echte wijziging tekent de lijst wel opnieuw', tabel() === voor, false);
  eis('en de nieuwe naam staat erin', /Heel iets anders/.test(lijst.textContent), true);

  /* en een klik op een rij werkt nog, ook na een hertekening */
  var rij = lijst.querySelector('tr[data-i="12"]');
  if(rij) rij.dispatchEvent(new app.MouseEvent('click', { bubbles:true }));
  eis('een klik op een rij selecteert hem', app.selIndex, 12);
  if(rij) rij.dispatchEvent(new app.MouseEvent('click', { bubbles:true }));
  eis('en nog een klik laat hem weer los', app.selIndex, -1);

  /* wat het op dit toestel kost */
  function meet(f, n){
    var t = Date.now();
    for(var i = 0; i < n; i++) f();
    return (Date.now() - t) / n;
  }
  app.selIndex = -1; app.render();
  var k = 0, m = 0;
  var tikken = meet(function(){ app.selIndex = (k++ % 200); app.render(); }, 20);
  var wijzigen = meet(function(){ app.records[0].naam = 'n' + (m++); app.render(); }, 20);
  meld('een rij aantikken kost op dit toestel', tikken.toFixed(1) + ' ms');
  meld('een naam wijzigen kost', wijzigen.toFixed(1) + ' ms');
  meld('de lijst telt', app.records.length + ' regels');

  namen.forEach(function(n){ app[n] = bewaard[n]; });
  app.gelijkgezet(); app.render();
}

/* Een record is altijd precies een regel, en de configuratie mag daar niet
   dwars tegenin gaan. JSON mag "Ge\nboren" bevatten, het events-bestand niet:
   elk record met dat type werd dan twee regels, waarvan de tweede bij het
   inlezen onbegrepen is. Gemeten voordat dit erin zat: 2 regels voor 1 record. */

  groep('Een record is altijd een regel');

  var bewaard = {
    cfg: app.cfg, records: app.records, cfgKlachten: app.cfgKlachten,
    fileState: app.fileState, bestandsnaam: app.bestandsnaam, selIndex: app.selIndex
  };
  function terug(){
    Object.keys(bewaard).forEach(function(k){ app[k] = bewaard[k]; });
    app.gelijkgezet(); app.render();
  }

  try {

    var klachten = [];

      bestand: 'e.txt', titel: 'Twee\nregels', scheidingsteken: ';',
      velden: ['Event', 'Naam\nhier', 'Type', 'Datum', 'Categorie', 'Notitie'],
      types: [{ omschrijving: 'Ge\nboren' }, { omschrijving: 'Gebeurtenis' }],
      categorieen: [{ nr: 1, omschrijving: 'eerste\nregel' }]

    var zicht = function(t){ return JSON.stringify(t); };
    eis('de titel staat op een regel', zicht(uit.titel), '"Twee regels"');
    eis('een veldnaam ook', zicht(uit.velden[1]), '"Naam hier"');
    eis('een type ook', zicht(uit.types[0].omschrijving), '"Ge boren"');
    eis('een categorie-omschrijving ook', zicht(uit.categorieen[0].omschrijving), '"eerste regel"');
    eis('en een type zonder overgang blijft wat het was',
        zicht(uit.types[1].omschrijving), '"Gebeurtenis"');
    eis('en dat wordt gemeld, met het aantal',
        klachten.filter(function(k){ return /over meer dan een regel/.test(k); }).length, 1);
    eis('vier waarden, dus vier in de melding',
        /4 waarde\(n\)/.test(klachten.join(' ')), true);

    /* 2. een schone configuratie levert geen melding op */
    var schoonKlachten = [];
    app.keurCfg({ bestand: 'e.txt', titel: 'Eén regel', types: [{ omschrijving: 'Gebeurtenis' }] },
                schoonKlachten);
    eis('een schone configuratie levert daarover niets op',
        /over meer dan een regel/.test(schoonKlachten.join(' ')), false);

    /* 3. en wat er ondanks dat alles nog in zou staan, wordt bij het wegschrijven
          een spatie -- dat is de garantie, niet de hoop */
    app.cfg = { bestand: 'e.txt', scheidingsteken: ';' };
    app.records = [
      { sleutel: 'A', naam: 'aap\nbeer', type: 'Gebeurtenis', code: 'D20260101', cat: 1, notitie: '', id: 1 },
      { sleutel: 'B', naam: 'beer', type: 'Ge\nboren', code: 'D20260202', cat: 1, notitie: 'een\ntwee', id: 2 }
    ];
    var tekst = app.serialize();
    eis('twee records leveren twee regels op',
        tekst.replace(/\n$/, '').split('\n').length, 2);
    eis('en de overgangen zijn spaties geworden',
        /aap beer/.test(tekst) && /Ge boren/.test(tekst) && /een twee/.test(tekst), true);
    eis('er staat nergens nog een regelovergang in een veld',
        tekst.split('\n').filter(Boolean).every(function(r){ return r.split(';').length >= 5; }), true);
    /* en terugleesbaar: dat is waar het om gaat */
    var opnieuw = app.parse(tekst);
    eis('het teruglezen levert weer twee records', opnieuw.length, 2);
    eis('en geen enkele onbegrepen regel',
        opnieuw.filter(function(r){ return r.raw !== undefined; }).length, 0);

    /* 4. het rapport zegt nu wat de macro ook zegt over een categorieveld */
    app.cfg = { bestand: 'e.txt', scheidingsteken: ';',
                categorieen: [{ nr: 1 }, { nr: 2 }] };
    app.bestandsnaam = 'e.txt'; app.fileState = 'ok';
    app.records = app.parse('A;aap;Gebeurtenis;D20260101;1\n' +
                            'B;beer;Gebeurtenis;D20260202;\n' +
                            'C;cees;Gebeurtenis;D20260303;hoog\n');
    app.sorteer(); app.gelijkgezet(); app.selIndex = -1;
    var bev = app.controleer();
    var kop = bev.filter(function(b){ return /Categorie niet te lezen/.test(b.titel); })[0];
    eis('het rapport heeft de kop over een onleesbare categorie', !!kop, true);
    eis('met beide regels erin', kop ? kop.regels.length : 0, 2);
    eis('en wat er stond', kop ? kop.regels.join(' | ') : '',
        'B — leeg | C — "hoog"');
    var geen = app.controleer().filter(function(b){ return /buiten de lijst/.test(b.titel); });
    eis('en die regels gelden niet ook als categorie buiten de lijst', geen.length, 0);
    eis('want ze staan op de eerste categorie',
        app.records.filter(function(x){ return x.catRuw !== undefined; })
                   .every(function(x){ return x.cat === 1; }), true);

    app.records = app.parse('A;aap;Gebeurtenis;D20260101;1\n');
    app.sorteer(); app.gelijkgezet();
    var zonder = app.controleer().filter(function(b){ return /Categorie niet te lezen/.test(b.titel); });
    eis('zonder zo’n regel staat die kop er niet', zonder.length, 0);
  } catch(e){
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  }
  terug();
  return Promise.resolve();
}

/* Het scheidingsteken wijzigen raakt twee bestanden, en dat kan halverwege
   stoppen. Gemeten met een map die events.txt weigerde: de cfg stond op "#",
   het bestand nog op ";", en bij de volgende start was 2 van 2 regels
   onbegrepen -- met alleen "opslaan mislukt" op het scherm. De app repareert
   hier niets; hij zegt wat er aan de hand is, op beide momenten. */
function testSepTweeBestanden(){
  groep('Het scheidingsteken over twee bestanden');

  var bewaard = {
    dirHandle: app.dirHandle, hasFSA: app.hasFSA, bestandsnaam: app.bestandsnaam,
    cfg: app.cfg, fileState: app.fileState, records: app.records, saveState: app.saveState,
    idbGet: app.idbGet, idbPut: app.idbPut, idbDel: app.idbDel,
    laatstGelezen: app.laatstGelezen, laatstGrootte: app.laatstGrootte,
    cfgGelezen: app.cfgGelezen, cfgGrootte: app.cfgGrootte, cfgCRLF: app.cfgCRLF,
    cfgOverschreven: app.cfgOverschreven, sepOnafgemaakt: app.sepOnafgemaakt,
    sepMist: app.sepMist, schrijfBezig: app.schrijfBezig, negeerBotsing: app.negeerBotsing
  };
  function terug(){
    Object.keys(bewaard).forEach(function(k){ app[k] = bewaard[k]; });
    app.gelijkgezet(); app.render();
  }

  var opslag = {};
  app.idbGet = function(k){ return Promise.resolve(opslag[k]); };
  app.idbPut = function(k, v){ opslag[k] = v; return Promise.resolve(); };
  app.idbDel = function(k){ delete opslag[k]; return Promise.resolve(); };

  var EVENTS = 'A;aap;Gebeurtenis;D20260101;1\nB;beer;Gebeurtenis;D20260202;2\n';
  var map;
  function opzetten(weiger){
    map = maakMap({ weigerNaam: weiger });
    map.fs['events.txt'] = { tekst:EVENTS, mtime:1000 };
    map.fs['events_cfg.json'] = { tekst:'{\n  "bestand": "events.txt",\n  "scheidingsteken": ";"\n}\n',
                                  mtime:1000 };
    app.dirHandle = map; app.hasFSA = true; app.bestandsnaam = 'events.txt';
    app.cfg = { bestand:'events.txt', scheidingsteken:';', ofteken:'|' };
    app.fileState = 'ok'; app.saveState = ''; app.schrijfBezig = false; app.negeerBotsing = false;
    app.laatstGelezen = 1000; app.laatstGrootte = EVENTS.length;
    app.cfgGelezen = 1000; app.cfgGrootte = map.fs['events_cfg.json'].tekst.length;
    app.cfgCRLF = false; app.cfgOverschreven = false;
    app.sepOnafgemaakt = ''; app.sepMist = '';
    opslag = {};
    app.records = app.parse(EVENTS); app.sorteer(); app.gelijkgezet(); app.render();
  }
  function rust(ms){ return new Promise(function(r){ setTimeout(r, ms || 250); }); }
  function melding(){ return app.document.getElementById('bad').textContent; }

  /* 1. de tweede schrijfactie mislukt */
  opzetten('events.txt');
  app.openCfg();
  return rust(60).then(function(){
    app.document.getElementById('cfgSep').value = '#';
    app.bewaarCfg();
    return rust();
  }).then(function(){
    eis('de configuratie staat op het nieuwe teken',
        JSON.parse(map.fs['events_cfg.json'].tekst).scheidingsteken, '#');
    eis('maar het events-bestand is niet herschreven',
        map.fs['events.txt'].tekst, EVENTS);
    eis('de app weet dat de twee niet gelijk staan', app.sepOnafgemaakt, ';');
    eis('en zegt dat onder de header, met beide tekens',
        /scheidingsteken staat in events_cfg\.json al op "#".*nog op ";"/.test(melding()), true);
    eis('en niet alleen dat opslaan mislukte', app.saveState, 'fout');

    /* 2. nog eens opslaan, nu in een map die het wel aankan */
    var oudeFs = map.fs;
    map = maakMap();
    map.fs['events.txt'] = oudeFs['events.txt'];
    map.fs['events_cfg.json'] = oudeFs['events_cfg.json'];
    app.dirHandle = map;
    app.laatstGelezen = map.fs['events.txt'].mtime;
    app.laatstGrootte = map.fs['events.txt'].tekst.length;
    app.bewaar();
    return rust();
  }).then(function(){
    eis('dan wordt het bestand alsnog met het nieuwe teken geschreven',
        /^A#aap#/.test(map.fs['events.txt'].tekst), true);
    eis('en is de melding weg', app.sepOnafgemaakt, '');
    eis('ook werkelijk van het scherm', /scheidingsteken staat in/.test(melding()), false);

    /* 3. de volgende start met een cfg die niet bij het bestand past */
    opzetten();
    app.cfg.scheidingsteken = '#';
    return app.laden();
  }).then(function(){
    eis('alle regels zijn dan onbegrepen',
        app.records.filter(function(r){ return r.raw !== undefined; }).length, app.records.length);
    eis('en de app noemt het teken dat wel past', app.sepMist, ';');
    eis('met beide tekens in de melding',
        /past bij scheidingsteken "#"; met ";" passen ze allemaal/.test(melding()), true);

    /* 4. een bestand dat gewoon gelezen kan worden levert geen melding */
    opzetten();
    return app.laden();
  }).then(function(){
    eis('een leesbaar bestand levert geen suggestie', app.sepMist, '');
    eis('en geen melding', /passen ze allemaal/.test(melding()), false);

    /* 5. en er wordt niets beweerd als geen enkel teken past */
    eis('bij echte rommel blijft de app stil',
        app.zoekBeterSep('dit is geen regel\nen dit ook niet\n',
                         app.parse('dit is geen regel\nen dit ook niet\n')), '');
    eis('een leeg bestand ook', app.zoekBeterSep('', app.parse('')), '');
    eis('een tab wordt leesbaar opgeschreven', app.sepLabel('\t'), 'tab');
    terug();
  }, function(e){
    terug();
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  });
}

/* De verbinding met IndexedDB. idb() opent er een per aanroep en gaf hem nooit
   terug; bij elke wijziging kwam er een bij. Dat is niet alleen netheid: zolang
   er een verbinding openstaat blijft een verzoek om de database te verwijderen
   of van versie te wisselen hangen, en dat is precies waar deze controle naar
   kijkt -- deleteDatabase meldt 'blocked' zolang er nog iemand binnen is. */
function testVerbinding(){
  groep('De verbinding met de opslag');

  if(typeof app.idbPut !== 'function'){
    eis('de opslagfuncties staan er', 'nee', 'ja');
    return Promise.resolve();
  }
  /* eerst echt iets doen, zodat er een verbinding geopend is geweest */
  return app.idbPut('proefverbinding', { t: Date.now() }).then(function(){
    return app.idbGet('proefverbinding');
  }).then(function(waarde){
    eis('wat erin gaat komt er ook uit', !!waarde, true);
    return app.idbDel('proefverbinding');
  }).then(function(){
    /* Nu de database proberen te verwijderen. Lukt dat meteen, dan stond er geen
       verbinding meer open. Blijft hij hangen, dan wel -- en dan zou in een echte
       sessie ook een nieuwe versie van de app niet door de versiewissel komen. */
    return new Promise(function(klaar){
      var afgelopen = false;
      var q = app.indexedDB.deleteDatabase('events');
      var geblokkeerd = false;
      q.onblocked = function(){ geblokkeerd = true; };
      q.onsuccess = function(){ if(!afgelopen){ afgelopen = true; klaar(geblokkeerd ? 'eerst geblokkeerd' : 'meteen'); } };
      q.onerror = function(){ if(!afgelopen){ afgelopen = true; klaar('mislukt'); } };
      setTimeout(function(){ if(!afgelopen){ afgelopen = true; klaar(geblokkeerd ? 'blijft geblokkeerd' : 'geen antwoord'); } }, 2000);
    });
  }).then(function(uitkomst){
    eis('de database kan worden verwijderd zonder dat er nog een verbinding openstaat',
        uitkomst, 'meteen');
    /* en de app kan daarna gewoon weer verder: idb() maakt hem opnieuw aan */
    return app.idbPut('proefverbinding', 1).then(function(){ return app.idbGet('proefverbinding'); });
  }).then(function(w){
    eis('en daarna werkt de opslag weer', w, 1);
    return app.idbDel('proefverbinding').catch(function(){});
  });
}

/* Een bestand dat nog niet bestaat. Op dat pad sloeg de app het inlezen van de
   herstelbuffer over: de banner bleef zeggen "open dat bestand om ze terug te
   zetten" terwijl dat bestand al gekoppeld was, en een getypt event dat Android
   had afgebroken was alleen nog met de hand uit IndexedDB te halen. */
function testHerstelZonderBestand(){
  groep('De herstelbuffer zonder bestand');

  var bewaard = {
    dirHandle: app.dirHandle, hasFSA: app.hasFSA, bestandsnaam: app.bestandsnaam,
    cfg: app.cfg, fileState: app.fileState, records: app.records,
    idbGet: app.idbGet, idbPut: app.idbPut, idbDel: app.idbDel,
    laatstGelezen: app.laatstGelezen, laatstGrootte: app.laatstGrootte,
    herstelRij: app.herstelRij, herstelStand: app.herstelStand, saveState: app.saveState
  };
  function terug(){
    Object.keys(bewaard).forEach(function(k){ app[k] = bewaard[k]; });
    app.gelijkgezet(); app.render();
  }

  var opslag = {};
  app.idbGet = function(k){ return Promise.resolve(opslag[k]); };
  app.idbPut = function(k, v){ opslag[k] = v; return Promise.resolve(); };
  app.idbDel = function(k){ delete opslag[k]; return Promise.resolve(); };

  function opzetten(basis, bestand){
    var map = maakMap();
    if(bestand !== undefined) map.fs['events.txt'] = { tekst:bestand, mtime:5000 };
    app.dirHandle = map; app.hasFSA = true; app.bestandsnaam = 'events.txt';
    app.cfg = { bestand:'events.txt', scheidingsteken:';' };
    app.fileState = 'ok'; app.laatstGelezen = null; app.laatstGrootte = null;
    app.records = []; app.gelijkgezet();
    /* de buffer zoals hij er na een afgebroken sessie in staat */
    app.herstelRij = null; app.herstelStand = '';
    opslag['herstel'] = { bestand:'events.txt', tekst:'N;nieuw;Gebeurtenis;D20260101;1\n',
                          versie:1, basis:basis, tijd:Date.now() };
    return map;
  }

  /* 1. buffer van een bestand dat toen niet bestond, en nu nog steeds niet */
  opzetten({ naam:'events.txt', lastModified:null, grootte:null });
  return app.laden().then(function(){
    eis('zonder bestand wordt de buffer alsnog ingelezen', !!app.herstelRij, true);
    eis('en aangeboden om terug te zetten', app.herstelStand, 'terugzetten');
    eis('de lijst blijft tot die keuze leeg', app.records.length, 0);
    eis('en de banner zegt niet meer dat het bestand geopend moet worden',
        /Open dat bestand/.test(app.document.getElementById('filebar').textContent), false);

    /* 2. buffer van een bestand dat toen wel bestond: dan is er iets veranderd
          en mag er niets automatisch worden aangeboden om over te schrijven */
    opzetten({ naam:'events.txt', lastModified:4000, grootte:30 });
    return app.laden();
  }).then(function(){
    eis('een buffer van een bestand dat er toen wel was heet afwijkend',
        app.herstelStand, 'afwijkend');

    /* 3. en terugzetten kan dan nog steeds, maar op jouw woord */
    app.zetHerstelTerug();
    eis('terugzetten voegt de regel toe', app.records.length, 1);
    eis('en de buffer is daarmee afgehandeld', app.herstelStand, '');

    /* 4. staat het bestand er met precies die inhoud, dan is de buffer klaar */
    opzetten({ naam:'events.txt', lastModified:null, grootte:null },
             'N;nieuw;Gebeurtenis;D20260101;1\n');
    return app.laden();
  }).then(function(){
    eis('is de wijziging aangekomen, dan wordt de buffer opgeruimd', app.herstelRij, null);
    eis('en staat er niets meer in de opslag', opslag['herstel'], undefined);
    terug();
  }, function(e){
    terug();
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  });
}

/* De configuratie werd zonder enige controle overschreven. Wie de instellingen
   op de pc aanpaste en daarna in de app op Opslaan drukte, zag die aanpassing
   zonder melding verdwijnen -- terwijl het events-bestand al sinds lang tegen
   precies dat beschermd was. */
function testCfgBotsing(){
  groep('Wijzigingen van buiten in de configuratie');

  var bewaard = {
    dirHandle: app.dirHandle, hasFSA: app.hasFSA, cfg: app.cfg, fileState: app.fileState,
    idbGet: app.idbGet, idbPut: app.idbPut, idbDel: app.idbDel,
    cfgGelezen: app.cfgGelezen, cfgGrootte: app.cfgGrootte,
    cfgOverschreven: app.cfgOverschreven, cfgCRLF: app.cfgCRLF
  };
  function terug(){
    Object.keys(bewaard).forEach(function(k){ app[k] = bewaard[k]; });
    app.render();
  }

  var opslag = {};
  app.idbGet = function(k){ return Promise.resolve(opslag[k]); };
  app.idbPut = function(k, v){ opslag[k] = v; return Promise.resolve(); };
  app.idbDel = function(k){ delete opslag[k]; return Promise.resolve(); };

  var map;
  function opzetten(){
    map = maakMap();
    map.fs['events_cfg.json'] = { tekst:'{\n  "bestand": "events.txt"\n}\n', mtime:7000 };
    app.dirHandle = map; app.hasFSA = true; app.cfgCRLF = false;
    app.cfg = { bestand:'events.txt', titel:'Uit de app' };
    app.cfgGelezen = 7000; app.cfgGrootte = map.fs['events_cfg.json'].tekst.length;
    app.cfgOverschreven = false;
    opslag = {}; opslag['backup:events_cfg.json'] = app.dagsleutel();   /* al een backup vandaag */
  }
  function backups(){
    return map.gebeurd.filter(function(x){ return /_backup/.test(x); }).length;
  }

  /* 1. niets veranderd: gewoon schrijven, geen extra backup */
  opzetten();
  return app.schrijfCfg().then(function(){
    eis('een ongewijzigde configuratie wordt gewoon weggeschreven',
        /Uit de app/.test(map.fs['events_cfg.json'].tekst), true);
    eis('zonder extra backup, want die is er vandaag al', backups(), 0);
    eis('en er is niets te melden', app.cfgOverschreven, false);
    eis('de basis is bijgewerkt naar wat er nu staat',
        app.cfgGelezen, map.fs['events_cfg.json'].mtime);

    /* 2. nog een keer opslaan mag de eigen schrijfactie niet als wijziging van
          buiten zien -- anders zou er bij elke keer een backup bij komen */
    app.cfg.titel = 'Nog eens';
    return app.schrijfCfg();
  }).then(function(){
    eis('de eigen schrijfactie geldt niet als wijziging van buiten', app.cfgOverschreven, false);
    eis('dus komt er ook dan geen extra backup', backups(), 0);

    /* 3. buiten de app gewijzigd: wel schrijven -- anders kom je er zonder
          herladen niet meer uit -- maar die versie eerst apart wegzetten */
    opzetten();
    map.fs['events_cfg.json'] = { tekst:'{\n  "bestand": "events.txt",\n  "titel": "Van de pc"\n}\n',
                                  mtime:9000 };
    return app.schrijfCfg();
  }).then(function(){
    eis('een wijziging van buiten wordt gemeld', app.cfgOverschreven, true);
    eis('en eerst als backup weggezet, ook al is er vandaag al een', backups(), 1);
    eis('de backup bevat de versie van buiten',
        /Van de pc/.test(map.fs[Object.keys(map.fs).filter(function(n){ return /_backup/.test(n); })[0]].tekst),
        true);
    eis('en daarna staat de versie uit de app in het bestand',
        /Uit de app/.test(map.fs['events_cfg.json'].tekst), true);
    app.render();
    eis('de melding staat onder de header',
        /buiten de app gewijzigd/.test(app.document.getElementById('bad').textContent), true);

    /* 4. een onbevraagbare cfg geldt ook niet als ongewijzigd */
    opzetten();
    app.dirHandle = { getFileHandle: function(naam, opties){
      if(opties && opties.create) return map.getFileHandle(naam, opties);
      return Promise.reject(Object.assign(new Error('niet gelukt'), { name:'NotAllowedError' }));
    } };
    return app.cfgGewijzigd();
  }).then(function(stand){
    eis('een mislukte controle heet onbekend', stand, 'onbekend');
    opzetten();
    app.cfgGelezen = null;
    return app.cfgGewijzigd();
  }).then(function(stand){
    eis('nog nooit gelezen levert geen botsing', stand, 'gelijk');
    terug();
  }, function(e){
    terug();
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  });
}

/* Comfort op een kleine telefoon. Punten uit de koude review die alleen op een
   echt toestel opvallen, plus de namen die een schermlezer nodig heeft. Ze zijn
   klein, maar allemaal gemeten op een scherm van 360x640: de teller die zweeg
   over het periodefilter, de pil die het ongedaan maken weggooide, de naamkolom
   die 12 van 20 namen afkapte, en het cijferraster dat op een laag scherm de
   knoppen OK en Annuleren onbereikbaar maakte. */
function testComfort(){
  groep('Comfort op een kleine telefoon');

  var d = app.document;
  var namen = ['records','cfg','bestandsnaam','fileState','hasFSA','saveState',
               'selIndex','zoekterm','filterAan','datumFilter','terug'];

  app.cfg = { bestand:'e.txt', scheidingsteken:';' };
  app.bestandsnaam = 'e.txt'; app.fileState = 'ok'; app.saveState = '';
  app.zoekterm = ''; app.filterAan = false; app.datumFilter = '';
  app.records = app.parse('S1;Drimmelore Vasqinter;Gebeurtenis;D20261015;1\n' +
                          'S2;Bram;Gebeurtenis;D20260301;1');
  app.sorteer(); app.gelijkgezet(); app.selIndex = -1;
  app.terug = null;
  app.render();

    namen.forEach(function(n){ app[n] = bewaard[n]; });

  }

  /* 1. De teller noemt de periode die aanstaat. De periodechips staan in een
     strook van 1841 px in een venster van 328: van de 18 zijn er 3 te zien, dus
     stond "oktober" aan, dan zag je 1 van 2 events en nergens waarom. */

  eis('en nog steeds hoeveel er van hoeveel te zien zijn', tel.indexOf('1 / 2'), 0);

  eis('en zonder filter eindigt de teller weer op een getal',
      /[0-9]$/.test(d.getElementById('count').textContent), true);

  /* De teller staat pal naast de periodechips, dus daar hoort precies het woord
     te staan dat je hebt aangetikt. Bij 'jaar' stond er "het komende jaar": dat
     hoort in een zin, niet naast een getal. Hier wordt elke chip langsgelopen,

    var hoort = zicht + (zicht !== alle ? ' / ' + alle : '') +
                (waarde === '' ? '' : ' ' + c.textContent);
    if(t !== hoort) afwijkend.push(c.textContent + ': teller zegt "' + t + '", verwacht "' + hoort + '"');
  });
  eis('elke periode staat in de teller zoals op zijn chip',
      afwijkend.length ? afwijkend.join('; ') : 'alle gelijk', 'alle gelijk');
  app.datumFilter = ''; app.render();

  /* De strook met meldingen onder de header. Die had altijd 8 px padding boven

  eis('met iets te melden staat hij er wel', strook.hidden, false);

  eis('en daarna is hij weer weg', strook.hidden, true);

  /* 2. De laatste stap. Tot 1352897-001 een pil die je wegtikte, terwijl de knop

      !!(undo && ok) && ok.getBoundingClientRect().left > undo.getBoundingClientRect().right, true);
  eis('beide knoppen zijn 44 bij 44',

  /* een lange naam breekt niet af over twee regels */

  app.render();
  eis('ook met een lange naam blijft het één regel',
