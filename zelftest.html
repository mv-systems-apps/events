/* ------------------ derde review (1352898-027) ------------------ */
/* Elk punt was in 026 aan te tonen: configuratie opslaan zonder toegang vroeg nooit om
   toegang, een categorie "hoog" of "02" werd bij elke opslag "1" of "2", Bewaar als
   standaard tijdens het zoeken bewaarde niets, een verdwenen bestand werd stil opnieuw
   gemaakt met een regel, commentaar (--) gold als onbegrepen regel. */
function testDerdeReview(){
  groep('Derde review');
  var d = app.document;
  var namen = ['records','cfg','fileState','bestandsnaam','hasFSA','selIndex','dirHandle',
               'idbGet','idbPut','idbDel','terug','stapMelding','schrijfBezig','kopieRij',
               'sepOnafgemaakt','sepMist','cfgGelezen','cfgGrootte','filterType','datumFilter',
               'filterAan','zoekterm','vorigePeriode','filterCatVan','filterCatTot','filterNotitie',
               'laatstGelezen','laatstGrootte','toegangGeweigerd'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });
  function zetTerug(){
    while(app.bovensteModaal()) app.bergModaal(app.bovensteModaal());
    namen.forEach(function(n){ app[n] = bewaard[n]; });
    d.getElementById('zoek').value = '';
    app.render();
  }
  var idb = {};
  app.idbGet = function(k){ return Promise.resolve(idb[k]); };
  app.idbPut = function(k, v){ idb[k] = v; return Promise.resolve(); };
  app.idbDel = function(k){ delete idb[k]; return Promise.resolve(); };
  var map, gevraagd = 0;
  var CFG = '{\n  "bestand": "e.txt",\n  "scheidingsteken": ";"\n}\n';
  function opzetten(tekst, toestand){
    app.inleesMelding = ''; app.basisTekst = tekst;
    while(app.bovensteModaal()) app.bergModaal(app.bovensteModaal());
    map = maakMap();
    map.fs['e.txt'] = { tekst:tekst, mtime:1000 };
    map.fs['events_cfg.json'] = { tekst:CFG, mtime:500 };
    map.name = 'Events';
    gevraagd = 0;
    map.requestPermission = function(){ gevraagd++; return Promise.resolve('granted'); };
    map.queryPermission = function(){ return Promise.resolve(toestand === 'auth' ? 'prompt' : 'granted'); };
    idb = { 'backup:e.txt': app.dagsleutel(), 'backup:events_cfg.json': app.dagsleutel() };
    app.dirHandle = map; app.hasFSA = true;
    app.cfg = { bestand:'e.txt', scheidingsteken:';' };
    app.cfgGelezen = 500; app.cfgGrootte = CFG.length;
    app.fileState = toestand || 'ok'; app.bestandsnaam = 'e.txt'; app.selIndex = -1;
    app.schrijfBezig = false; app.terug = null; app.stapMelding = '';
    app.sepOnafgemaakt = ''; app.sepMist = ''; app.toegangGeweigerd = false;
    app.kopieRij = { bestand:'e.txt', tekst:tekst, tijd:Date.now() };
    app.laatstGelezen = toestand === 'auth' ? null : 1000; app.laatstGrootte = tekst.length;
    app.records = app.parse(tekst); app.sorteer(); app.render();
  }
  function inhoud(n){ n = n || 'e.txt'; return map.fs[n] ? map.fs[n].tekst : null; }
  function wacht(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function melding(id){ var m = d.getElementById(id || 'mMelding'); return m && !m.hidden ? m.textContent : '(geen)'; }
  function voegToe(sleutel){
    app.openModal();
    d.getElementById('fSleutel').value = sleutel;
    d.getElementById('fNaam').value = sleutel + ' nieuw';
    d.getElementById('mOk').click();
    return wacht(300);
  }

  /* 1. categorie zoals hij er stond */
  opzetten('X;Xander;Geboren;D20000101;hoog\nY;Yara;Geboren;D20000102;02\n');
  return voegToe('Z').then(function(){
    var t = inhoud();
    eis('een categorie "hoog" blijft "hoog" na een opslag', t.indexOf('X;Xander;Geboren;D20000101;hoog') >= 0, true);
    eis('en "02" blijft "02"', t.indexOf('Y;Yara;Geboren;D20000102;02') >= 0, true);

    /* 2. sinds 033 bestaat commentaar niet meer: een regel die met -- begint en
          geldige velden heeft, is gewoon een event (ook voor de macro) */
    opzetten('--oude regel;a;Geboren;D20000101;1\nA;Anna;Geboren;D19870412;1\n');
    eis('een --regel met geldige velden is een event (033)', app.records.filter(function(r){ return r.raw === undefined; }).length, 2);
    eis('en geen onbegrepen regel', d.getElementById('bad').hidden, true);
    return voegToe('B');
  }).then(function(){
    eis('na een opslag staat het commentaar er ongewijzigd', inhoud().indexOf('--oude regel;a;Geboren;D20000101;1') >= 0, true);

/* De opslag vastzetten. Zonder dat mag de browser bij ruimtegebrek zowel de
   offline-kopie als de mapverwijzing wissen, en dan is de app offline weg en
   moet de map opnieuw worden aangewezen. De keuzes worden nagerekend met een
   nagemaakte opslag; daarom neemt de functie er een als argument. */
function testVastgezetteOpslag(){
  groep('De vastgezette opslag');

  function nep(alVast, geef){
    return {
      gevraagd: 0,
      persisted: function(){ return Promise.resolve(alVast); },
      persist: function(){ this.gevraagd++; return Promise.resolve(geef); }
    };
  }

  /* Eerst kijken of het er staat. Zonder deze controle zou een app zonder de
     functie een uitzondering geven en daarmee de hele zelftest afbreken; dan
     zie je een halve uitslag in plaats van rode regels. */
  if(typeof app.zetOpslagVast !== 'function' || typeof app.ruimte !== 'function'){
    eis('de app kan de opslag vastzetten', typeof app.zetOpslagVast, 'function');
    eis('en kan een aantal bytes in woorden zetten', typeof app.ruimte, 'function');
    return Promise.resolve();
  }

  /* Eerst uitlezen wat de app bij het opstarten heeft opgehaald, want de
     controles hieronder zetten diezelfde variabele met een nagemaakte opslag
     opnieuw. */
  var bijStart = app.opslagVast;

  var a = nep(true, false);
  return app.zetOpslagVast(a).then(function(uit){
    eis('staat het al vast, dan is de uitkomst dat het vaststaat', uit, true);
    eis('en wordt er niet opnieuw gevraagd', a.gevraagd, 0);

    var b = nep(false, true);
    return app.zetOpslagVast(b).then(function(uit2){
      eis('staat het nog niet vast en wordt het toegekend, dan staat het vast', uit2, true);
      eis('en is er precies een keer gevraagd', b.gevraagd, 1);
    });
  }).then(function(){
    var c = nep(false, false);
    return app.zetOpslagVast(c).then(function(uit){
      eis('wordt het geweigerd, dan is de uitkomst dat het niet vaststaat', uit, false);
      eis('en is er ook dan een keer gevraagd', c.gevraagd, 1);
    });
  }).then(function(){
    /* een browser die halverwege afbreekt mag het opstarten niet raken */
    return app.zetOpslagVast({
      persisted: function(){ return Promise.reject(new Error('kapot')); },
      persist: function(){ return Promise.resolve(true); }
    }).then(function(uit){
      eis('breekt de navraag af, dan komt er geen uitzondering maar null', String(uit), 'null');
    });
  }).then(function(){
    return app.zetOpslagVast({}).then(function(uit){
      eis('kent de browser het niet, dan ook null', String(uit), 'null');
    });
  }).then(function(){
    eis('de app heeft de functie', typeof app.zetOpslagVast, 'function');
    /* bij het opstarten moet de app het echt hebben gevraagd: dan is opslagVast
       geen null meer. Kan de browser het niet, dan valt er niets te meten. */
    var kan = !!(app.navigator.storage && app.navigator.storage.persist);
    eis('en heeft het bij het opstarten gevraagd',
        kan ? (bijStart === true || bijStart === false) : 'niet van toepassing',
        kan ? true : 'niet van toepassing');
    eis('een nagemaakte opslag laat de toestand van de app ongemoeid',
        String(app.opslagVast), String(bijStart));

    eis('de ruimte in bytes', app.ruimte(512), '512 B');
    eis('de ruimte in kB', app.ruimte(2048), '2 kB');
    eis('de ruimte in MB', app.ruimte(1572864), '1,5 MB');
    eis('de ruimte in GB', app.ruimte(2147483648), '2,0 GB');
    eis('en onzin levert geen onzin op', app.ruimte(undefined), '?');
  }).then(function(){
    /* en het statusscherm moet het ook werkelijk tonen */
    app.vulAppStatus();
    /* niet op de klok wachten maar tot de regel er staat: statusOpslagVast
       vraagt het asynchroon na, en dat duurt op een traag toestel langer */
    return tot(function(){
      var el = app.document.getElementById('stVast');
      return !!(el && el.textContent && el.textContent.indexOf('bezig') < 0);
    }).then(function(){
      var el = app.document.getElementById('stVast');
      var tekst = el ? el.textContent : '(geen regel)';
      eis('het statusscherm toont een regel Vastgezet', /Vastgezet/.test(tekst), true);
      var o = app.navigator.storage;
      if(!o || !o.persisted){
        eis('en die zegt dat de browser het niet kent', /kent het niet/.test(tekst), true);
        return;
      }
      return o.persisted().then(function(al){
        /* staat het niet vast, dan hoort er te staan of het is gevraagd */
        if(!al) eis('en zegt of het is gevraagd of alleen niet vaststaat',
                    /gevraagd, niet toegekend|de vraag is niet gelukt|bij ruimtegebrek/.test(tekst), true);
        eis('en die klopt met wat de browser zegt',
            /\bja —/.test(tekst) === !!al, true);
      });
    });
  }).catch(function(e){
    /* een onverwachte uitzondering wordt een rode regel, geen afgebroken run */
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  });
}

/* Wat App-status zegt als er niets te bereiken is. Offline is dat geen gebrek
   van de app maar een omstandigheid, en dan hoort er geen rode regel te staan.
   De weging neemt de verbinding als argument, zodat dit na te rekenen is
   zonder de verbinding van de browser te hoeven verbreken. */
function testStatusNetwerk(){
  groep('App-status bij een slechte verbinding');

  if(typeof app.netwerkFout !== 'function'){
    eis('de app weegt een mislukte fetch tegen de verbinding',
        typeof app.netwerkFout, 'function');
    return Promise.resolve();
  }

  var fout = new TypeError('Failed to fetch');
  var uit = app.netwerkFout(fout, false);
  var aan = app.netwerkFout(fout, true);
  eis('offline geldt het niet als gebrek', uit.goed === false, false);
  eis('en staat er dat het niet is gecontroleerd', /niet gecontroleerd/.test(uit.tekst), true);
  eis('online geldt het wel als gebrek', aan.goed, false);
  eis('en staat de melding van de browser erbij', /Failed to fetch/.test(aan.tekst), true);
  eis('een fout zonder melding levert geen undefined op',
      /onbekende fout/.test(app.netwerkFout({}, true).tekst), true);

  /* en nu het scherm zelf, met een fetch die weigert */
  var echteFetch = app.fetch, echteWeeg = app.netwerkFout;
  function meet(online){
    app.fetch = function(){ return Promise.reject(fout); };
    app.netwerkFout = function(e){ return echteWeeg(e, online); };
    app.vulAppStatus();
    return tot(function(){
      var a = app.document.getElementById('stMan'), b = app.document.getElementById('stSw');
      return !!(a && b && a.textContent.indexOf('bezig') < 0 && b.textContent.indexOf('bezig') < 0);
    }).then(function(){
      var a = app.document.getElementById('stMan'), b = app.document.getElementById('stSw');
      return { tekst: a.textContent + ' ' + b.textContent,
               rood: a.querySelectorAll('.slecht').length + b.querySelectorAll('.slecht').length };
    });
  }

  return meet(false).then(function(r){
    eis('offline staat er geen rode regel over het manifest of de worker', r.rood, 0);
    eis('en staat er waarom niet', /niet gecontroleerd/.test(r.tekst), true);
    return meet(true);
  }).then(function(r){
    eis('online wel, want dan is er echt iets mis', r.rood > 0, true);
    eis('en met de melding erbij', /Failed to fetch/.test(r.tekst), true);
  }).then(function(){
    /* de echte fetch terug en kijken naar de twee regels in Omgeving */
    app.fetch = echteFetch;
    app.netwerkFout = echteWeeg;
    app.vulAppStatus();
    var body = app.document.getElementById('checkBody').textContent;
    eis('Omgeving noemt het protocol', /Protocol/.test(body), true);
    eis('en niet meer Verbinding, dat twee dingen betekende', /Verbinding/.test(body), false);
    eis('en zegt of er netwerk is', new RegExp('Netwerk\\s*(online|offline)').test(body.replace(/\s+/g, ' ')), true);
  }).then(function(){
    /* De regel "Versie in de offline-kopie" vulde zich nooit: hij werd gevuld
       voordat zijn eigen element bestond -- dat wordt pas gemaakt als de
       worker-regels binnen zijn -- en bleef dus op "bezig..." staan. Gemeten in
       Chromium: na 6 seconden nog steeds, terwijl er een versienummer in de
       cache stond. Hier met een nagemaakte cacheopslag, zodat het niet van de
       echte omgeving afhangt. */
    function nep(namen, tekst){
      return {
        keys: function(){ return Promise.resolve(namen); },
        open: function(){ return Promise.resolve({ match: function(){
          return Promise.resolve({ text: function(){ return Promise.resolve(tekst); } }); } }); }
      };
    }
    return tot(function(){
      var e0 = app.document.getElementById('stKopie');
      return e0 && e0.textContent.indexOf('bezig') < 0;
    }).then(function(){
      eis('de regel over de offline-kopie vult zich uit zichzelf',
          /Versie in de offline-kopie/.test(app.document.getElementById('stKopie').textContent),
          true);
      app.document.getElementById('stKopie').innerHTML = 'bezig\u2026';
      app.statusVersieKopie(nep(['events-v160', 'golf-v3'], 'Versie FFFFFFF-FFF'));
      return tot(function(){
        var e2 = app.document.getElementById('stKopie');
        return e2 && e2.textContent.indexOf('bezig') < 0;
      });
    }).then(function(){
      var t = app.document.getElementById('stKopie').textContent;
      eis('en hij vult zich met het stempel uit de kopie', /FFFFFFF-FFF/.test(t), true);
      eis('en meldt dat die nieuwer is dan deze pagina', /nieuwer dan deze pagina/.test(t), true);

      /* De volgorde moet dezelfde zijn als die van checkAppUpdate: op nummer,
         niet op tekst. Op tekst komt events-v99 na events-v160. Elke cache
         draagt hieronder zijn EIGEN stempel; met een opslag die voor elke naam
         dezelfde tekst teruggaf -- zoals hier eerst stond -- bewees deze
         controle niets, want dan kwam er bij beide sorteringen hetzelfde uit. */
      app.document.getElementById('stKopie').innerHTML = 'bezig\u2026';
      app.statusVersieKopie({
        keys: function(){ return Promise.resolve(['events-v99', 'events-v160']); },
        open: function(n){
          var stempel = n === 'events-v160' ? '1352896-ABC' : '1352896-999';
          return Promise.resolve({ match: function(){
            return Promise.resolve({ text: function(){
              return Promise.resolve('Versie ' + stempel); } }); } });
        }
      });
      return tot(function(){
        var e3 = app.document.getElementById('stKopie');
        return e3 && e3.textContent.indexOf('bezig') < 0;
      });
    }).then(function(){
      var t3 = app.document.getElementById('stKopie').textContent;
      eis('de hoogste cache wordt op nummer gekozen, niet op tekst',
          /1352896-ABC/.test(t3) ? 'het stempel uit events-v160' : t3,
          'het stempel uit events-v160');
    }, function(e){
      eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
    });
  }).catch(function(e){
    app.fetch = echteFetch;
    app.netwerkFout = echteWeeg;
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  });
}

/* Geen herstelbuffer meer. Events slaat met een werkmap elke wijziging meteen
   op; een aparte kopie van niet-opgeslagen werk in IndexedDB is daarmee overbodig.
   Een rij die een eerdere versie liet staan, moet bij het opstarten weg: anders
   blijft hij voorgoed in de opslag van de app staan. Deze groep laadt de app
   daarvoor opnieuw, en staat daarom vooraan. */
function testGeenHerstelbuffer(){
  groep('Geen herstelbuffer meer');
  var f = document.getElementById('app');
  function totWeg(max){
    var eind = Date.now() + (max || 3000);
    return new Promise(function(af){
      (function kijk(){
        app.idbGet('herstel').then(function(rij){
          if(rij === undefined || Date.now() > eind) return af(rij);
          setTimeout(kijk, 20);
        }, function(){ af('leesfout'); });
      })();
    });
  }
  return app.idbPut('herstel', { bestand:'proef.txt', tekst:'P;proef;Gebeurtenis;D20260101;\n',
                                 versie:1, basis:null, tijd:Date.now() })
  .then(function(){
    f.contentWindow.location.reload();
    /* laadApp kijkt of de functies er staan; vlak na reload staat het oude venster
       er nog, dus eerst even wachten tot het nieuwe document begint */
    return new Promise(function(af){ setTimeout(af, 300); });
  }).then(laadApp).then(function(){
    return totWeg();
  }).then(function(rij){
    eis('een achtergebleven herstelregel wordt bij het opstarten opgeruimd', rij, undefined);
    app.render();
    var tekst = app.document.getElementById('filebar').textContent;
    eis('en er staat geen melding over een niet-opgeslagen wijziging',
        tekst.indexOf('Niet-opgeslagen wijziging') >= 0, false);
    return app.idbDel('herstel').catch(function(){});
  });
}

/* Het tekenen van de lijst. Met een paar honderd records is dit het duurste
   dat de app per handeling doet, dus hier staat zowel wat het op dit toestel
   kost als de afspraak die dat laag houdt: een andere selectie tekent de lijst
   niet opnieuw. */
function testTekenen(){
  groep('Het tekenen van de lijst');

  var namen = ['records','cfg','bestandsnaam','fileState','hasFSA',
               'selIndex','zoekterm','filterAan','datumFilter'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });

  /* een lijst van dezelfde orde als een echt bestand */
  var regels = [];
  for(var i = 0; i < 240; i++){
    regels.push('S' + i + ';Naam ' + i + ';Gebeurtenis;D2026' +
                ('0' + (1 + (i % 12))).slice(-2) + ('0' + (1 + (i % 28))).slice(-2) + ';1');
  }
  app.cfg = { bestand:'e.txt', scheidingsteken:';' };
  app.bestandsnaam = 'e.txt'; app.fileState = 'ok';
  app.zoekterm = ''; app.filterAan = false; app.datumFilter = '';
  app.records = app.parse(regels.join('\n'));
  app.sorteer(); app.selIndex = -1;
  app.render();

  var lijst = app.document.getElementById('lijst');
  function tabel(){ return lijst.querySelector('table'); }
  function selRijen(){ return lijst.querySelectorAll('tr.sel'); }

  eis('de lijst staat er', !!tabel(), true);
  eis('met alle regels', lijst.querySelectorAll('tr[data-i]').length, app.records.length);

  /* een andere selectie mag de tabel niet opnieuw opbouwen */
  var voor = tabel();
  app.selIndex = 7; app.render();
  eis('een andere selectie tekent de lijst niet opnieuw', tabel() === voor, true);
  eis('en zet precies een rij op geselecteerd', selRijen().length, 1);
  eis('en wel de juiste', selRijen()[0].getAttribute('data-i'), '7');

  app.selIndex = 19; app.render();
  eis('bij de volgende selectie staat er weer precies een', selRijen().length, 1);
  eis('en is dat de nieuwe', selRijen()[0].getAttribute('data-i'), '19');

  app.selIndex = -1; app.render();
  eis('zonder selectie staat er geen geselecteerde rij', selRijen().length, 0);
  eis('en de tabel is nog steeds dezelfde', tabel() === voor, true);

  /* een echte wijziging moet wel opnieuw tekenen */
  app.records[0].naam = 'Heel iets anders';
  app.render();
  eis('een echte wijziging tekent de lijst wel opnieuw', tabel() === voor, false);
  eis('en de nieuwe naam staat erin', /Heel iets anders/.test(lijst.textContent), true);

  /* en een klik op een rij werkt nog, ook na een hertekening */
  var rij = lijst.querySelector('tr[data-i="12"]');
  if(rij) rij.dispatchEvent(new app.MouseEvent('click', { bubbles:true }));
  eis('een klik op een rij selecteert hem', app.selIndex, 12);
  if(rij) rij.dispatchEvent(new app.MouseEvent('click', { bubbles:true }));
  eis('en nog een klik laat hem weer los', app.selIndex, -1);

  /* wat het op dit toestel kost */
  function meet(f, n){
    var t = Date.now();
    for(var i = 0; i < n; i++) f();
    return (Date.now() - t) / n;
  }
  app.selIndex = -1; app.render();
  var k = 0, m = 0;
  var tikken = meet(function(){ app.selIndex = (k++ % 200); app.render(); }, 20);
  var wijzigen = meet(function(){ app.records[0].naam = 'n' + (m++); app.render(); }, 20);
  meld('een rij aantikken kost op dit toestel', tikken.toFixed(1) + ' ms');
  meld('een naam wijzigen kost', wijzigen.toFixed(1) + ' ms');
  meld('de lijst telt', app.records.length + ' regels');

  namen.forEach(function(n){ app[n] = bewaard[n]; });
  app.render();
}

/* Een record is altijd precies een regel, en de configuratie mag daar niet
   dwars tegenin gaan. JSON mag "Ge\nboren" bevatten, het events-bestand niet:
   elk record met dat type werd dan twee regels, waarvan de tweede bij het
   inlezen onbegrepen is. Gemeten voordat dit erin zat: 2 regels voor 1 record. */
function testEenRegel(){
  groep('Een record is altijd een regel');

  var bewaard = {
    cfg: app.cfg, records: app.records, cfgKlachten: app.cfgKlachten,
    fileState: app.fileState, bestandsnaam: app.bestandsnaam, selIndex: app.selIndex
  };
  function terug(){
    Object.keys(bewaard).forEach(function(k){ app[k] = bewaard[k]; });
    app.render();
  }

  try {
    /* 1. het inlezen van de configuratie slaat regelovergangen plat en zegt dat */
    var klachten = [];
    var uit = app.keurCfg({
      bestand: 'e.txt', titel: 'Twee\nregels', scheidingsteken: ';',
      velden: ['Event', 'Naam\nhier', 'Type', 'Datum', 'Categorie', 'Notitie'],
      types: [{ omschrijving: 'Ge\nboren' }, { omschrijving: 'Gebeurtenis' }],
      categorieen: [{ nr: 1, omschrijving: 'eerste\nregel' }]
    }, klachten);
    var zicht = function(t){ return JSON.stringify(t); };
    eis('de titel staat op een regel', zicht(uit.titel), '"Twee regels"');
    eis('een veldnaam ook', zicht(uit.velden[1]), '"Naam hier"');
    eis('een type ook', zicht(uit.types[0].omschrijving), '"Ge boren"');
    eis('een categorie-omschrijving ook', zicht(uit.categorieen[0].omschrijving), '"eerste regel"');
    eis('en een type zonder overgang blijft wat het was',
        zicht(uit.types[1].omschrijving), '"Gebeurtenis"');
    eis('en dat wordt gemeld, met het aantal',
        klachten.filter(function(k){ return /regelovergang of ander stuurteken/.test(k); }).length, 1);
    eis('vier waarden, dus vier in de melding',
        /4 waarden bevatten/.test(klachten.join(' ')), true);

    /* 2. een schone configuratie levert geen melding op */
    var schoonKlachten = [];
    app.keurCfg({ bestand: 'e.txt', titel: 'Eén regel', types: [{ omschrijving: 'Gebeurtenis' }] },
                schoonKlachten);
    eis('een schone configuratie levert daarover niets op',
        /over meer dan een regel/.test(schoonKlachten.join(' ')), false);

    /* 3. en wat er ondanks dat alles nog in zou staan, wordt bij het wegschrijven
          een spatie -- dat is de garantie, niet de hoop */
    app.cfg = { bestand: 'e.txt', scheidingsteken: ';' };
    app.records = [
      { sleutel: 'A', naam: 'aap\nbeer', type: 'Gebeurtenis', code: 'D20260101', cat: 1, notitie: '', id: 1 },
      { sleutel: 'B', naam: 'beer', type: 'Ge\nboren', code: 'D20260202', cat: 1, notitie: 'een\ntwee', id: 2 }
    ];
    var tekst = app.serialize();
    eis('twee records leveren twee regels op',
        tekst.replace(/\n$/, '').split('\n').length, 2);
    eis('en de overgangen zijn spaties geworden',
        /aap beer/.test(tekst) && /Ge boren/.test(tekst) && /een twee/.test(tekst), true);
    eis('er staat nergens nog een regelovergang in een veld',
        tekst.split('\n').filter(Boolean).every(function(r){ return r.split(';').length >= 5; }), true);
    /* en terugleesbaar: dat is waar het om gaat */
    var opnieuw = app.parse(tekst);
    eis('het teruglezen levert weer twee records', opnieuw.length, 2);
    eis('en geen enkele onbegrepen regel',
        opnieuw.filter(function(r){ return r.raw !== undefined; }).length, 0);

    /* 4. het rapport zegt nu wat de macro ook zegt over een categorieveld */
    app.cfg = { bestand: 'e.txt', scheidingsteken: ';',
                categorieen: [{ nr: 1 }, { nr: 2 }] };
    app.bestandsnaam = 'e.txt'; app.fileState = 'ok';
    app.records = app.parse('A;aap;Gebeurtenis;D20260101;1\n' +
                            'B;beer;Gebeurtenis;D20260202;\n' +
                            'C;cees;Gebeurtenis;D20260303;hoog\n');
    app.sorteer(); app.selIndex = -1;
    var bev = app.controleer();
    var kop = bev.filter(function(b){ return /Categorie niet te lezen/.test(b.titel); })[0];
    eis('het rapport heeft de kop over een onleesbare categorie', !!kop, true);
    eis('met beide regels erin', kop ? kop.regels.length : 0, 2);
    eis('en wat er stond', kop ? kop.regels.join(' | ') : '',
        'B — leeg | C — "hoog"');
    var geen = app.controleer().filter(function(b){ return /buiten de lijst/.test(b.titel); });
    eis('en die regels gelden niet ook als categorie buiten de lijst', geen.length, 0);
    eis('want ze staan op de eerste categorie',
        app.records.filter(function(x){ return x.catRuw !== undefined; })
                   .every(function(x){ return x.cat === 1; }), true);

    app.records = app.parse('A;aap;Gebeurtenis;D20260101;1\n');
    app.sorteer();    var zonder = app.controleer().filter(function(b){ return /Categorie niet te lezen/.test(b.titel); });
    eis('zonder zo’n regel staat die kop er niet', zonder.length, 0);
  } catch(e){
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  }
  terug();
  return Promise.resolve();
}

/* Het scheidingsteken wijzigen raakt twee bestanden, en dat kan halverwege
   stoppen. Gemeten met een map die events.txt weigerde: de cfg stond op "#",
   het bestand nog op ";", en bij de volgende start was 2 van 2 regels
   onbegrepen -- met alleen "opslaan mislukt" op het scherm. De app repareert
   hier niets; hij zegt wat er aan de hand is, op beide momenten. */
function testSepTweeBestanden(){
  groep('Het scheidingsteken over twee bestanden');

  var bewaard = {
    dirHandle: app.dirHandle, hasFSA: app.hasFSA, bestandsnaam: app.bestandsnaam,
    cfg: app.cfg, fileState: app.fileState, records: app.records,
    idbGet: app.idbGet, idbPut: app.idbPut, idbDel: app.idbDel,
    laatstGelezen: app.laatstGelezen, laatstGrootte: app.laatstGrootte,
    cfgGelezen: app.cfgGelezen, cfgGrootte: app.cfgGrootte, cfgCRLF: app.cfgCRLF,
    sepOnafgemaakt: app.sepOnafgemaakt,
    sepMist: app.sepMist, schrijfBezig: app.schrijfBezig
  };
  function terug(){
    Object.keys(bewaard).forEach(function(k){ app[k] = bewaard[k]; });
    app.render();
  }

  var opslag = {};
  app.idbGet = function(k){ return Promise.resolve(opslag[k]); };
  app.idbPut = function(k, v){ opslag[k] = v; return Promise.resolve(); };
  app.idbDel = function(k){ delete opslag[k]; return Promise.resolve(); };

  var EVENTS = 'A;aap;Gebeurtenis;D20260101;1\nB;beer;Gebeurtenis;D20260202;2\n';
  var map;
  function opzetten(weiger){
    app.kopieRij = null; app.inleesMelding = ''; app.basisTekst = EVENTS;
    map = maakMap({ weigerNaam: weiger });
    map.fs['events.txt'] = { tekst:EVENTS, mtime:1000 };
    map.fs['events_cfg.json'] = { tekst:'{\n  "bestand": "events.txt",\n  "scheidingsteken": ";"\n}\n',
                                  mtime:1000 };
    app.dirHandle = map; app.hasFSA = true; app.bestandsnaam = 'events.txt';
    app.cfg = { bestand:'events.txt', scheidingsteken:';', ofteken:'|' };
    app.fileState = 'ok'; app.schrijfBezig = false;
    app.laatstGelezen = 1000; app.laatstGrootte = EVENTS.length;
    app.cfgGelezen = 1000; app.cfgGrootte = map.fs['events_cfg.json'].tekst.length;
    app.cfgCRLF = false;
    app.sepOnafgemaakt = ''; app.sepMist = '';
    opslag = {};
    app.records = app.parse(EVENTS); app.sorteer(); app.render();
  }
  function rust(ms){ return new Promise(function(r){ setTimeout(r, ms || 250); }); }
  function melding(){ return app.document.getElementById('bad').textContent; }

  /* 1. de tweede schrijfactie mislukt */
  opzetten('events.txt');
  app.openCfg();
  return rust(60).then(function(){
    app.document.getElementById('cfgSep').value = '#';
    app.bewaarCfg();
    return rust();
  }).then(function(){
    eis('de configuratie staat op het nieuwe teken',
        JSON.parse(map.fs['events_cfg.json'].tekst).scheidingsteken, '#');
    eis('maar het events-bestand is niet herschreven',
        map.fs['events.txt'].tekst, EVENTS);
    eis('de app weet dat de twee niet gelijk staan', app.sepOnafgemaakt, ';');
    eis('en zegt dat onder de header, met beide tekens',
        /scheidingsteken staat in events_cfg\.json al op "#".*nog op ";"/.test(melding()), true);
    eis('de tabel blijft het bestand zoals het is', app.records.length, 2);

    /* 2. de configuratie nog eens opslaan, nu in een map die het wel aankan: dan
          wordt het events-bestand alsnog herschreven, gelezen met het oude teken */
    var oudeFs = map.fs;
    map = maakMap();
    map.fs['events.txt'] = oudeFs['events.txt'];
    map.fs['events_cfg.json'] = oudeFs['events_cfg.json'];
    app.dirHandle = map;
    app.cfgGelezen = map.fs['events_cfg.json'].mtime;
    app.cfgGrootte = map.fs['events_cfg.json'].tekst.length;
    app.openCfg();
    return rust(60).then(function(){ app.bewaarCfg(); return rust(); });
  }).then(function(){
    eis('dan wordt het bestand alsnog met het nieuwe teken geschreven',
        /^A#aap#/.test(map.fs['events.txt'].tekst), true);
    eis('en is de melding weg', app.sepOnafgemaakt, '');
    eis('ook werkelijk van het scherm', /scheidingsteken staat in/.test(melding()), false);
    eis('en de tabel is het herschreven bestand',
        app.records.filter(function(r){ return r.raw !== undefined; }).length, 0);

    /* 3. de volgende start met een cfg die niet bij het bestand past */
    opzetten();
    app.cfg.scheidingsteken = '#';
    return app.laden();
  }).then(function(){
    eis('alle regels zijn dan onbegrepen',
        app.records.filter(function(r){ return r.raw !== undefined; }).length, app.records.length);
    eis('en de app noemt het teken dat wel past', app.sepMist, ';');
    eis('met beide tekens in de melding',
        /past bij scheidingsteken "#"; met ";" passen ze allemaal/.test(melding()), true);

    /* 4. een bestand dat gewoon gelezen kan worden levert geen melding */
    opzetten();
    return app.laden();
  }).then(function(){
    eis('een leesbaar bestand levert geen suggestie', app.sepMist, '');
    eis('en geen melding', /passen ze allemaal/.test(melding()), false);

    /* 5. en er wordt niets beweerd als geen enkel teken past */
    eis('bij echte rommel blijft de app stil',
        app.zoekBeterSep('dit is geen regel\nen dit ook niet\n',
                         app.parse('dit is geen regel\nen dit ook niet\n')), '');
    eis('een leeg bestand ook', app.zoekBeterSep('', app.parse('')), '');
    eis('een tab wordt leesbaar opgeschreven', app.sepLabel('\t'), 'tab');
    terug();
  }, function(e){
    terug();
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  });
}

/* De verbinding met IndexedDB. idb() opent er een per aanroep en gaf hem nooit
   terug; bij elke wijziging kwam er een bij. Dat is niet alleen netheid: zolang
   er een verbinding openstaat blijft een verzoek om de database te verwijderen
   of van versie te wisselen hangen, en dat is precies waar deze controle naar
   kijkt -- deleteDatabase meldt 'blocked' zolang er nog iemand binnen is. */
function testVerbinding(){
  groep('De verbinding met de opslag');

  if(typeof app.idbPut !== 'function'){
    eis('de opslagfuncties staan er', 'nee', 'ja');
    return Promise.resolve();
  }
  /* eerst echt iets doen, zodat er een verbinding geopend is geweest */
  return app.idbPut('proefverbinding', { t: Date.now() }).then(function(){
    return app.idbGet('proefverbinding');
  }).then(function(waarde){
    eis('wat erin gaat komt er ook uit', !!waarde, true);
    return app.idbDel('proefverbinding');
  }).then(function(){
    /* Nu de database proberen te verwijderen. Lukt dat meteen, dan stond er geen
       verbinding meer open. Blijft hij hangen, dan wel -- en dan zou in een echte
       sessie ook een nieuwe versie van de app niet door de versiewissel komen. */
    return new Promise(function(klaar){
      var afgelopen = false;
      var q = app.indexedDB.deleteDatabase('events');
      var geblokkeerd = false;
      q.onblocked = function(){ geblokkeerd = true; };
      q.onsuccess = function(){ if(!afgelopen){ afgelopen = true; klaar(geblokkeerd ? 'eerst geblokkeerd' : 'meteen'); } };
      q.onerror = function(){ if(!afgelopen){ afgelopen = true; klaar('mislukt'); } };
      setTimeout(function(){ if(!afgelopen){ afgelopen = true; klaar(geblokkeerd ? 'blijft geblokkeerd' : 'geen antwoord'); } }, 2000);
    });
  }).then(function(uitkomst){
    eis('de database kan worden verwijderd zonder dat er nog een verbinding openstaat',
        uitkomst, 'meteen');
    /* en de app kan daarna gewoon weer verder: idb() maakt hem opnieuw aan */
    return app.idbPut('proefverbinding', 1).then(function(){ return app.idbGet('proefverbinding'); });
  }).then(function(w){
    eis('en daarna werkt de opslag weer', w, 1);
    return app.idbDel('proefverbinding').catch(function(){});
  });
}


/* De configuratie werd zonder enige controle overschreven. Wie de instellingen
   op de pc aanpaste en daarna in de app op Opslaan drukte, zag die aanpassing
   zonder melding verdwijnen -- terwijl het events-bestand al sinds lang tegen
   precies dat beschermd was. */
function testCfgBotsing(){
  groep('Wijzigingen van buiten in de configuratie');

  var bewaard = {
    dirHandle: app.dirHandle, hasFSA: app.hasFSA, cfg: app.cfg, fileState: app.fileState,
    idbGet: app.idbGet, idbPut: app.idbPut, idbDel: app.idbDel,
    cfgGelezen: app.cfgGelezen, cfgGrootte: app.cfgGrootte, cfgCRLF: app.cfgCRLF,
    bestandsnaam: app.bestandsnaam, records: app.records
  };
  function terug(){
    while(app.bovensteModaal()) app.bergModaal(app.bovensteModaal());
    Object.keys(bewaard).forEach(function(k){ app[k] = bewaard[k]; });
    app.render();
  }

  var opslag = {};
  app.idbGet = function(k){ return Promise.resolve(opslag[k]); };
  app.idbPut = function(k, v){ opslag[k] = v; return Promise.resolve(); };
  app.idbDel = function(k){ delete opslag[k]; return Promise.resolve(); };

  var map;
  function opzetten(){
    app.kopieRij = null;
    map = maakMap();
    map.fs['events_cfg.json'] = { tekst:'{\n  "bestand": "events.txt"\n}\n', mtime:7000 };
    app.dirHandle = map; app.hasFSA = true; app.cfgCRLF = false;
    app.cfg = { bestand:'events.txt', titel:'Uit de app' };
    app.cfgGelezen = 7000; app.cfgGrootte = map.fs['events_cfg.json'].tekst.length;
    opslag = {}; opslag['backup:events_cfg.json'] = app.dagsleutel();   /* al een backup vandaag */
  }
  function backups(){
    return map.gebeurd.filter(function(x){ return /_backup/.test(x); }).length;
  }
  function wacht(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  /* 1. niets veranderd: gewoon schrijven, geen extra backup */
  opzetten();
  return app.schrijfCfg().then(function(){
    eis('een ongewijzigde configuratie wordt gewoon weggeschreven',
        /Uit de app/.test(map.fs['events_cfg.json'].tekst), true);
    eis('zonder extra backup, want die is er vandaag al', backups(), 0);
    eis('de basis is bijgewerkt naar wat er nu staat',
        app.cfgGelezen, map.fs['events_cfg.json'].mtime);

    /* 2. nog een keer opslaan mag de eigen schrijfactie niet als wijziging van
          buiten zien -- anders zou er bij elke keer een backup bij komen */
    app.cfg.titel = 'Nog eens';
    return app.schrijfCfg().then(function(){ return 'geschreven'; }, function(e){ return e; });
  }).then(function(uit){
    eis('de eigen schrijfactie geldt niet als wijziging van buiten', uit, 'geschreven');
    eis('dus komt er ook dan geen extra backup', backups(), 0);

    /* 3. buiten de app gewijzigd: niet schrijven. Het configuratievenster blijft
          open met de melding, en de bevestigknop wordt Toch opslaan. */
    opzetten();
    map.fs['events_cfg.json'] = { tekst:'{\n  "bestand": "events.txt",\n  "titel": "Van de pc"\n}\n',
                                  mtime:9000 };
    return app.schrijfCfg().then(function(){ return 'geschreven'; }, function(e){ return e; });
  }).then(function(uit){
    eis('een wijziging van buiten: niets geschreven', uit === app.CFGBOTSING && /Van de pc/.test(map.fs['events_cfg.json'].tekst), true);
    eis('en de configuratie in de app is niet veranderd', app.cfg.titel, 'Uit de app');
    opzetten();
    map.fs['events_cfg.json'] = { tekst:'{\n  "bestand": "events.txt",\n  "titel": "Van de pc"\n}\n',
                                  mtime:9000 };
    app.fileState = 'ok'; app.bestandsnaam = 'events.txt';

/* Comfort op een kleine telefoon. Punten uit de koude review die alleen op een
   echt toestel opvallen, plus de namen die een schermlezer nodig heeft. Ze zijn
   klein, maar allemaal gemeten op een scherm van 360x640: de teller die zweeg
   over het periodefilter, de pil die het ongedaan maken weggooide, de naamkolom
   die 12 van 20 namen afkapte, en het cijferraster dat op een laag scherm de
   knoppen OK en Annuleren onbereikbaar maakte. */
function testComfort(){
  groep('Comfort op een kleine telefoon');

  var d = app.document;
  var namen = ['records','cfg','bestandsnaam','fileState','hasFSA',
               'selIndex','zoekterm','filterAan','datumFilter','terug'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });

  app.cfg = { bestand:'e.txt', scheidingsteken:';' };
  app.bestandsnaam = 'e.txt'; app.fileState = 'ok';
  app.zoekterm = ''; app.filterAan = false; app.datumFilter = '';
  app.records = app.parse('S1;Drimmelore Vasqinter;Gebeurtenis;D20261015;1\n' +
                          'S2;Bram;Gebeurtenis;D20260301;1');
  app.sorteer(); app.selIndex = -1;
  app.terug = null;
  app.render();

  function herstel(){
    namen.forEach(function(n){ app[n] = bewaard[n]; });

  /* 1. De teller noemt de periode die aanstaat. De periodechips staan in een
     strook van 1841 px in een venster van 328: van de 18 zijn er 3 te zien, dus
     stond "oktober" aan, dan zag je 1 van 2 events en nergens waarom. */

      d.getElementById('count').textContent, '2');
  app.datumFilter = '10'; app.render();

  eis('en nog steeds hoeveel er van hoeveel te zien zijn', tel.indexOf('1 / 2'), 0);

  eis('en zonder filter eindigt de teller weer op een getal',
      /[0-9]$/.test(d.getElementById('count').textContent), true);

  /* De teller staat pal naast de periodechips, dus daar hoort precies het woord
     te staan dat je hebt aangetikt. Bij 'jaar' stond er "het komende jaar": dat
     hoort in een zin, niet naast een getal. Hier wordt elke chip langsgelopen,

    var hoort = zicht + (zicht !== alle ? ' / ' + alle : '') +
                (waarde === '' ? '' : ' ' + c.textContent);
    if(t !== hoort) afwijkend.push(c.textContent + ': teller zegt "' + t + '", verwacht "' + hoort + '"');
  });
  eis('elke periode staat in de teller zoals op zijn chip',
      afwijkend.length ? afwijkend.join('; ') : 'alle gelijk', 'alle gelijk');
  app.datumFilter = ''; app.render();

  /* De strook met meldingen onder de header. Die had altijd 8 px padding boven

  eis('en daarna is hij weer weg', strook.hidden, true);

  /* 2. De laatste stap. Tot 1352897-001 een pil die je wegtikte, terwijl de knop

  eis('beide knoppen zijn 44 bij 44',

      balk ? Math.round(balk.getBoundingClientRect().height) <= 56 : false, true);
  /* een lange naam breekt niet af: de balk wordt niet hoger */
  app.onthoud('Drimmelore Vasqinter van der Langenaamsteeg-Overbeek', 'gewijzigd', app.records[0].id, null);
  app.render();
  eis('ook met een lange naam wordt de balk niet hoger',
      balk ? Math.round(balk.getBoundingClientRect().height) <= 56 : false, true);
  /* en dan valt het eind van de naam weg, nooit de actie: die staat op een eigen regel */

  eis('en is volledig te lezen', !!actieEl && actieEl.scrollWidth <= actieEl.clientWidth + 1 &&
      actieEl.textContent.trim() === 'gewijzigd', true);
  eis('alleen de naam wordt afgekapt', !!naamEl && naamEl.scrollWidth > naamEl.clientWidth, true);
  eis('voorgelezen als naam en actie', d.getElementById('stapTekst').textContent,
      'Drimmelore Vasqinter van der Langenaamsteeg-Overbeek gewijzigd');
  /* de tekst wegtikken doet niets: bevestigen gaat alleen met het vinkje */
  if(balk) d.getElementById('stapTekst').click();
  eis('op de tekst tikken laat de balk staan', !!balk && !balk.hidden && !!app.terug, true);
  /* na ongedaan maken biedt de knop opnieuw aan; de balk blijft */
  app.terug.herstel = true; app.render();
  eis('na ongedaan maken zegt de balk wat er gebeurde',
      balk ? d.getElementById('stapTekst').textContent : '', 'Drimmelore Vasqinter van der Langenaamsteeg-Overbeek hersteld');
  eis('en biedt de knop opnieuw aan', undo ? /^Opnieuw/.test(undo.title) : false, true);
  if(ok) ok.click();
  eis('bevestigen laat de balk verdwijnen', !!balk && balk.hidden, true);
  eis('en vergeet de stap', app.terug, null);
  app.onthoud('Bram', 'verwijderd', app.records[1].id, null);
  app.render();
  eis('een volgende stap zet de balk weer neer', !!balk && !balk.hidden, true);
  app.terug = null; app.render();

  /* 3. De naamkolom houdt 169 px over op een scherm van 360. */
  var naamCel = d.querySelector('#lijst tr[data-i] td.naam');
  eis('de naam staat in zijn eigen cel', !!naamCel, true);
  eis('en is kleiner gezet dan de rest van de regel',
      naamCel ? app.getComputedStyle(naamCel).fontSize : '(geen cel)', '17px');
  var dagCel = d.querySelector('#lijst tr[data-i] td.dag');
  eis('de andere kolommen houden hun grootte',
      dagCel ? app.getComputedStyle(dagCel).fontSize : '(geen cel)', '20px');

  /* 4. Elk venster en elk label heeft een naam. */
  var vensters = d.querySelectorAll('[role="dialog"]');
  var metNaam = 0;
  Array.prototype.forEach.call(vensters, function(v){
    var id = v.getAttribute('aria-labelledby');
    var kop = id ? d.getElementById(id) : null;
    if(kop && kop.textContent.trim()) metNaam++;
  });
  eis('alle vensters hebben een naam die ook echt bestaat',
      metNaam + ' van ' + vensters.length, vensters.length + ' van ' + vensters.length);

  var labels = d.querySelectorAll('label');
  var losse = [];
  Array.prototype.forEach.call(labels, function(l){
    var voor = l.getAttribute('for');
    if(voor){
      var doel = d.getElementById(voor);
      /* een <label for=...> werkt alleen op een invoerveld, niet op een knop */
      if(!doel || ['INPUT','TEXTAREA','SELECT'].indexOf(doel.tagName) < 0){
        losse.push(l.textContent.trim() + ' -> ' + voor);
      }
      return;
    }
    /* zonder for moet er iets naar dit label wijzen */
    if(!l.id || !d.querySelector('[aria-labelledby~="' + l.id + '"]')){
      losse.push(l.textContent.trim() + ' (wijst nergens heen)');
    }
  });
  eis('en elk label benoemt werkelijk een besturing',
      losse.length ? losse.join('; ') : 'geen losse labels', 'geen losse labels');

  /* 5. Eén schuifvlak op een laag scherm: liggend, of met het toetsenbord open.

  eis('op een hoog scherm schuift het raster zelf',

  raam.style.height = '500px';
  return nieuwBeeld().then(function(){

    eis('en dan schuift het raster niet meer zelf',

    eis('en wordt het ook niet meer afgekapt',

  }).then(function(){

    /* Een <label> in gegenereerde opmaak valt buiten de controle hierboven als

  });

/* twee beeldopbouwen afwachten, zodat een nieuwe vensterhoogte ook werkelijk in
   de opmaak is doorgerekend voordat er gemeten wordt */
function nieuwBeeld(){
  return new Promise(function(klaar){
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ klaar(); }); });
  });
}

/* De versiecontrole van de app. Het versienummer staat op twee plaatsen --
   sw-events.js en events.html -- en update_cache_version.py houdt ze gelijk.
   De app vergelijkt zijn eigen nummer met dat in de offline-kopie; staat daar
   een hoger nummer, dan is er een nieuwe versie binnengehaald. */
function testVersiecontrole(){
  groep('De versiecontrole van de app');

  if(typeof app.checkAppUpdate !== 'function' || typeof app.vraagSwUpdate !== 'function' ||
     typeof app.magHerladenEenmaal !== 'function'){
    eis('de app kijkt of de offline-kopie nieuwer is', typeof app.checkAppUpdate, 'function');
    eis('en vraagt de browser om naar de worker te kijken', typeof app.vraagSwUpdate, 'function');
    eis('en herlaadt hoogstens een keer', typeof app.magHerladenEenmaal, 'function');
    return Promise.resolve();
  }

  /* een nagemaakte cacheopslag, zodat de echte niet wordt aangeraakt */
  function nepCache(naam, tekst){
    var vak = {
      match: function(){ return Promise.resolve(tekst === null ? undefined : { text: function(){ return Promise.resolve(tekst); } }); }
    };
    return {
      keys: function(){ return Promise.resolve(naam ? [naam, 'trends-v17', 'golf-score-v41'] : ['trends-v17']); },
      open: function(n){ return Promise.resolve(n === naam ? vak : { match: function(){ return Promise.resolve(undefined); } }); }
    };
  }
  function app_(n){ return 'Versie ' + n + '\n/* verder niets */'; }
  /* Het stempel van de app zelf, met het volgnummer een stap op of neer, en de
     dag een stap op of neer. Zo wordt hier met het ECHTE stempel van deze app
     gerekend in plaats van met een verzonnen getal: loopt het stempel in het
     scherm niet meer in de pas met wat de app leest, dan valt dat hier om. */
  function stap(stempel, n){
    var d = stempel.split('-');
    return d[0] + '-' + ('00' + (parseInt(d[1], 16) + n).toString(16).toUpperCase()).slice(-3);
  }
  function dag(stempel, n){
    return (parseInt(stempel.split('-')[0], 16) + n).toString(16).toUpperCase() +
           '-' + stempel.split('-')[1];
  }
  var KOPIE = 'events-v160';

  var eigen = app.appStempel();
  var bewaard = app.nieuweInhoud;
  function schoon(){ app.nieuweInhoud = bewaard; }

  /* De vergelijking loopt via tekst, dus de vorm is geen opmaakdetail maar de
     drager van de volgorde. Bij een afwijking hoort het gekregen stempel in de
     melding te staan; vandaar deze replace in plaats van een kale test(). */
  eis('de app leest zijn eigen stempel uit het scherm',
      eigen.replace(/^[0-9A-F]{7}-[0-9A-F]{3}$/, 'de voorgeschreven vorm'),
      'de voorgeschreven vorm');

  app.nieuweInhoud = false;
  return app.checkAppUpdate(nepCache(KOPIE, app_(stap(eigen, 1)))).then(function(uit){
    eis('een hoger stempel in de kopie is een nieuwe versie', uit, true);
    eis('en de app meldt dat', app.nieuweInhoud, true);
    app.nieuweInhoud = false;
    return app.checkAppUpdate(nepCache(KOPIE, app_(eigen)));
  }).then(function(uit){
    eis('hetzelfde stempel is geen nieuwe versie', uit, false);
    return app.checkAppUpdate(nepCache(KOPIE, app_(stap(eigen, -1))));
  }).then(function(uit){
    eis('een lager volgnummer ook niet', uit, false);
    /* De dag weegt zwaarder dan het volgnummer. Zonder vaste lengtes zou dit
       omvallen, en dat is precies waar de vorm van het stempel voor is. */
    return app.checkAppUpdate(nepCache(KOPIE, app_(dag(stap(eigen, 1), -1))));
  }).then(function(uit){
    eis('een hoger volgnummer van een eerdere dag is ouder', uit, false);
    return app.checkAppUpdate(nepCache(KOPIE, app_(dag(stap(eigen, -1), 1))));
  }).then(function(uit){
    eis('en een lager volgnummer van een latere dag is nieuwer', uit, true);
    app.nieuweInhoud = false;
    /* Een kopie van voor de overstap: wel een APP_VERSIE, geen stempel. Die
       geldt als ouder, anders meldt de app bij iedereen die nog zo'n kopie
       heeft staan een "nieuwe" versie die juist de oude is. */
    return app.checkAppUpdate(nepCache(KOPIE, 'var APP_VERSIE = 999;'));
  }).then(function(uit){
    eis('een kopie van voor de overstap levert geen nieuwe versie', uit, false);
    return app.checkAppUpdate(nepCache(KOPIE, 'geen stempel hierin'));
  }).then(function(uit){
    eis('een kopie zonder stempel levert geen nieuwe versie', uit, false);
    return app.checkAppUpdate(nepCache(KOPIE, null));
  }).then(function(uit){
    eis('een cache zonder events.html ook niet', uit, false);
    return app.checkAppUpdate(nepCache(null, null));
  }).then(function(uit){
    eis('en zonder eigen cache evenmin', uit, false);
    eis('de app is er niet door omgevallen', app.nieuweInhoud, false);
    return app.checkAppUpdate({ keys: function(){ return Promise.reject(new Error('stuk')); } });
  }).then(function(uit){
    eis('een stukke cacheopslag levert geen uitzondering', uit, false);

    /* de caches van de buren worden niet gelezen */
    var gevraagd = [];
    var spion = {
      keys: function(){ return Promise.resolve(['trends-v17', 'golf-score-v41', KOPIE]); },
      open: function(n){ gevraagd.push(n);
        return Promise.resolve({ match: function(){ return Promise.resolve({ text: function(){ return Promise.resolve(app_(eigen)); } }); } }); }
    };
    return app.checkAppUpdate(spion).then(function(){
      eis('alleen de eigen cache wordt geopend', gevraagd.join(), KOPIE);
    });
  }).then(function(){
    /* Twee eigen caches naast elkaar. De cachenaam gaat alleen omhoog als
       sw-events.js wijzigt, dus het nieuwste stempel staat niet per se in de
       hoogst genummerde cache -- en een afgebroken installatie laat een lege
       huls met een hoger nummer achter. Daarop verviel de melding eerder. */
    function nepCaches(kaarten){
      var namen = Object.keys(kaarten).concat(['trends-v17', 'golf-score-v41']);
      return {
        keys: function(){ return Promise.resolve(namen); },
        open: function(n){
          var v = kaarten[n];
          if(v === 'stuk') return Promise.reject(new Error('cache niet te openen'));
          return Promise.resolve({ match: function(){
            return Promise.resolve(v === null || v === undefined ? undefined
              : { text: function(){ return Promise.resolve(v); } }); } });
        }
      };
    }
    var nieuwer = app_(stap(eigen, 1)), ouder = app_(stap(eigen, -1));
    app.nieuweInhoud = false;
    return app.checkAppUpdate(nepCaches({ 'events-v160': ouder, 'events-v99': nieuwer }))
    .then(function(uit){
      eis('tussen twee eigen caches wint het nieuwste stempel, niet de hoogste naam',
          uit, true);
      app.nieuweInhoud = false;
      return app.checkAppUpdate(nepCaches({ 'events-v161': null, 'events-v160': nieuwer }));
    }).then(function(uit){
      eis('een lege huls met een hoger nummer laat de melding niet vervallen', uit, true);
      app.nieuweInhoud = false;
      return app.checkAppUpdate(nepCaches({ 'events-v161': 'stuk', 'events-v160': nieuwer }));
    }).then(function(uit){
      eis('een stukke cache telt niet mee, de rest wel', uit, true);
      app.nieuweInhoud = false;
      /* Nu met het nieuwste stempel VOORAAN: anders komt het hierboven
         toevallig als laatste langs, en zou 'de laatste die ik tegenkom' het
         ook goed doen. */
      return app.checkAppUpdate(nepCaches({ 'events-v99': nieuwer, 'events-v160': ouder }));
    }).then(function(uit){
      eis('ook als het nieuwste stempel vooraan staat wint het', uit, true);
      app.nieuweInhoud = false;
      return app.checkAppUpdate(nepCaches({ 'events-v160': ouder, 'events-v99': ouder }));
    }).then(function(uit){
      eis('twee oude kopieen leveren geen melding', uit, false);
      app.nieuweInhoud = false;
    });
  }).then(function(){
    /* Het afknijpen van registration.update(). De app heeft een echte
       registratie, en die is de terugval als er geen wordt meegegeven; daarom
       wordt hier een registratie zonder update meegegeven in plaats van null. */
    var aangeroepen = 0;
    var reg = { update: function(){ aangeroepen++; return Promise.resolve(); } };
    app.swUpdateLaatst = 0;
    eis('zonder bruikbare registratie geen aanroep', app.vraagSwUpdate({}), false);
    eis('eerste aanroep gaat door', app.vraagSwUpdate(reg), true);
    eis('en roept update aan', aangeroepen, 1);
    eis('tweede aanroep er meteen achteraan niet', app.vraagSwUpdate(reg), false);
    eis('en roept dus niet opnieuw aan', aangeroepen, 1);
    app.swUpdateLaatst = Date.now() - app.SW_UPDATE_INTERVAL - 1;
    eis('na het interval mag het weer', app.vraagSwUpdate(reg), true);
    app.swUpdateLaatst = 0;
    eis('een mislukte update werpt niet',
        app.vraagSwUpdate({ update: function(){ return Promise.reject(new Error('offline')); } }), true);

    /* Herladen gebeurt precies een keer. location is in een venster niet te
       vervangen, en herlaadEenmaal() werkelijk aanroepen zou het testvenster
       herladen. Daarom is de beslissing apart gezet en wordt die getoetst. */
    app.overstapGevraagd = true;
    eis('de eerste keer mag er worden herladen', app.magHerladenEenmaal(), true);
    eis('de tweede keer niet meer', app.magHerladenEenmaal(), false);
    eis('en daarna ook niet', app.magHerladenEenmaal(), false);
    app.overstapGevraagd = false;
    eis('zonder verzoek om over te stappen nooit', app.magHerladenEenmaal(), false);

    /* De melding over een nieuwe versie gaat over de app, niet over het bestand.
       Hij stond alleen in de gewone toestand, en op een telefoon begint elke
       sessie zonder werkmap -- dus zag je hem pas nadat je het bestand had
       gekozen. */
    var bewaardState = app.fileState, bewaardInhoud = app.nieuweInhoud,
        bewaardNaam = app.bestandsnaam, bewaardKopie = app.kopieRij;
    var balk = function(){ return app.document.getElementById('filebar').textContent; };
    var knop = function(){ return !!app.document.getElementById('fNieuw'); };
    app.nieuweInhoud = true;
    app.kopieRij = { bestand:'e.txt', tekst:'', tijd:Date.now() };

    [['leeg', true], ['kopie', true], ['ok', true],
     /* sinds 1352898-002 staat er zonder toegang geen eigen melding meer (de
        leeskopie is gewoon in te zien), dus hoort deze er daar ook bij */
     ['auth', true], ['geencfg', false]].forEach(function(paar){
      app.fileState = paar[0];
      app.bestandsnaam = 'e.txt';
      app.render();
      eis('toestand ' + paar[0] + ': melding over een nieuwe versie',
          /nieuwe versie van Events/.test(balk()), paar[1]);
      if(paar[1]) eis('en de knop Herladen doet het daar', knop(), true);
    });

    app.nieuweInhoud = false;
    app.fileState = 'leeg'; app.render();
    eis('zonder nieuwe versie staat die melding er nergens',
        /nieuwe versie van Events/.test(balk()), false);

    app.fileState = bewaardState; app.nieuweInhoud = bewaardInhoud;
    app.bestandsnaam = bewaardNaam; app.kopieRij = bewaardKopie; app.render();
    schoon();
  }).catch(function(e){
    schoon();
    eis('de groep liep door', 'uitzondering: ' + e.message, 'ja');
  });
}

/* De zelftest mag niets achterlaten in de opslag die de app zelf gebruikt. */
/* De lokale leeskopie: de laatst ingelezen inhoud, zodat de app offline iets te
   tonen heeft voordat het bestand gekoppeld is. Het gevaar zit niet in het
   bewaren maar in het terugschrijven, dus de controles hieronder draaien vooral
   om de vraag of er een pad bestaat waarlangs die kopie het bestand kan
   overschrijven. */
function testLeeskopie(){
  groep('De lokale leeskopie');
  if(typeof app.bewaarKopie !== 'function' || typeof app.leesKopie !== 'function' ||
     typeof app.vulUitKopie !== 'function' || typeof app.magWijzigen !== 'function'){
    eis('de app bewaart een leeskopie', typeof app.bewaarKopie, 'function');
    eis('en leest hem bij het opstarten', typeof app.leesKopie, 'function');
    eis('en kan hem lezen zonder de toestand te wijzigen', typeof app.vulUitKopie, 'function');
    eis('en weet wanneer wijzigen mag', typeof app.magWijzigen, 'function');
    return Promise.resolve();
  }

  var namen = ['records','bestandsnaam','fileState','kopieRij','selIndex',
               'terug','idbPut'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });
  function zetTerug(){ namen.forEach(function(n){ app[n] = bewaard[n]; }); }

  var INHOUD = '15;Proefpersoon;verjaardag;;1\n';
  return app.idbDel('kopie').catch(function(){}).then(function(){
    return app.bewaarKopie('proef.txt', INHOUD, { mtime: 1000, grootte: INHOUD.length });
  }).then(function(){
    return app.idbGet('kopie');
  }).then(function(rij){
    eis('inlezen legt een kopie vast', !!rij, true);
    eis('met de stempel van het gekozen bestand', rij && rij.mtime, 1000);
    eis('met de naam van het bestand', rij && rij.bestand, 'proef.txt');
    eis('en met de inhoud', rij && rij.tekst, INHOUD);

    /* opstarten zonder gekoppeld bestand -- op Android is dat elke sessie */
    app.records = []; app.bestandsnaam = ''; app.fileState = 'leeg'; app.kopieRij = null;
    return app.leesKopie();
  }).then(function(gelukt){
    eis('zonder gekoppeld bestand wordt de kopie gebruikt', gelukt, true);
    eis('en de lijst is gevuld', app.records.length, 1);
    eis('de toestand zegt dat het een kopie is', app.fileState, 'kopie');
    eis('wijzigen mag niet', app.magWijzigen(), false);
    eis('de balk toont alleen het moment van de kopie',
        /^vandaag \d\d:\d\d$/.test(app.kopieTekst()), true);
    eis('en wijzigen staat uit', app.magBewerken(), false);

    /* een werkelijk gekoppeld bestand gaat altijd voor op de kopie */
    app.fileState = 'ok';
    return app.leesKopie();
  }).then(function(gelukt){
    eis('met een gekoppeld bestand wordt de kopie niet gebruikt', gelukt, false);
    eis('en de toestand blijft ongemoeid', app.fileState, 'ok');
    eis('en wijzigen mag dan wel', app.magWijzigen(), true);

    /* geen toegang tot de map: de melding daarover vraagt om actie en mag niet
       worden overschreven, maar de events zijn ondertussen wel in te zien */
    app.records = []; app.fileState = 'auth';
    return app.vulUitKopie();
  }).then(function(gelukt){
    eis('zonder toegang wordt de lijst toch gevuld', gelukt, true);
    eis('en staat er iets in', app.records.length, 1);
    eis('maar blijft de melding over de toegang staan', app.fileState, 'auth');
    eis('en wijzigen mag niet', app.magWijzigen(), false);

    /* een weigerende opslag mag het bewerken niet in de weg zitten */
    app.idbPut = function(){ return Promise.reject(new Error('QuotaExceededError')); };
    return app.bewaarKopie('proef.txt', INHOUD).then(
      function(){ return 'geen uitzondering'; },
      function(){ return 'gooide'; }
    );
  }).then(function(uit){
    app.idbPut = bewaard.idbPut;
    eis('een weigerende opslag levert geen uitzondering', uit, 'geen uitzondering');

    /* en zonder kopie gedraagt het opstarten zich als voorheen */
    app.fileState = 'leeg'; app.records = []; app.kopieRij = null;
    return app.idbDel('kopie').catch(function(){}).then(function(){
      return app.leesKopie();
    });
  }).then(function(gelukt){
    eis('zonder kopie verandert er niets aan het opstarten', gelukt, false);
    eis('en blijft de toestand leeg', app.fileState, 'leeg');

    /* een oude kopie zonder stempel (van voor 1352898-003) kan achterlopen: die
       telt ook zonder werkmap niet, net als in Trends */
    app.records = []; app.kopieRij = null;
    return app.idbPut('kopie', { bestand:'proef.txt', tekst:INHOUD, tijd:Date.now() })
      .then(function(){ return app.leesKopie(); });
  }).then(function(gelukt){
    eis('een kopie zonder stempel wordt niet getoond', gelukt, false);
    eis('de lijst blijft leeg', app.records.length, 0);
    eis('en de toestand ook', app.fileState, 'leeg');
    zetTerug();
    return app.idbDel('kopie').catch(function(){});
  }, function(e){
    zetTerug();
    eis('de groep liep door', 'uitzondering: ' + (e && e.message), 'ja');
  });
}

/* Lezen zonder toegang, toegang pas bij het opslaan. Zonder toestemming kan de
   app de werkmap niet lezen; Edge op Android onthoudt die toestemming maar tot de
   app dicht is. Tot 1352898-001 stond er dan een gele melding en stonden + en
   wijzigen uit; in 1352898-002 vroeg de app om toegang bij het openen van het
   bewerkvenster, ook als je daarna annuleerde. Nu bewerk je op de leeskopie en
   vraagt de app pas bij het opslaan om toegang. Daarna leest hij het echte bestand
   en zet daar de ene wijziging in: een noodbewerking buiten de app blijft staan. */
function testToegangBijWijzigen(){
  groep('Lezen zonder toegang, toegang pas bij het opslaan');
  var d = app.document;
  var namen = ['records','cfg','bestandsnaam','fileState','dirHandle','hasFSA','kopieRij',
               'selIndex','terug','idbGet','idbPut','idbDel',
               'laatstGelezen','laatstGrootte','cfgGelezen','cfgGrootte'];
  var bewaard = {};
  namen.forEach(function(n){ bewaard[n] = app[n]; });
  function zetTerug(){
    try { app.sluitModal(); } catch(e){}
    try { app.bergModaal('confirm'); } catch(e){}
    try { app.bergModaal('cfgModal'); } catch(e){}
    namen.forEach(function(n){ app[n] = bewaard[n]; });
    try { app.render(); } catch(e){}
  }
  function wacht(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  var idb = {};
  app.idbGet = function(k){ return Promise.resolve(idb[k]); };
  app.idbPut = function(k, v){ idb[k] = v; return Promise.resolve(); };
  app.idbDel = function(k){ delete idb[k]; return Promise.resolve(); };

  var CFG = { bestand:'events.txt', scheidingsteken:'|' };
  var KOPIE = 'A|Anna de Vries|Geboren|D19870412|1\n';
  var NOOD  = KOPIE + 'B|Bram Jansen|Geboren|D19900703|1\n';
  var map, antwoord, gevraagd;
  /* buiten: true = er is buiten de app een regel bijgekomen (een noodbewerking) */
  /* zonderStempel: een kopie zoals versies van voor 1352898-003 die bewaarden */
  function opzetten(perm, buiten, zonderStempel){
    app.kopieRij = null; app.inleesMelding = ''; app.basisTekst = undefined;
    map = maakMap();
    map.fs['events_cfg.json'] = { tekst: JSON.stringify(CFG), mtime: 500 };
    map.fs['events.txt'] = buiten ? { tekst: NOOD, mtime: 2000 } : { tekst: KOPIE, mtime: 1000 };
    antwoord = perm; gevraagd = 0;
    map.requestPermission = function(){ gevraagd++; return Promise.resolve(antwoord); };
    map.queryPermission = function(){ return Promise.resolve('prompt'); };
    map.name = 'Events';
    idb = {};
    idb['kopie'] = { bestand:'events.txt', tekst:KOPIE, tijd:Date.now() - 3600000, cfg:CFG,
                     mtime:1000, grootte:KOPIE.length, cfgMtime:500,
                     cfgGrootte:JSON.stringify(CFG).length };
    if(zonderStempel) idb['kopie'] = { bestand:'events.txt', tekst:KOPIE, tijd:Date.now() - 86400000 };
    idb['backup:events.txt'] = app.dagsleutel();
    app.dirHandle = map; app.hasFSA = true; app.bestandsnaam = ''; app.cfg = {};
    app.records = []; app.selIndex = -1; app.terug = null;
    app.kopieRij = null; app.fileState = 'auth';
    /* zoals bij het opstarten zonder toegang: alleen een kopie met stempel telt */
    return app.vulUitKopie(true).then(function(){ app.render(); });
  }
  function modaalOpen(id){ var m = d.getElementById(id); return !!m && !m.hidden; }
  /* een nieuw event via het bewerkvenster, zoals in het echt */
  function voegToe(){
    app.openModal();
    d.getElementById('fSleutel').value = 'C';
    d.getElementById('fNaam').value = 'Cees';
    d.getElementById('mOk').click();
    return wacht(400);
  }
  function melding(){ var m = d.getElementById('mMelding'); return m && !m.hidden ? m.textContent : '(geen)'; }

  return opzetten('granted', false).then(function(){
    eis('zonder toegang staat de leeskopie in de lijst', app.records.length, 1);
    eis('gelezen met het scheidingsteken uit de kopie',
        app.records[0] && app.records[0].naam, 'Anna de Vries');
    eis('zonder melding over de toegang',
        /Geen toegang/.test(d.getElementById('filebar').textContent), false);
    eis('en + staat aan', d.getElementById('btnNew').disabled, false);
    /* 1352898-026: zoeken, filteren en de periodeknoppen stonden hier uit */
    eis('zoeken staat aan op de leeskopie', d.getElementById('zoek').disabled, false);
    eis('filteren staat aan op de leeskopie',
        [d.getElementById('filterMode').disabled, d.getElementById('filterAanUit').disabled], [false, false]);
    var uitChips = function(){ return Array.prototype.filter.call(d.getElementById('chips').children,
          function(b){ return b.disabled; }).map(function(b){ return b.textContent; }).join(','); };
    var opKopie = uitChips();
    app.fileState = 'ok'; app.render(); var metBestand = uitChips();
    app.fileState = 'auth'; app.render();
    eis('de periodeknoppen staan op de leeskopie aan zoals met het bestand', opKopie, metBestand);
    d.getElementById('btnNew').click();
    return wacht(150);
  }).then(function(){
    eis('+ opent het venster meteen', modaalOpen('modal'), true);
    eis('zonder om toegang te vragen', gevraagd, 0);
    app.sluitModal();
    eis('annuleren vraagt ook niets', gevraagd, 0);
    eis('en de toestand blijft de leeskopie', app.fileState, 'auth');
    app.selIndex = 0; app.render();
    eis('met een gekozen event staat wijzigen aan', d.getElementById('btnEdit').disabled, false);
    d.getElementById('btnEdit').click();
    return wacht(150);
  }).then(function(){
    eis('wijzigen opent het gekozen event, ook zonder toegang',
        (modaalOpen('modal') && app.editIndex >= 0) ? app.records[app.editIndex].naam : '(geen venster)',
        'Anna de Vries');
    app.sluitModal();

    /* opslaan: nu pas de vraag, en het bestand was niet veranderd */
    return voegToe();
  }).then(function(){
    eis('opslaan vraagt om toegang', gevraagd, 1);
    eis('daarna is het bestand gekoppeld', app.fileState, 'ok');
    eis('en staat de wijziging in het bestand', /C\|Cees/.test(map.fs['events.txt'].tekst), true);
    eis('het venster is dicht', modaalOpen('modal'), false);
    eis('en de tabel is het bestand', app.records.length, 2);
    eis('de kopie is daarna gelijk aan het bestand',
        idb['kopie'] && idb['kopie'].tekst === map.fs['events.txt'].tekst, true);
    eis('met de stempel van het bestand', idb['kopie'] && idb['kopie'].mtime, map.fs['events.txt'].mtime);
    eis('en de configuratie', idb['kopie'] && idb['kopie'].cfg && idb['kopie'].cfg.scheidingsteken, '|');
    eis('de kopie in beeld is de nieuwe', app.kopieRij === idb['kopie'], true);
    eis('en de statusregel toont alleen het moment ervan',
        d.getElementById('cfgStatusTxt').textContent, app.kopieTijd(idb['kopie'].tijd));
    eis('dus vandaag, met de tijd',
        /^vandaag \d\d:\d\d$/.test(d.getElementById('cfgStatusTxt').textContent), true);

    /* (034) een noodbewerking buiten de app: na de toegang is het bestand anders
       dan de leeskopie waarop je werkte, dus niets schrijven en het zeggen */
    return opzetten('granted', true);
  }).then(function(){
    return voegToe();
  }).then(function(){
    eis('na een noodbewerking: opslaan vraagt om toegang', gevraagd, 1);
    eis('de regel van buiten blijft staan, jouw event komt er niet bij (034)',
        [/B\|Bram Jansen/.test(map.fs['events.txt'].tekst), /C\|Cees/.test(map.fs['events.txt'].tekst)], [true, false]);
    eis('het venster blijft open met de melding, met het verschil in regels (034)',
        [modaalOpen('modal'), melding().indexOf('events.txt is buiten de app gewijzigd (1 → 2 regels). Niet opgeslagen.') === 0], [true, true]);
    eis('en je invoer', d.getElementById('fNaam').value, 'Cees');
    eis('de tabel blijft de leeskopie tot je opnieuw inleest (035)', app.records.length, 1);
    d.getElementById('mOk').click();
    return wacht(400);
  }).then(function(){
    eis('nog eens Opslaan: weer de melding, niets geschreven (034)',
        [melding().indexOf('events.txt is buiten de app gewijzigd') === 0, /C\|Cees/.test(map.fs['events.txt'].tekst)], [true, false]);
    d.getElementById('mGewInlezen').click();
    return wacht(400);
  }).then(function(){
    eis('Opnieuw inlezen: venster dicht, de tabel is het bestand', [modaalOpen('modal'), app.records.length], [false, 2]);
    eis('en boven de lijst staat het verschil (035)', app.inleesMelding, 'events.txt opnieuw ingelezen: 1 \u2192 2 regels.');
    return voegToe();
  }).then(function(){
    eis('daarna gaat opslaan gewoon, naast de regel van buiten',
        [/B\|Bram Jansen/.test(map.fs['events.txt'].tekst), /C\|Cees/.test(map.fs['events.txt'].tekst), modaalOpen('modal')], [true, true, false]);

    /* toegang geweigerd: het venster blijft open, met je invoer */
    return opzetten('denied', false);
  }).then(function(){
    return voegToe();
  }).then(function(){
    eis('geweigerd: niets in het bestand', map.fs['events.txt'].tekst, KOPIE);
    eis('het venster blijft open', modaalOpen('modal'), true);
    eis('met je invoer erin', d.getElementById('fNaam').value, 'Cees');
    eis('en de melding: Geen toegang tot Events. Niet opgeslagen.', melding(), 'Geen toegang tot Events. Niet opgeslagen.');
    eis('de tabel blijft wat hij was', app.records.length, 1);
    eis('boven de tabel staat niets over opslaan',
        /opgeslagen/.test(d.getElementById('filebar').textContent), false);
    antwoord = 'granted';
    d.getElementById('mOk').click();
    return wacht(400);
  }).then(function(){
    eis('Opslaan nog eens vraagt opnieuw en slaat dan op', /C\|Cees/.test(map.fs['events.txt'].tekst), true);
    eis('en sluit het venster', modaalOpen('modal'), false);

    /* Opnieuw inlezen vraagt ook om toegang en leest dan het bestand */
    return opzetten('granted', true);
  }).then(function(){
    /* de knop staat in het instellingenscherm: dat eerst openen, zoals in het echt */
    app.openCfg();
    d.getElementById('cfgRefresh').click();
    return wacht(250);
  }).then(function(){
    eis('opnieuw inlezen vraagt om toegang', gevraagd, 1);
    eis('en leest daarna het bestand', app.records.length, 2);
    eis('met het verschil boven de lijst (040)', app.inleesMelding, 'events.txt opnieuw ingelezen: 1 \u2192 2 regels.');

    /* Een kopie zonder stempel (van voor 1352898-003) kan achterlopen: die werd
       niet bijgewerkt na het opslaan. Dan geldt er geen kopie, net als in Trends
       de eerste keer: eerst toegang, dan het echte bestand. */
    try { app.bergModaal('cfgModal'); } catch(e){}
    return opzetten('granted', true, true);
  }).then(function(){
